/* ===== Причал Core UI Concept C: мягкий, дружелюбный, операционный ===== */
:root{
  --bg:#f6f9fc;--card:#ffffff;--text:#12345b;--muted:#7d8da3;--line:#e6edf5;
  --accent:#20b989;--accent-dark:#11966d;--accent-soft:#e9faf4;
  --blue:#3d8bfd;--blue-soft:#edf5ff;--purple:#8b72e8;--purple-soft:#f2efff;
  --coral:#ff7272;--coral-soft:#fff0f0;--amber:#f3a43b;--amber-soft:#fff6e9;
  --danger:#d94c4c;--ok:#138a64;--warn:#b97716;--shadow:0 5px 18px rgba(41,72,112,.065);
}
html{background:#f6f9fc}body{background:linear-gradient(180deg,#fbfdff 0,#f6f9fc 34%,#f8fbfd 100%);color:var(--text)}
.wrap{max-width:920px;padding:10px 12px 100px}.top{position:sticky;top:0;z-index:30;background:rgba(250,253,255,.91);backdrop-filter:blur(18px);padding:9px 0 7px;border-bottom:1px solid rgba(230,237,245,.72)}
.brand{min-height:48px}.brand>div{min-width:0}.brand h1{font-size:19px;letter-spacing:-.35px;font-weight:850;display:flex;align-items:center;gap:7px}.brand h1::first-letter{filter:saturate(.75)}
#userLine{margin-top:2px;font-size:11px;color:#8291a5;max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#rolePill{background:var(--accent-soft);color:var(--accent-dark);border:1px solid #d2f2e7;font-weight:700;padding:5px 10px}
.small,.muted{color:var(--muted)}h2{font-size:21px;letter-spacing:-.45px;margin:8px 0 12px;font-weight:850}h3{font-size:15px;color:#183d67;font-weight:800}
.card,.order-card,.handover-card,.inspection-card,.inspection-field-card,.sub-card,.schedule-day,.inspection-store-progress,.inspection-form-row,.inspection-form-field,.form-builder-field,.order-progress{border:1px solid var(--line);box-shadow:var(--shadow);background:rgba(255,255,255,.97)}

<script>
const tg=window.Telegram?.WebApp; if(tg){tg.ready();tg.expand();}
const state={token:sessionStorage.getItem('core_token')||'',user:null,stores:[],page:'dashboard',orderTab:'new',orderFilters:{status:'',period:'today',date:'',store_id:'',supplier_id:''},orderAdminTab:'stores',orderScheduleType:'order',currentOrder:null,orderEditItems:[],employeeQuery:'',employeeStatus:'',employeePosition:'',workTab:'my',workDate:new Date(),workStoreId:'',workContext:null,shiftTab:'submit',shiftControlDate:new Date().toISOString().slice(0,10),shiftControlStore:'',shiftHistoryStore:'',shiftHistoryStatus:'',shiftFormStore:'',shiftEditingForm:null,inspectionTab:'conduct',inspectionMeta:null,inspectionForms:[],inspectionEditingForm:null,inspectionPrefillStore:'',inspectionHistoryFilters:{store_id:'',manager_id:'',date_from:'',date_to:'',has_violations:'',result:''},inspectionControlFilters:{store_id:'',severity:''},taskPrefill:null,moreNavOpen:false,kbTab:'base',kbManageTab:'sections',kbSectionId:null,kbArticleId:null,kbSections:[],kbManageSections:[],kbSearchQuery:'',kbEditingArticle:null,testTab:'my',testMeta:null,testEditing:null,testQuestionEditing:null,testActiveAttempt:null,testTimer:null,testControlFilters:{test_id:'',status:'',employee_id:'',store_id:'',role:''}};
const roleNames={seller:'Продавец',mentor:'Наставник',manager:'Управляющий',operations_director:'Операционный директор',leader:'Руководитель',admin:'Администратор'};
const statusNames={new:'Новая',accepted:'Принята',cancelled:'Отменена',skipped:'Пропуск',processing:'В работе',approved:'Обработана',sent:'Отправлена',done:'Выполнена',collected:'Собрана',handed:'Передана'};
const management=new Set(['manager','operations_director','leader','admin']);
const taskCreators=new Set(['manager','operations_director','leader','admin']);
const kbEditors=new Set(['operations_director','leader','admin']);
const testEditors=new Set(['manager','operations_director','leader','admin']);
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function flash(text,type='success'){document.getElementById('flash').innerHTML=`<div class="notice ${type}">${esc(text)}</div>`;setTimeout(()=>document.getElementById('flash').innerHTML='',3500)}
async function api(path,opt={}){const headers={'Content-Type':'application/json',...(opt.headers||{})};if(state.token)headers.Authorization='Bearer '+state.token;const r=await fetch(path,{...opt,headers});let data=null;try{data=await r.json()}catch{}if(!r.ok)throw new Error(data?.detail||`HTTP ${r.status}`);return data;}
async function uploadApi(path,formData){const headers={};if(state.token)headers.Authorization='Bearer '+state.token;const r=await fetch(path,{method:'POST',headers,body:formData});let data=null;try{data=await r.json()}catch{}if(!r.ok)throw new Error(data?.detail||`HTTP ${r.status}`);return data;}
function field(label,html){return `<div class="field"><label>${label}</label>${html}</div>`}
function selectHtml(id,items,valueKey='id',labelKey='name',placeholder='Выберите'){return `<select id="${id}"><option value="">${placeholder}</option>${items.map(x=>`<option value="${x[valueKey]}">${esc(x[labelKey])}</option>`).join('')}</select>`}
async function auth(){if(!state.token){const init=tg?.initData||'';if(!init){document.getElementById('app').innerHTML='<div class="notice error">Откройте MiniApp из Telegram-бота.</div>';return false;}const data=await api('/api/auth/telegram',{method:'POST',body:JSON.stringify({init_data:init})});if(data.status==='pending'){document.getElementById('app').innerHTML=`<div class="notice">Ваш аккаунт зарегистрирован. Ожидается подтверждение администратора.<br><br>Telegram ID: <b>${data.telegram_id}</b></div>`;return false;}state.token=data.token;sessionStorage.setItem('core_token',state.token);state.user=data.user;}else{try{state.user=await api('/api/auth/me')}catch(e){sessionStorage.removeItem('core_token');state.token='';return auth();}}
 state.stores=state.user.stores||[];document.getElementById('userLine').textContent=state.user.full_name||state.user.telegram_id;document.getElementById('rolePill').textContent=roleNames[state.user.role]||state.user.role;renderNav();const active=await refreshTestLock();if(active)await go('testing');else await go('dashboard');return true;}

 const icons={dashboard:'⌂',orders:'▣',work_schedule:'▦',shifts:'↻',tasks:'✓',employees:'♙',inspections:'◇',knowledge:'▤',cash:'₽',mentoring:'♧',plans:'↗',ratings:'★',broadcasts:'◉',admin:'⚙',testing:'🎓'};
 const primary=[['dashboard','Главная'],['orders','Заявки'],['work_schedule','График'],['shifts','Пересменки'],['tasks','Задачи']];
 const nav=document.getElementById('nav');
 nav.innerHTML=primary.map(([p,l])=>`<button data-page="${p}" onclick="go('${p}')"><span class="nav-icon">${icons[p]}</span><span class="nav-label">${l}</span></button>`).join('')+`<button id="moreNavBtn" onclick="openMoreNav()"><span class="nav-icon">•••</span><span class="nav-label">Ещё</span></button>`;
 updateNavActive();
}
function updateNavActive(){document.querySelectorAll('#nav button[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page));const primary=['dashboard','orders','work_schedule','shifts','tasks'];const mb=document.getElementById('moreNavBtn');if(mb)mb.classList.toggle('more-active',!primary.includes(state.page));}
function morePages(){const x=[['knowledge','База знаний','Регламенты, безопасность и обучение'],['testing','Тестирование','Обучение, аттестация и результаты'],['employees','Сотрудники','Команда и привязки к магазинам']];if(management.has(state.user.role))x.push(['inspections','Проверки','Контроль стандартов'],['cash','Инкассация','Операции с наличными']);x.push(['mentoring','Наставничество','Стажёры и наставники'],['plans','План/факт','Показатели магазинов'],['ratings','Рейтинг','Сводный результат']);if(management.has(state.user.role))x.push(['broadcasts','Рассылки','Сообщения по ролям']);if(state.user.role==='admin')x.push(['admin','Админ','Системные настройки']);return x;}
function openMoreNav(){if(state.testActiveAttempt){flash('Сначала завершите текущий тест','error');return}closeMoreNav();const d=document.createElement('div');d.id='moreNavSheet';d.className='sheet-backdrop';d.onclick=e=>{if(e.target===d)closeMoreNav()};d.innerHTML=`<div class="sheet"><div class="sheet-handle"></div><div class="section-title"><h2 style="margin:0">Ещё</h2><button class="icon-btn" onclick="closeMoreNav()">✕</button></div><div class="more-grid" style="margin-top:12px">${morePages().map(([p,l,sub])=>`<button class="more-item" onclick="closeMoreNav();go('${p}')"><b>${l}</b><span>${sub}</span></button>`).join('')}</div></div>`;document.body.appendChild(d)}

async function renderDashboard(){const d=await api('/api/dashboard');const first=(state.user?.full_name||'').trim().split(/\s+/)[0]||'коллега';const good=(Number(d.my_overdue_tasks)||0)===0;const quick=[['orders','▣','Заявки'],['work_schedule','▦','График'],['tasks','✓','Задачи']];if(management.has(state.user.role))quick.push(['inspections','◇','Проверки']);else quick.push(['shifts','↻','Пересменки']);quick.push(['knowledge','▤','База знаний'],['testing','🎓','Тестирование']);document.getElementById('app').innerHTML=`<div class="home-hello"><h2>Привет, ${esc(first)}!</h2><div class="home-sub">Рады видеть вас сегодня</div></div><div class="home-good"><div class="good-icon">${good?'✦':'!'}</div><div><b>${good?'Хороший день!':'Есть дела, требующие внимания'}</b><div class="small">${good?'По текущим показателям всё спокойно.':`Просроченных задач: ${d.my_overdue_tasks}`}</div></div></div><h3>Сегодня</h3><div class="home-metrics"><div class="home-metric"><strong>${d.today.orders}</strong><span>Заявки</span></div><div class="home-metric"><strong>${d.today.shifts}</strong><span>Пересменки</span></div><div class="home-metric"><strong>${d.my_overdue_tasks}</strong><span>Просрочено</span></div></div><h3>Быстрые действия</h3><div class="quick-grid">${quick.map(([p,i,l])=>`<button class="quick-action" onclick="go('${p}')"><span class="qa-icon">${i}</span><b>${l}</b></button>`).join('')}</div><div class="section-title" style="margin-top:16px"><h3 style="margin:0">Ваши магазины</h3></div>${d.stores.map(s=>`<div class="card home-store"><div><b>${esc(s.name)}</b><div class="small">Проверки ${s.components.inspections??'—'} · Задачи ${s.components.tasks??'—'} · Пересменки ${s.components.shifts??'—'}</div></div><div class="store-score">${s.score}</div></div>`).join('')||'<div class="notice">Нет закреплённых магазинов.</div>'}`;}
function orderTabs(active){return `<div class="order-tabs">
  <button class="${active==='new'?'active':''}" onclick="setOrderTab('new')">Новая</button>

</div>`}
function orderFrame(active,body){document.getElementById('app').innerHTML=`<div class="order-head"><h2>Заявки</h2><button class="icon-btn" onclick="showRelatedKnowledge('orders')">▤</button></div>${orderTabs(active)}<div id="ordersBody">${body}</div>`}
async function renderOrders(){await renderOrderTab(state.orderTab||'new')}
async function setOrderTab(tab){state.orderTab=tab;await renderOrderTab(tab)}
async function renderOrderTab(tab){state.orderTab=tab;if(tab==='new')return renderOrderNew();if(tab==='list')return renderOrderList();if(tab==='schedule')return renderOrderSchedule();if(tab==='admin')return renderOrderAdmin();if(tab==='roles')return renderOrderRoles();return renderOrderNew()}
function orderStatusClass(status){return `status-${status}`}
function orderTime(v){try{return new Date(v).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}catch{return ''}}
function orderDateTime(v){try{return new Date(v).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}catch{return v||''}}
async function loadOrderBase(){const [stores,suppliers,schedule]=await Promise.all([api('/api/order-settings/stores'),api('/api/order-settings/suppliers'),api('/api/order-settings/schedule')]);state.orderSettingsCache={stores,suppliers,schedule};return state.orderSettingsCache}

function progressStoreCard(x){const missing=(x.suppliers||[]).filter(s=>!s.done).map(s=>s.name);return `<div class="order-progress ${x.complete?'done':''}"><div><b>${esc(x.store_name)}</b><div class="small">${x.complete?'Все заявки сделаны!':`${x.done} из ${x.total} заявок`}</div>${!x.complete&&missing.length?`<div class="progress-missing">Осталось: ${missing.map(esc).join(', ')}</div>`:''}</div><span class="progress-count">${x.complete?'✓':`${x.done}/${x.total}`}</span></div>`}
async function renderOrderNew(){const [refs,progress]=await Promise.all([loadOrderBase(),api('/api/orders/today-availability')]);state.orderTodayProgress=progress;const stores=refs.stores.filter(x=>x.active);const progressHtml=(progress.stores||[]).length?`<div class="progress-block"><div class="small progress-date">Сегодня · заявки по графику</div>${progress.stores.map(progressStoreCard).join('')}</div>`:'<div class="notice">На сегодня в графике заявок нет поставщиков.</div>';
orderFrame('new',`${progressHtml}<div class="card"><h3>Новая заявка</h3>${field('Магазин',selectHtml('ordStore',stores))}<div id="ordSupplierWrap"></div><div class="field"><label class="row" style="gap:8px"><input id="ordSkip" type="checkbox" style="width:auto"> <span><b>Пропуск</b><span class="small" style="display:block">Отметьте, если по поставщику сегодня ничего не требуется</span></span></label></div><div id="ordItems"></div>${field('Комментарий','<textarea id="ordComment" placeholder="Необязательно"></textarea>')}<button class="btn" onclick="submitOrderV12()">Создать заявку</button></div>`);
const st=document.getElementById('ordStore'),skip=document.getElementById('ordSkip');st.onchange=loadNewOrderSuppliers;skip.onchange=toggleNewOrderSkip;if(stores.length===1){st.value=stores[0].id;await loadNewOrderSuppliers()}}
async function loadNewOrderSuppliers(){const storeId=+document.getElementById('ordStore').value;if(!storeId){document.getElementById('ordSupplierWrap').innerHTML='';document.getElementById('ordItems').innerHTML='';return}const sups=await api(`/api/orders/available-suppliers?store_id=${storeId}`);if(!sups.length){document.getElementById('ordSupplierWrap').innerHTML='<div class="notice">По выбранному магазину сегодня нет поставщиков по графику заявок.</div>';document.getElementById('ordItems').innerHTML='';return}document.getElementById('ordSupplierWrap').innerHTML=field('Поставщик',`<select id="ordSupplier"><option value="">Выберите поставщика</option>${sups.map(s=>`<option value="${s.id}">${s.done_today?'✓ ':''}${esc(s.name)}${s.deadline_time?` · до ${esc(s.deadline_time)}`:''}${s.done_today?' · заявка есть':''}</option>`).join('')}</select>`);document.getElementById('ordSupplier').onchange=loadOrderProductsV12;document.getElementById('ordItems').innerHTML=''}
async function loadOrderProductsV12(){const storeId=+document.getElementById('ordStore').value,supplierId=+document.getElementById('ordSupplier').value;if(!supplierId){document.getElementById('ordItems').innerHTML='';return}const ps=await api(`/api/orders/products?store_id=${storeId}&supplier_id=${supplierId}`);state.newOrderProducts=ps;const groups={};ps.forEach(p=>{const g=p.category_name||'Без категории';(groups[g]??=[]).push(p)});document.getElementById('ordItems').innerHTML=`<div class="row between" style="margin-top:12px"><h3 style="margin:0">Товары</h3><span class="small">${ps.length} позиций</span></div><div class="product-search"><span>⌕</span><input id="ordProductSearch" type="search" placeholder="Поиск товара" oninput="filterNewOrderProducts(this.value)"></div><div id="ordProductGroups">${Object.entries(groups).map(([g,items])=>`<div class="product-group" data-product-group><div class="product-group-title">${esc(g)}</div>${items.map(p=>`<div class="product-row" data-product-row data-product-name="${esc(p.name.toLowerCase())}"><div><b>${esc(p.name)}</b><div class="limit-note">${esc(p.unit)}${p.min_qty!=null?' · мин. '+p.min_qty:''}${p.max_qty!=null?' · макс. '+p.max_qty:''}${p.step_qty!=null?' · шаг '+p.step_qty:''}</div></div><input type="number" data-product="${p.id}" min="${p.min_qty??0}" ${p.max_qty!=null?`max="${p.max_qty}"`:''} step="${p.step_qty??0.001}" placeholder="0"></div>`).join('')}</div>`).join('')||'<div class="order-empty">У поставщика пока нет активных товаров.</div>'}</div>`;toggleNewOrderSkip()}
function filterNewOrderProducts(value){const q=(value||'').trim().toLowerCase();document.querySelectorAll('[data-product-group]').forEach(group=>{let visible=0;group.querySelectorAll('[data-product-row]').forEach(row=>{const show=!q||(row.dataset.productName||'').includes(q);row.style.display=show?'':'none';if(show)visible++});group.style.display=visible?'':'none'})}
function toggleNewOrderSkip(){const skip=document.getElementById('ordSkip')?.checked;const items=document.getElementById('ordItems');if(items)items.style.display=skip?'none':''}
async function submitOrderV12(){const storeId=+document.getElementById('ordStore').value,supplierEl=document.getElementById('ordSupplier');const supplierId=+(supplierEl?.value||0),skip=!!document.getElementById('ordSkip').checked;if(!storeId||!supplierId)return flash('Выберите магазин и поставщика','error');const items=skip?[]:[...document.querySelectorAll('#ordItems [data-product]')].filter(x=>+x.value>0).map(x=>({product_id:+x.dataset.product,quantity:+x.value}));try{const o=await api('/api/orders',{method:'POST',body:JSON.stringify({store_id:storeId,supplier_id:supplierId,comment:document.getElementById('ordComment').value||null,items,skip})});flash(skip?'Пропуск создан':'Заявка создана');await openOrder(o.id)}catch(e){flash(e.message,'error')}}

function activeFilterCount(){const f=state.orderFilters;return [f.status,f.period&&f.period!=='today'?f.period:'',f.store_id,f.supplier_id].filter(Boolean).length}
async function renderOrderList(){const refs=state.orderSettingsCache||await loadOrderBase();const f=state.orderFilters;const q=new URLSearchParams();if(f.status)q.set('status',f.status);if(f.store_id)q.set('store_id',f.store_id);if(f.supplier_id)q.set('supplier_id',f.supplier_id);if(f.period)q.set('period',f.period);if(f.period==='date'&&f.date)q.set('date',f.date);const orders=await api('/api/orders?'+q.toString());const filterCount=activeFilterCount();orderFrame('list',`<div class="filter-row"><button class="filter-btn compact" onclick="openOrderFilters()">⚙ Фильтр${filterCount?` · ${filterCount}`:''}</button><span class="small">Найдено: ${orders.length}</span></div>${orders.map(o=>`<div class="order-card" onclick="openOrder(${o.id})"><div class="order-meta"><div><b>${esc(o.store_name)}</b><div class="small">🚚 ${esc(o.supplier_name)}</div></div><div style="text-align:right"><div class="small">${orderTime(o.created_at)}</div><span class="pill ${orderStatusClass(o.status)}">${esc(statusNames[o.status]||o.status)}</span></div></div></div>`).join('')||'<div class="order-empty">По выбранным фильтрам заявок нет.</div>'}${orderFilterSheet(refs)}`)}
function orderFilterSheet(refs){const f=state.orderFilters;return `<div id="orderFilterSheet" class="sheet-backdrop hidden"><div class="sheet"><div class="sheet-handle"></div><div class="row between"><h3 style="margin:0">Фильтр заявок</h3><button class="icon-btn" onclick="closeOrderFilters()">✕</button></div>${field('Статус',`<select id="ofStatus"><option value="">Все статусы</option><option value="new" ${f.status==='new'?'selected':''}>Новая</option><option value="accepted" ${f.status==='accepted'?'selected':''}>Принята</option><option value="cancelled" ${f.status==='cancelled'?'selected':''}>Отменена</option><option value="skipped" ${f.status==='skipped'?'selected':''}>Пропуск</option></select>`)}${field('Дата',`<select id="ofPeriod"><option value="today" ${f.period==='today'?'selected':''}>Сегодня</option><option value="yesterday" ${f.period==='yesterday'?'selected':''}>Вчера</option><option value="week" ${f.period==='week'?'selected':''}>На этой неделе</option><option value="date" ${f.period==='date'?'selected':''}>Конкретная дата</option><option value="" ${!f.period?'selected':''}>За всё время</option></select>`)}${field('Конкретная дата',`<input id="ofDate" type="date" value="${esc(f.date||'')}">`)}${field('Магазин',`<select id="ofStore"><option value="">Все магазины</option>${refs.stores.filter(x=>x.active).map(x=>`<option value="${x.id}" ${String(f.store_id)===String(x.id)?'selected':''}>${esc(x.name)}</option>`).join('')}</select>`)}${field('Поставщик',`<select id="ofSupplier"><option value="">Все поставщики</option>${refs.suppliers.filter(x=>x.active).map(x=>`<option value="${x.id}" ${String(f.supplier_id)===String(x.id)?'selected':''}>${esc(x.name)}</option>`).join('')}</select>`)}<div class="row"><button class="btn" onclick="applyOrderFilters()">Применить</button><button class="btn secondary" onclick="resetOrderFilters()">Сбросить</button></div></div></div>`}
function openOrderFilters(){document.getElementById('orderFilterSheet')?.classList.remove('hidden')}
function closeOrderFilters(){document.getElementById('orderFilterSheet')?.classList.add('hidden')}
async function applyOrderFilters(){state.orderFilters={status:document.getElementById('ofStatus').value,period:document.getElementById('ofPeriod').value,date:document.getElementById('ofDate').value,store_id:document.getElementById('ofStore').value,supplier_id:document.getElementById('ofSupplier').value};await renderOrderList()}
async function resetOrderFilters(){state.orderFilters={status:'',period:'today',date:'',store_id:'',supplier_id:''};await renderOrderList()}

async function openOrder(id){const o=await api('/api/orders/'+id);state.currentOrder=o;state.orderEditItems=(o.items||[]).map(x=>({...x}));state.orderAvailableProducts=o.status==='new'?await api(`/api/orders/products?store_id=${o.store_id}&supplier_id=${o.supplier_id}`):[];renderOrderDetail()}
function syncOrderEditItems(){document.querySelectorAll('[data-order-edit-id]').forEach(el=>{const id=+el.dataset.orderEditId;const item=state.orderEditItems.find(x=>x.product_id===id);if(item)item.quantity=+el.value||0})}
function renderOrderDetail(){const o=state.currentOrder;if(!o)return;const editable=o.status==='new';const available=(state.orderAvailableProducts||[]).filter(p=>!state.orderEditItems.some(i=>i.product_id===p.id));orderFrame('list',`<button class="btn secondary" onclick="setOrderTab('list')">← К списку</button><div class="card"><div class="row between"><div><h3 style="margin:0">${esc(o.store_name)} — ${esc(o.supplier_name)}</h3><div class="small">Заявка #${o.id}</div></div><span class="pill ${orderStatusClass(o.status)}">${esc(statusNames[o.status]||o.status)}</span></div><div class="grid" style="margin-top:12px"><div class="metric"><span class="small">Создал</span><b style="font-size:15px">${esc(o.creator_name)}</b></div><div class="metric"><span class="small">Дата</span><b style="font-size:15px">${orderDateTime(o.created_at)}</b></div></div><h3>Товары</h3>${state.orderEditItems.length?state.orderEditItems.map(i=>`<div class="detail-product"><div><b>${esc(i.name)}</b><div class="small">${esc(i.unit)}</div></div><input type="number" data-order-edit-id="${i.product_id}" value="${i.quantity}" step="0.001" ${editable?'':'disabled'}>${editable?`<button class="icon-btn" onclick="removeOrderEditItem(${i.product_id})">🗑</button>`:'<span></span>'}</div>`).join(''):'<div class="notice">В заявке нет товаров — пропуск.</div>'}${editable?`<div class="card" style="background:#f8fafc"><b>Добавить товар</b><div class="grid">${field('Товар',`<select id="detailAddProduct"><option value="">Выберите товар</option>${available.map(p=>`<option value="${p.id}">${esc(p.name)} · ${esc(p.unit)}</option>`).join('')}</select>`)}${field('Количество','<input id="detailAddQty" type="number" min="0" step="0.001">')}</div><button class="btn secondary" onclick="addOrderEditItem()">+ Добавить</button></div><button class="btn" onclick="saveOrderDetail(${o.id})">Сохранить состав</button>`:''}<h3>Комментарий</h3><textarea id="detailOrderComment" ${editable?'':'disabled'}>${esc(o.comment||'')}</textarea>${editable?`<button class="btn secondary" style="margin-top:8px" onclick="saveOrderComment(${o.id})">Сохранить комментарий</button>`:''}</div><div class="card"><h3>Действия</h3><div class="row"><select id="detailStatus" style="max-width:180px"><option value="new" ${o.status==='new'?'selected':''}>Новая</option><option value="accepted" ${o.status==='accepted'?'selected':''}>Принята</option><option value="cancelled" ${o.status==='cancelled'?'selected':''}>Отменена</option><option value="skipped" ${o.status==='skipped'?'selected':''}>Пропуск</option></select><button class="btn" onclick="changeOrderStatus(${o.id})">Изменить статус</button></div><div class="row" style="margin-top:8px"><button class="btn secondary" onclick="copyOrderText(${o.id})">⧉ Копировать для поставщика</button><button class="btn danger" onclick="deleteOrderV12(${o.id})">🗑 Удалить</button></div><div class="small" style="margin-top:10px">Права раздела будут настраиваться позже во вкладке «Роли».</div></div>`)}
function removeOrderEditItem(productId){syncOrderEditItems();state.orderEditItems=state.orderEditItems.filter(x=>x.product_id!==productId);renderOrderDetail()}
function addOrderEditItem(){syncOrderEditItems();const pid=+document.getElementById('detailAddProduct').value,qty=+document.getElementById('detailAddQty').value;if(!pid||qty<=0)return flash('Выберите товар и количество','error');const p=(state.orderAvailableProducts||[]).find(x=>x.id===pid);if(!p)return;state.orderEditItems.push({product_id:p.id,name:p.name,unit:p.unit,quantity:qty});renderOrderDetail()}
async function saveOrderDetail(id){syncOrderEditItems();if(!state.orderEditItems.length)return flash('Добавьте хотя бы один товар','error');try{await api('/api/orders/'+id,{method:'PATCH',body:JSON.stringify({items:state.orderEditItems.map(x=>({product_id:x.product_id,quantity:x.quantity})),comment:document.getElementById('detailOrderComment')?.value||null})});flash('Заявка обновлена');await openOrder(id)}catch(e){flash(e.message,'error')}}
async function saveOrderComment(id){try{await api('/api/orders/'+id,{method:'PATCH',body:JSON.stringify({comment:document.getElementById('detailOrderComment').value||null})});flash('Комментарий сохранён');await openOrder(id)}catch(e){flash(e.message,'error')}}
async function changeOrderStatus(id){try{await api('/api/orders/'+id,{method:'PATCH',body:JSON.stringify({status:document.getElementById('detailStatus').value})});flash('Статус изменён');await openOrder(id)}catch(e){flash(e.message,'error')}}
async function deleteOrderV12(id){if(!confirm('Удалить заявку безвозвратно?'))return;try{await api('/api/orders/'+id,{method:'DELETE'});flash('Заявка удалена');state.orderTab='list';await renderOrderList()}catch(e){flash(e.message,'error')}}
async function writeClipboard(text){if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(text);return}const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}
async function copyOrderText(id){try{const d=await api(`/api/orders/${id}/share-text`);await writeClipboard(d.text);flash('Текст заявки скопирован')}catch(e){flash(e.message,'error')}}

function supplierColors(id){const palette=[['#e9f0ff','#1849a9'],['#dcfae6','#067647'],['#fef0c7','#b54708'],['#f4ebff','#6938ef'],['#fee4e2','#b42318'],['#e0f2fe','#026aa2'],['#fce7f6','#c11574'],['#ecfdf3','#027a48']];return palette[Math.abs(Number(id)||0)%palette.length]}
function supplierChip(s){const [bg,fg]=supplierColors(s.id);const short=s.name.length>8?s.name.slice(0,7)+'…':s.name;return `<span class="supplier-chip compact-chip" title="${esc(s.name)}" style="background:${bg};color:${fg}">${esc(short)}</span>`}
async function renderOrderSchedule(){const d=await api('/api/order-settings/schedule');state.orderScheduleData=d;const days=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];const activeStores=d.stores.filter(x=>x.active),activeSuppliers=d.suppliers.filter(x=>x.active);const cells={};activeStores.forEach(s=>{cells[s.id]=Array.from({length:7},()=>[])});d.rules.forEach(r=>{const sup=activeSuppliers.find(s=>s.id===r.supplier_id);if(cells[r.store_id]&&sup)cells[r.store_id][r.weekday].push(sup)});orderFrame('schedule',`<div class="schedule-caption"><div><b>График заявок</b><div class="small">Пн–Вс · редактирование перенесено в «Админ»</div></div></div><div class="week-wrap compact-week"><table class="week-grid"><thead><tr><th class="store-col">Точка</th>${days.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${activeStores.map(s=>`<tr><th class="store-cell" title="${esc(s.name)}">${esc(s.name)}</th>${cells[s.id].map(arr=>`<td>${arr.map(supplierChip).join('')||'<span class="empty-dot">·</span>'}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`) }

function orderAdminTabs(){const tabs=[['stores','Магазины'],['suppliers','Поставщики'],['schedule','График заявок'],['products','Товары'],['categories','Категории'],['units','Ед. изм.'],['limits','Лимиты'],['assortment','Ассортимент'],['prices','Прайс-листы']];return `<div class="settings-tabs">${tabs.map(([k,l])=>`<button class="${state.orderAdminTab===k?'active':''}" onclick="setOrderAdminTab('${k}')">${l}</button>`).join('')}</div>`}
async function setOrderAdminTab(tab){state.orderAdminTab=tab;await renderOrderAdmin()}
async function renderOrderAdmin(){const [stores,suppliers,products,categories,units,limits,prices,schedule]=await Promise.all(['/api/order-settings/stores','/api/order-settings/suppliers','/api/order-settings/products','/api/order-settings/categories','/api/order-settings/units','/api/order-settings/limits','/api/order-settings/price-lists','/api/order-settings/schedule'].map(api));state.orderAdminData={stores,suppliers,products,categories,units,limits,prices,schedule};const body=`${orderAdminTabs()}${renderOrderAdminPanel()}`;orderFrame('admin',body);if(state.orderAdminTab==='assortment'){const el=document.getElementById('oaAssStore');if(el)el.onchange=loadAssortment}if(state.orderAdminTab==='schedule'){const a=document.getElementById('oaSchStore'),b=document.getElementById('oaSchSupplier');if(a)a.onchange=prefillAdminOrderSchedule;if(b)b.onchange=prefillAdminOrderSchedule}}
function renderOrderAdminPanel(){const d=state.orderAdminData,t=state.orderAdminTab;const act=x=>x.active?'<span class="pill green">Активен</span>':'<span class="pill">Отключён</span>';if(t==='stores')return `<div class="card"><h3>Магазины</h3><div class="grid">${field('Название','<input id="oaStoreName">')}${field('Код','<input id="oaStoreCode">')}</div><button class="btn" onclick="oaAddStore()">+ Добавить</button><div class="compact-list">${d.stores.map(x=>`<div class="list-item"><div><b>${esc(x.name)}</b><div class="small">${esc(x.code||'Без кода')} · ${act(x)}</div></div><div class="admin-actions"><button class="icon-btn" onclick="oaEditStore(${x.id})">✏️</button><button class="icon-btn" onclick="oaToggle('stores',${x.id},${!x.active})">${x.active?'⏸':'▶'}</button><button class="icon-btn" onclick="oaDelete('stores',${x.id})">🗑</button></div></div>`).join('')}</div></div>`;
if(t==='suppliers')return `<div class="card"><h3>Поставщики</h3><div class="grid">${field('Название','<input id="oaSupName">')}${field('Заявка до','<input id="oaSupDeadline" type="time" value="10:00">')}</div><button class="btn" onclick="oaAddSupplier()">+ Добавить</button><div class="compact-list">${d.suppliers.map(x=>`<div class="list-item"><div><b>${esc(x.name)}</b><div class="small">до ${esc(x.deadline_time)} · ${act(x)}</div></div><div class="admin-actions"><button class="icon-btn" onclick="oaEditSupplier(${x.id})">✏️</button><button class="icon-btn" onclick="oaToggle('suppliers',${x.id},${!x.active})">${x.active?'⏸':'▶'}</button><button class="icon-btn" onclick="oaDelete('suppliers',${x.id})">🗑</button></div></div>`).join('')}</div></div>`;
if(t==='schedule'){const days=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];return `<div class="card"><h3>Редактор графика заявок</h3><div class="grid">${field('Магазин',selectHtml('oaSchStore',d.stores.filter(x=>x.active)))}${field('Поставщик',selectHtml('oaSchSupplier',d.suppliers.filter(x=>x.active)))}</div><div class="field"><label>Дни приёма заявки</label><div class="day-checks">${days.map((x,i)=>`<label class="pill"><input type="checkbox" data-admin-sch-day="${i}" style="width:auto"> ${x}</label>`).join('')}</div></div><button class="btn" onclick="saveAdminOrderSchedule()">Сохранить график</button><div class="small" style="margin-top:8px">Только поставщики из этого графика доступны при создании заявки в соответствующий день.</div></div>`}
if(t==='categories')return `<div class="card"><h3>Категории</h3><div class="grid">${field('Название','<input id="oaCatName">')}${field('Поставщик (необязательно)',`<select id="oaCatSupplier"><option value="">Общая категория</option>${d.suppliers.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select>`)}</div><button class="btn" onclick="oaAddCategory()">+ Добавить</button><div class="compact-list">${d.categories.map(x=>`<div class="list-item"><div><b>${esc(x.name)}</b><div class="small">${esc(d.suppliers.find(s=>s.id===x.supplier_id)?.name||'Общая')} · ${act(x)}</div></div><div class="admin-actions"><button class="icon-btn" onclick="oaEditCategory(${x.id})">✏️</button><button class="icon-btn" onclick="oaToggle('categories',${x.id},${!x.active})">${x.active?'⏸':'▶'}</button><button class="icon-btn" onclick="oaDelete('categories',${x.id})">🗑</button></div></div>`).join('')}</div></div>`;
if(t==='units')return `<div class="card"><h3>Единицы измерения</h3><div class="grid">${field('Название','<input id="oaUnitName" placeholder="Кега">')}${field('Сокращение','<input id="oaUnitShort" placeholder="кег">')}</div><button class="btn" onclick="oaAddUnit()">+ Добавить</button><div class="compact-list">${d.units.map(x=>`<div class="list-item"><div><b>${esc(x.name)}</b><div class="small">${esc(x.short_name)} · ${act(x)}</div></div><div class="admin-actions"><button class="icon-btn" onclick="oaEditUnit(${x.id})">✏️</button><button class="icon-btn" onclick="oaToggle('units',${x.id},${!x.active})">${x.active?'⏸':'▶'}</button><button class="icon-btn" onclick="oaDelete('units',${x.id})">🗑</button></div></div>`).join('')}</div></div>`;
if(t==='products')return `<div class="card"><div class="row between"><h3 style="margin:0">Товары</h3><button class="btn secondary mini" onclick="oaDownloadImportTemplate()">Шаблон</button></div><div class="import-box"><b>Массовый импорт</b><div class="small">XLSX, CSV или TSV. Столбцы: Товар, Поставщик, Категория, Единица. Поставщики должны быть созданы заранее.</div><input id="oaImportFile" type="file" accept=".xlsx,.csv,.tsv,.txt"><button class="btn secondary" onclick="oaImportProducts()">Импортировать таблицу</button></div><hr style="border:0;border-top:1px solid var(--line);margin:14px 0"><div class="grid">${field('Название','<input id="oaProdName">')}${field('Поставщик',selectHtml('oaProdSupplier',d.suppliers.filter(x=>x.active)))}${field('Категория',`<select id="oaProdCategory"><option value="">Без категории</option>${d.categories.filter(x=>x.active).map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select>`)}${field('Единица',`<select id="oaProdUnit"><option value="шт">шт</option>${d.units.filter(x=>x.active).map(u=>`<option value="${esc(u.short_name)}">${esc(u.short_name)} — ${esc(u.name)}</option>`).join('')}</select>`)}</div><button class="btn" onclick="oaAddProduct()">+ Добавить вручную</button><div class="compact-list">${d.products.map(x=>`<div class="list-item"><div><b>${esc(x.name)}</b><div class="small">${esc(d.suppliers.find(s=>s.id===x.supplier_id)?.name||'—')} · ${esc(x.unit)} · ${act(x)}</div></div><div class="admin-actions"><button class="icon-btn" onclick="oaEditProduct(${x.id})">✏️</button><button class="icon-btn" onclick="oaToggle('products',${x.id},${!x.active})">${x.active?'⏸':'▶'}</button><button class="icon-btn" onclick="oaDelete('products',${x.id})">🗑</button></div></div>`).join('')}</div></div>`;
if(t==='limits')return `<div class="card"><h3>Лимиты по товарам</h3><div class="grid">${field('Товар',selectHtml('oaLimProduct',d.products.filter(x=>x.active)))}${field('Магазин',`<select id="oaLimStore"><option value="">Все магазины</option>${d.stores.filter(x=>x.active).map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select>`)}${field('Минимум','<input id="oaLimMin" type="number" step="0.001">')}${field('Максимум','<input id="oaLimMax" type="number" step="0.001">')}${field('Шаг','<input id="oaLimStep" type="number" step="0.001">')}</div><button class="btn" onclick="oaSaveLimit()">Сохранить лимит</button>${d.limits.map(x=>`<div class="list-item row between"><div><b>${esc(x.product_name)}</b><div class="small">${esc(x.store_name)} · мин ${x.min_qty??'—'} · макс ${x.max_qty??'—'} · шаг ${x.step_qty??'—'}</div></div><div class="admin-actions"><button class="icon-btn" onclick="oaEditLimit(${x.id})">✏️</button><button class="icon-btn" onclick="oaDelete('limits',${x.id})">🗑</button></div></div>`).join('')}</div>`;
if(t==='assortment')return `<div class="card"><h3>Ассортимент по магазинам</h3>${field('Магазин',selectHtml('oaAssStore',d.stores.filter(x=>x.active)))}<div id="oaAssList" class="muted">Выберите магазин.</div></div>`;
if(t==='prices')return `<div class="card"><h3>Прайс-листы</h3><div class="grid">${field('Поставщик',selectHtml('oaPriceSupplier',d.suppliers.filter(x=>x.active)))}${field('Название','<input id="oaPriceTitle" placeholder="Например: Прайс сентябрь">')}</div><button class="btn" onclick="oaRequestPriceList()">📎 Прикрепить прайс-лист</button><div class="small" style="margin-top:8px">После нажатия отправьте PDF/Excel/другой документ прямо в чат с ботом.</div>${d.prices.map(x=>`<div class="list-item row between"><div><b>${esc(x.title)}</b><div class="small">${esc(x.supplier_name)} · ${esc(x.file_name||'файл')}</div></div><div class="admin-actions"><button class="icon-btn" onclick="oaDownloadPrice(${x.id})">⬇</button><button class="icon-btn" onclick="oaDelete('price-lists',${x.id})">🗑</button></div></div>`).join('')}</div>`;return ''}
function prefillAdminOrderSchedule(){const store=+document.getElementById('oaSchStore')?.value,sup=+document.getElementById('oaSchSupplier')?.value;document.querySelectorAll('[data-admin-sch-day]').forEach(x=>x.checked=false);if(!store||!sup)return;(state.orderAdminData.schedule.rules||[]).filter(r=>r.store_id===store&&r.supplier_id===sup&&r.active).forEach(r=>{const el=document.querySelector(`[data-admin-sch-day="${r.weekday}"]`);if(el)el.checked=true})}
async function saveAdminOrderSchedule(){const store=+document.getElementById('oaSchStore').value,supplier=+document.getElementById('oaSchSupplier').value;if(!store||!supplier)return flash('Выберите магазин и поставщика','error');const weekdays=[...document.querySelectorAll('[data-admin-sch-day]:checked')].map(x=>+x.dataset.adminSchDay);await api('/api/order-settings/schedule',{method:'PUT',body:JSON.stringify({store_id:store,supplier_id:supplier,weekdays})});flash('График заявок сохранён');await renderOrderAdmin()}
async function oaAddStore(){await api('/api/order-settings/stores',{method:'POST',body:JSON.stringify({name:document.getElementById('oaStoreName').value,code:document.getElementById('oaStoreCode').value||null})});flash('Магазин добавлен');renderOrderAdmin()}
async function oaAddSupplier(){await api('/api/order-settings/suppliers',{method:'POST',body:JSON.stringify({name:document.getElementById('oaSupName').value,deadline_time:document.getElementById('oaSupDeadline').value})});flash('Поставщик добавлен');renderOrderAdmin()}
async function oaAddCategory(){await api('/api/order-settings/categories',{method:'POST',body:JSON.stringify({name:document.getElementById('oaCatName').value,supplier_id:document.getElementById('oaCatSupplier').value?+document.getElementById('oaCatSupplier').value:null})});flash('Категория добавлена');renderOrderAdmin()}
async function oaAddUnit(){await api('/api/order-settings/units',{method:'POST',body:JSON.stringify({name:document.getElementById('oaUnitName').value,short_name:document.getElementById('oaUnitShort').value})});flash('Единица добавлена');renderOrderAdmin()}
async function oaAddProduct(){await api('/api/order-settings/products',{method:'POST',body:JSON.stringify({name:document.getElementById('oaProdName').value,supplier_id:+document.getElementById('oaProdSupplier').value,category_id:document.getElementById('oaProdCategory').value?+document.getElementById('oaProdCategory').value:null,unit:document.getElementById('oaProdUnit').value})});flash('Товар добавлен');renderOrderAdmin()}
async function oaToggle(kind,id,active){await api(`/api/order-settings/${kind}/${id}`,{method:'PATCH',body:JSON.stringify({active})});renderOrderAdmin()}
async function oaDelete(kind,id){if(!confirm('Удалить запись? Если она уже используется, Core предложит её отключить.'))return;try{await api(`/api/order-settings/${kind}/${id}`,{method:'DELETE'});flash('Удалено');renderOrderAdmin()}catch(e){flash(e.message,'error')}}
async function oaEditStore(id){const x=state.orderAdminData.stores.find(x=>x.id===id),name=prompt('Название магазина',x.name);if(name===null)return;const code=prompt('Код магазина',x.code||'');await api(`/api/order-settings/stores/${id}`,{method:'PATCH',body:JSON.stringify({name,code:code||null})});renderOrderAdmin()}
async function oaEditSupplier(id){const x=state.orderAdminData.suppliers.find(x=>x.id===id),name=prompt('Название поставщика',x.name);if(name===null)return;const deadline=prompt('Срок заявки HH:MM',x.deadline_time);await api(`/api/order-settings/suppliers/${id}`,{method:'PATCH',body:JSON.stringify({name,deadline_time:deadline})});renderOrderAdmin()}
async function oaEditCategory(id){const d=state.orderAdminData,x=d.categories.find(x=>x.id===id),name=prompt('Название категории',x.name);if(name===null)return;const current=d.suppliers.find(s=>s.id===x.supplier_id)?.name||'';const supplierName=prompt('Поставщик (оставьте пустым для общей категории)',current);if(supplierName===null)return;const sup=supplierName.trim()?d.suppliers.find(s=>s.name.toLowerCase()===supplierName.trim().toLowerCase()):null;if(supplierName.trim()&&!sup)return flash('Поставщик с таким названием не найден','error');await api(`/api/order-settings/categories/${id}`,{method:'PATCH',body:JSON.stringify({name,supplier_id:sup?sup.id:null})});renderOrderAdmin()}
async function oaEditUnit(id){const x=state.orderAdminData.units.find(x=>x.id===id),name=prompt('Название',x.name);if(name===null)return;const short_name=prompt('Сокращение',x.short_name);await api(`/api/order-settings/units/${id}`,{method:'PATCH',body:JSON.stringify({name,short_name})});renderOrderAdmin()}
async function oaEditProduct(id){const d=state.orderAdminData,x=d.products.find(x=>x.id===id),name=prompt('Название товара',x.name);if(name===null)return;const currentSup=d.suppliers.find(s=>s.id===x.supplier_id)?.name||'',supplierName=prompt('Поставщик',currentSup);if(supplierName===null)return;const sup=d.suppliers.find(s=>s.name.toLowerCase()===supplierName.trim().toLowerCase());if(!sup)return flash('Поставщик с таким названием не найден','error');const currentCat=d.categories.find(c=>c.id===x.category_id)?.name||'',categoryName=prompt('Категория (можно оставить пустой)',currentCat);if(categoryName===null)return;const cat=categoryName.trim()?d.categories.find(c=>c.name.toLowerCase()===categoryName.trim().toLowerCase()):null;if(categoryName.trim()&&!cat)return flash('Категория с таким названием не найдена','error');const unit=prompt('Единица измерения',x.unit);if(unit===null)return;await api(`/api/order-settings/products/${id}`,{method:'PATCH',body:JSON.stringify({name,supplier_id:sup.id,category_id:cat?cat.id:null,unit})});renderOrderAdmin()}
async function oaSaveLimit(){const body={product_id:+document.getElementById('oaLimProduct').value,store_id:document.getElementById('oaLimStore').value?+document.getElementById('oaLimStore').value:null,min_qty:document.getElementById('oaLimMin').value?+document.getElementById('oaLimMin').value:null,max_qty:document.getElementById('oaLimMax').value?+document.getElementById('oaLimMax').value:null,step_qty:document.getElementById('oaLimStep').value?+document.getElementById('oaLimStep').value:null,active:true};await api('/api/order-settings/limits',{method:'POST',body:JSON.stringify(body)});flash('Лимит сохранён');renderOrderAdmin()}
async function oaEditLimit(id){const x=state.orderAdminData.limits.find(x=>x.id===id);const min=prompt('Минимум',x.min_qty??''),max=prompt('Максимум',x.max_qty??''),step=prompt('Шаг',x.step_qty??'');await api(`/api/order-settings/limits/${id}`,{method:'PATCH',body:JSON.stringify({min_qty:min===''?null:+min,max_qty:max===''?null:+max,step_qty:step===''?null:+step})});renderOrderAdmin()}
async function oaRequestPriceList(){if(!document.getElementById('oaPriceSupplier').value)return flash('Выберите поставщика','error');await api('/api/order-settings/price-lists/request',{method:'POST',body:JSON.stringify({supplier_id:+document.getElementById('oaPriceSupplier').value,title:document.getElementById('oaPriceTitle').value||null})});flash('Теперь отправьте файл в чат с ботом');tg?.close?.()}
async function oaDownloadPrice(id){const item=state.orderAdminData.prices.find(x=>x.id===id),name=item?.file_name||'price-list';try{const r=await fetch(`/api/order-settings/price-lists/${id}/content`,{headers:{Authorization:'Bearer '+state.token}});if(!r.ok)throw new Error('Не удалось скачать файл');const blob=await r.blob(),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name||'price-list';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}catch(e){flash(e.message,'error')}}
async function oaDownloadImportTemplate(){try{const r=await fetch('/api/order-settings/products/import-template',{headers:{Authorization:'Bearer '+state.token}});if(!r.ok)throw new Error('Не удалось скачать шаблон');const blob=await r.blob(),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='products_import_template.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}catch(e){flash(e.message,'error')}}
async function oaImportProducts(){const input=document.getElementById('oaImportFile');const file=input?.files?.[0];if(!file)return flash('Выберите таблицу','error');const fd=new FormData();fd.append('file',file);try{const r=await uploadApi('/api/order-settings/products/import',fd);const err=(r.errors||[]).length;flash(`Импорт: добавлено ${r.inserted}, обновлено ${r.updated}${err?`, ошибок ${err}`:''}`,err?'error':'success');await renderOrderAdmin()}catch(e){flash(e.message,'error')}}
async function loadAssortment(){const store=+document.getElementById('oaAssStore').value;const list=document.getElementById('oaAssList');if(!store){if(list)list.innerHTML='Выберите магазин.';return}const rows=await api('/api/order-settings/assortment?store_id='+store);list.innerHTML=rows.map(x=>`<label class="list-item row"><input type="checkbox" style="width:auto" ${x.enabled?'checked':''} onchange="toggleAssortment(${store},${x.id},this.checked)"><span><b>${esc(x.name)}</b><span class="small" style="display:block">${esc(x.unit)}</span></span></label>`).join('')||'<div class="order-empty">Нет товаров.</div>'}
async function toggleAssortment(store,product,enabled){await api('/api/order-settings/assortment',{method:'PUT',body:JSON.stringify({store_id:store,product_id:product,enabled})})}
function renderOrderRoles(){orderFrame('roles',`<div class="card"><h3>Роли и права</h3><div class="notice">Редактор ролей будет настроен после реализации всех основных блоков Причал Core.</div><p>Сейчас функционал раздела «Заявки» доступен активным пользователям. Позже здесь появятся детальные галочки доступа к созданию заявок, статусам, справочникам, графикам, прайс-листам и видимости по магазинам.</p></div>`) }

const shiftStatusNames={draft:'Черновик',review:'На проверке',accepted:'Принята',accepted_with_remarks:'Принята с замечаниями',rejected:'Не принята',missing:'Не сдана',expected:'Ожидается'};
const shiftStatusIcons={draft:'📝',review:'🔵',accepted:'✅',accepted_with_remarks:'🟠',rejected:'🔴',missing:'❌',expected:'⏳'};
function shiftTabs(active){return `<div class="handover-tabs"><button class="${active==='submit'?'active':''}" onclick="setShiftTab('submit')">Сдать</button><button class="${active==='control'?'active':''}" onclick="setShiftTab('control')">Контроль</button><button class="${active==='history'?'active':''}" onclick="setShiftTab('history')">История</button><button class="${active==='admin'?'active':''}" onclick="setShiftTab('admin')">Админ</button></div>`}
function shiftFrame(active,body){document.getElementById('app').innerHTML=`<div class="order-head"><h2>Пересменки</h2><button class="icon-btn" onclick="showRelatedKnowledge('shifts')">▤</button></div>${shiftTabs(active)}${body}`}
async function renderShifts(){await setShiftTab(state.shiftTab||'submit')}
async function setShiftTab(tab){state.shiftTab=tab;try{if(tab==='submit')return await renderShiftSubmit();if(tab==='control')return await renderShiftControl();if(tab==='history')return await renderShiftHistory();if(tab==='admin')return await renderShiftAdmin()}catch(e){shiftFrame(tab,`<div class="notice error">${esc(e.message)}</div>`)}}
function shiftTypeName(x){return x==='day'?'Дневная смена':'Ночная смена'}
function shiftDueText(x){if(x.shift_type==='day')return 'Сдать с 19:30 до 20:10';return 'Сдать с 07:30 до 08:10 следующего дня'}
function statusPill(status){return `<span class="handover-status hs-${status}">${shiftStatusIcons[status]||'•'} ${esc(shiftStatusNames[status]||status)}</span>`}
async function renderShiftSubmit(){const today=new Date(),from=new Date(today);from.setDate(from.getDate()-14);const to=new Date(today);to.setDate(to.getDate()+14);const data=await api(`/api/shifts/mine?date_from=${from.toISOString().slice(0,10)}&date_to=${to.toISOString().slice(0,10)}`);if(!data.employee){shiftFrame('submit','<div class="notice">Ваш Telegram-аккаунт не связан с карточкой сотрудника. Свяжите его в разделе «Сотрудники».</div>');return}const items=(data.items||[]).map(x=>{const r=x.report;let action='';if(!x.template_id&&!r)action='<span class="small">Форма для этой точки ещё не настроена</span>';else if(!r)action=`<button class="btn mini" onclick="openShiftDraft(${x.assignment_id})">Заполнить</button>`;else if(['draft','rejected'].includes(r.status))action=`<button class="btn mini" onclick="openShiftReport(${r.id},true)">${r.status==='rejected'?'Исправить':'Продолжить'}</button>`;else action=`<button class="btn secondary mini" onclick="openShiftReport(${r.id},false)">Открыть</button>`;return `<div class="handover-card"><div class="row between"><div><b>${esc(x.store_name)}</b><div class="small">${dateRu(x.work_date)} · ${shiftTypeName(x.shift_type)}</div></div>${r?statusPill(r.status):statusPill(x.due_state==='late'?'missing':'expected')}</div><div class="small" style="margin-top:6px">${shiftDueText(x)}</div>${r?.status==='rejected'&&r.review_comment?`<div class="remark-box">${esc(r.review_comment)}</div>`:''}<div class="row" style="margin-top:9px">${action}</div></div>`}).join('');shiftFrame('submit',`<div class="notice"><b>${esc(data.employee.name)}</b><br><span class="small">Здесь отображаются ваши смены по графику и состояние пересменок.</span></div>${items||'<div class="handover-empty">В ближайшие дни в графике нет назначенных смен.</div>'}`)}
async function openShiftDraft(assignmentId){try{const r=await api('/api/shifts/drafts',{method:'POST',body:JSON.stringify({assignment_id:assignmentId})});await renderShiftForm(r)}catch(e){flash(e.message,'error')}}
async function openShiftReport(id,editable=false){try{const r=await api(`/api/shifts/reports/${id}`);if(editable&&['draft','rejected'].includes(r.status))return await renderShiftForm(r);return renderShiftReadOnly(r,false)}catch(e){flash(e.message,'error')}}
function shiftInput(v){const value=v.value??'';if(v.field_type==='boolean')return `<select data-shift-value="${v.field_id}"><option value="">—</option><option value="true" ${value===true?'selected':''}>Да</option><option value="false" ${value===false?'selected':''}>Нет</option></select>`;if(v.field_type==='number')return `<input data-shift-value="${v.field_id}" type="number" step="0.01" value="${esc(value)}">`;if(v.field_type==='textarea')return `<textarea data-shift-value="${v.field_id}">${esc(value)}</textarea>`;if(v.field_type==='select'){const opts=Array.isArray(v.options?.options)?v.options.options:[];return `<select data-shift-value="${v.field_id}"><option value="">—</option>${opts.map(o=>`<option value="${esc(o)}" ${String(value)===String(o)?'selected':''}>${esc(o)}</option>`).join('')}</select>`}return `<input data-shift-value="${v.field_id}" value="${esc(value)}">`}
function shiftFieldRemark(v){return (v.remarks||[]).map(x=>`<div class="remark-box"><b>Замечание управляющего</b><br>${esc(x)}</div>`).join('')}
async function renderShiftForm(r){const fields=(r.values||[]).map(v=>{if(v.field_type==='photo')return `<div class="handover-field ${v.remarks?.length?'remark':''}"><div class="row between"><b>${esc(v.label)}${v.required?' *':''}</b><span class="photo-count">Фото: ${v.photo_count}</span></div>${shiftFieldRemark(v)}<div class="photo-field"><span class="small">Фото отправляется в чат с ботом и привязывается к этому пункту.</span><button class="btn secondary mini" onclick="saveShiftDraft(${r.id},false).then(()=>requestShiftFieldPhoto(${v.value_id},'${esc(v.label).replace(/'/g,"&#39;")}'))">📷 Добавить</button></div>${v.photo_count?`<button class="btn secondary mini" onclick="showShiftPhotos(${v.value_id})">Посмотреть фото</button>`:''}</div>`;return `<div class="handover-field ${v.remarks?.length?'remark':''}"><b>${esc(v.label)}${v.required?' *':''}</b>${shiftFieldRemark(v)}<div style="margin-top:7px">${shiftInput(v)}</div></div>`}).join('');const general=(r.general_remarks||[]).map(x=>`<div class="remark-box"><b>Общее замечание</b><br>${esc(x)}</div>`).join('');shiftFrame('submit',`<div class="row between"><button class="btn secondary mini" onclick="setShiftTab('submit')">← Назад</button>${statusPill(r.status)}</div><div class="card"><b>${esc(r.store_name)}</b><div class="small">${dateRu(r.work_date)} · ${shiftTypeName(r.shift_kind)} · версия ${r.revision}</div>${general}</div>${fields}<div class="row"><button class="btn secondary" onclick="saveShiftDraft(${r.id},true)">Сохранить</button><button class="btn" onclick="submitShiftForReview(${r.id})">Отправить на проверку</button></div>`)}
function collectShiftValues(){const out={};document.querySelectorAll('[data-shift-value]').forEach(el=>{let v=el.value;if(el.tagName==='SELECT'&&(v==='true'||v==='false'))v=v==='true';else if(el.type==='number'&&v!=='')v=+v;out[el.dataset.shiftValue]=v});return out}
async function saveShiftDraft(id,show=true){try{await api(`/api/shifts/reports/${id}/draft`,{method:'PATCH',body:JSON.stringify({values:collectShiftValues()})});if(show)flash('Черновик сохранён');return true}catch(e){flash(e.message,'error');throw e}}
async function submitShiftForReview(id){try{await api(`/api/shifts/reports/${id}/submit`,{method:'POST',body:JSON.stringify({values:collectShiftValues()})});flash('Пересменка отправлена управляющему на проверку');await setShiftTab('submit')}catch(e){flash(e.message,'error')}}
async function requestShiftFieldPhoto(valueId,label){try{await api('/api/photos/request',{method:'POST',body:JSON.stringify({entity_type:'shift_report_field',entity_id:valueId,label})});flash('Отправьте фото в чат с ботом');tg?.close?.()}catch(e){flash(e.message,'error')}}
async function showShiftPhotos(valueId){try{const rows=await api(`/api/photos?entity_type=shift_report_field&entity_id=${valueId}`);if(!rows.length)return flash('Фото пока нет','error');showSheet(`<h3>Фото</h3><div id="shiftPhotoGallery"><div class="loading">Загрузка фото…</div></div>`);const box=document.getElementById('shiftPhotoGallery');box.innerHTML='';for(const p of rows){const r=await fetch(`/api/photos/${p.id}/content`,{headers:{Authorization:'Bearer '+state.token}});if(!r.ok)continue;const blob=await r.blob(),url=URL.createObjectURL(blob);box.insertAdjacentHTML('beforeend',`<img src="${url}" style="width:100%;border-radius:12px;margin:6px 0" alt="Фото пересменки">`)}if(!box.innerHTML)box.innerHTML='<div class="notice error">Не удалось загрузить фото.</div>'}catch(e){flash(e.message,'error')}}
async function renderShiftControl(){const stores=await api('/api/reference/stores');if(!state.shiftControlDate)state.shiftControlDate=new Date().toISOString().slice(0,10);let qs=`control_date=${state.shiftControlDate}`;if(state.shiftControlStore)qs+=`&store_id=${state.shiftControlStore}`;const data=await api('/api/shifts/control?'+qs);const s=data.summary||{};const cards=(data.items||[]).map(x=>{const r=x.report;const clickable=r?`onclick="openShiftReview(${r.id})"`:'';return `<div class="handover-card ${r?'clickable':''}" ${clickable}><div class="row between"><div><b>${esc(x.store_name)}</b><div class="small">${esc(x.employee_name)} · ${shiftTypeName(x.shift_type)}</div></div>${statusPill(x.status)}</div>${r?`<div class="small" style="margin-top:6px">Отправлена: ${new Date(r.submitted_at).toLocaleString('ru-RU')} · замечаний системы: ${r.issues_count}</div>`:`<div class="small" style="margin-top:6px">${x.status==='expected'?'Срок сдачи ещё не наступил':'Пересменка не получена'}</div>`}</div>`}).join('');shiftFrame('control',`<div class="handover-filter">${field('Дата',`<input id="shiftCtrlDate" type="date" value="${state.shiftControlDate}" onchange="state.shiftControlDate=this.value;renderShiftControl()">`)}${field('Магазин',`<select id="shiftCtrlStore" onchange="state.shiftControlStore=this.value;renderShiftControl()"><option value="">Все магазины</option>${stores.map(x=>`<option value="${x.id}" ${String(state.shiftControlStore)===String(x.id)?'selected':''}>${esc(x.name)}</option>`).join('')}</select>`)}</div><div class="control-summary"><div class="control-metric"><span class="small">На проверке</span><b>${s.review||0}</b></div><div class="control-metric"><span class="small">Принято</span><b>${s.accepted||0}</b></div><div class="control-metric"><span class="small">С замечаниями</span><b>${s.remarks||0}</b></div><div class="control-metric"><span class="small">Не принято</span><b>${s.rejected||0}</b></div><div class="control-metric"><span class="small">Не сдано</span><b>${s.missing||0}</b></div><div class="control-metric"><span class="small">Ожидается</span><b>${s.expected||0}</b></div></div>${cards||'<div class="handover-empty">На эту дату смен по графику нет.</div>'}`)}
function displayShiftValue(v){if(v.field_type==='photo')return `📷 ${v.photo_count} фото`;if(v.field_type==='boolean')return v.value===true?'Да':v.value===false?'Нет':'—';if(v.value===null||v.value===undefined||v.value==='')return '—';return esc(v.value)}
async function openShiftReview(id){try{const r=await api(`/api/shifts/reports/${id}`);if(r.status!=='review')return renderShiftReadOnly(r,true);const issueIds=new Set((r.issues||[]).map(x=>x.field_id));const fields=(r.values||[]).map(v=>`<div class="handover-field ${issueIds.has(v.field_id)?'issue':''}"><div class="row between"><b>${esc(v.label)}</b>${issueIds.has(v.field_id)?'<span class="small">⚠ отклонение</span>':''}</div><div class="handover-value">${displayShiftValue(v)}</div>${v.field_type==='photo'&&v.photo_count?`<button class="btn secondary mini" onclick="showShiftPhotos(${v.value_id})">Посмотреть фото</button>`:''}${field('Замечание к пункту',`<textarea data-review-remark="${v.field_id}" placeholder="Необязательно"></textarea>`)}</div>`).join('');shiftFrame('control',`<div class="row between"><button class="btn secondary mini" onclick="renderShiftControl()">← Контроль</button>${statusPill(r.status)}</div><div class="card"><b>${esc(r.store_name)}</b><div class="small">${dateRu(r.work_date)} · ${shiftTypeName(r.shift_kind)} · ${esc(r.employee_name)} · версия ${r.revision}</div></div>${r.issues?.length?`<div class="notice"><b>Core нашёл ${r.issues.length} потенциальных отклонений.</b><br><span class="small">Это подсказки. Решение принимает управляющий.</span></div>`:''}${fields}${field('Общее замечание','<textarea id="shiftGeneralRemark" placeholder="Можно оставить общее замечание по пересменке"></textarea>')}<div class="review-actions"><button class="btn ok" onclick="reviewShift(${r.id},'accepted')">✓ Принять</button><button class="btn warn" onclick="reviewShift(${r.id},'accepted_with_remarks')">! Принять с замечаниями</button><button class="btn reject wide" onclick="reviewShift(${r.id},'rejected')">✕ Не принять</button></div>`)}catch(e){flash(e.message,'error')}}
async function reviewShift(id,decision){const remarks=[...document.querySelectorAll('[data-review-remark]')].map(el=>({field_id:+el.dataset.reviewRemark,remark:el.value.trim()})).filter(x=>x.remark);const general=document.getElementById('shiftGeneralRemark')?.value.trim()||null;try{await api(`/api/shifts/reports/${id}/review`,{method:'POST',body:JSON.stringify({decision,general_comment:general,remarks})});flash(decision==='accepted'?'Пересменка принята':decision==='accepted_with_remarks'?'Пересменка принята с замечаниями':'Пересменка не принята и возвращена продавцу');await renderShiftControl()}catch(e){flash(e.message,'error')}}
function renderShiftReadOnly(r,backControl=true){const issueIds=new Set((r.issues||[]).map(x=>x.field_id));const fields=(r.values||[]).map(v=>`<div class="handover-field ${issueIds.has(v.field_id)?'issue':''}"><b>${esc(v.label)}</b><div class="handover-value">${displayShiftValue(v)}</div>${v.field_type==='photo'&&v.photo_count?`<button class="btn secondary mini" onclick="showShiftPhotos(${v.value_id})">Посмотреть фото</button>`:''}${shiftFieldRemark(v)}</div>`).join('');const general=(r.general_remarks||[]).map(x=>`<div class="remark-box"><b>Общее замечание</b><br>${esc(x)}</div>`).join('');const actionNames={submitted:'Отправлена на проверку',resubmitted:'Повторно отправлена',accepted:'Принята',accepted_with_remarks:'Принята с замечаниями',rejected:'Не принята'};const events=(r.events||[]).map(e=>`<div class="history-event"><div class="row between"><b>${esc(actionNames[e.action]||e.action)}</b><span class="small">версия ${e.revision}</span></div><div class="small">${e.created_at?new Date(e.created_at).toLocaleString('ru-RU'):''}</div>${e.comment?`<div style="margin-top:4px">${esc(e.comment)}</div>`:''}</div>`).join('');shiftFrame(backControl?'control':'submit',`<button class="btn secondary mini" onclick="${backControl?'renderShiftControl()':'setShiftTab(\'submit\')'}">← Назад</button><div class="card"><div class="row between"><b>${esc(r.store_name)}</b>${statusPill(r.status)}</div><div class="small">${dateRu(r.work_date)} · ${shiftTypeName(r.shift_kind)} · ${esc(r.employee_name)}</div>${general}</div>${fields}<h3>История проверки</h3>${events||'<div class="small">История пока пустая.</div>'}`)}
async function renderShiftHistory(){const stores=await api('/api/reference/stores');const today=new Date(),from=new Date(today.getFullYear(),today.getMonth(),1).toISOString().slice(0,10),to=today.toISOString().slice(0,10);let qs=`date_from=${from}&date_to=${to}`;if(state.shiftHistoryStore)qs+=`&store_id=${state.shiftHistoryStore}`;if(state.shiftHistoryStatus)qs+=`&status=${state.shiftHistoryStatus}`;const rows=await api('/api/shifts/history?'+qs);const list=rows.map(r=>`<div class="handover-card clickable" onclick="openShiftHistoryReport(${r.id})"><div class="row between"><div><b>${esc(r.store_name)}</b><div class="small">${dateRu(r.work_date)} · ${shiftTypeName(r.shift_kind)} · ${esc(r.employee_name)}</div></div>${statusPill(r.status)}</div><div class="small" style="margin-top:5px">Версия ${r.revision}${r.reviewed_by_name?' · проверил '+esc(r.reviewed_by_name):''}</div></div>`).join('');shiftFrame('history',`<div class="handover-filter">${field('Магазин',`<select onchange="state.shiftHistoryStore=this.value;renderShiftHistory()"><option value="">Все магазины</option>${stores.map(x=>`<option value="${x.id}" ${String(state.shiftHistoryStore)===String(x.id)?'selected':''}>${esc(x.name)}</option>`).join('')}</select>`)}${field('Статус',`<select onchange="state.shiftHistoryStatus=this.value;renderShiftHistory()"><option value="">Все</option><option value="review" ${state.shiftHistoryStatus==='review'?'selected':''}>На проверке</option><option value="accepted" ${state.shiftHistoryStatus==='accepted'?'selected':''}>Принята</option><option value="accepted_with_remarks" ${state.shiftHistoryStatus==='accepted_with_remarks'?'selected':''}>С замечаниями</option><option value="rejected" ${state.shiftHistoryStatus==='rejected'?'selected':''}>Не принята</option></select>`)}</div>${list||'<div class="handover-empty">В этом месяце пересменок пока нет.</div>'}`)}
async function openShiftHistoryReport(id){const r=await api(`/api/shifts/reports/${id}`);renderShiftReadOnly(r,true)}
async function renderShiftAdmin(){const [stores,forms]=await Promise.all([api('/api/reference/stores'),api('/api/shifts/forms')]);if(!state.shiftFormStore&&stores.length)state.shiftFormStore=stores[0].id;const filtered=forms.filter(x=>String(x.store_id)===String(state.shiftFormStore));const list=filtered.map(f=>`<div class="handover-card"><div class="row between"><div><b>${esc(f.name)}</b><div class="small">${shiftTypeName(f.shift_kind==='evening'?'day':f.shift_kind==='morning'?'night':f.shift_kind)} · ${f.fields.length} полей</div></div><span class="pill ${f.active?'green':''}">${f.active?'Активна':'Выключена'}</span></div><div class="row" style="margin-top:8px"><button class="btn secondary mini" onclick="editShiftForm(${f.id})">Редактировать</button><button class="btn danger mini" onclick="deleteShiftForm(${f.id})">Удалить</button></div></div>`).join('');shiftFrame('admin',`${field('Магазин',`<select onchange="state.shiftFormStore=this.value;renderShiftAdmin()">${stores.map(x=>`<option value="${x.id}" ${String(state.shiftFormStore)===String(x.id)?'selected':''}>${esc(x.name)}</option>`).join('')}</select>`)}<div class="row between"><h3>Формы пересменки</h3><button class="btn mini" onclick="newShiftForm()">+ Форма</button></div>${list||'<div class="notice">Для этой точки формы ещё не настроены.</div>'}`)}
function newShiftForm(){state.shiftEditingForm={id:null,store_id:+state.shiftFormStore,name:'',shift_kind:'day',active:true,fields:[]};renderShiftFormBuilder()}
async function editShiftForm(id){const forms=await api('/api/shifts/forms');const f=forms.find(x=>x.id===id);if(!f)return;state.shiftEditingForm=JSON.parse(JSON.stringify(f));state.shiftEditingForm.shift_kind=f.shift_kind==='evening'?'day':f.shift_kind==='morning'?'night':f.shift_kind;renderShiftFormBuilder()}
function renderShiftFormBuilder(){const f=state.shiftEditingForm;if(!f)return renderShiftAdmin();const rows=(f.fields||[]).map((x,i)=>shiftFormFieldRow(x,i)).join('');shiftFrame('admin',`<button class="btn secondary mini" onclick="state.shiftEditingForm=null;renderShiftAdmin()">← Формы</button><div class="card"><h3>${f.id?'Редактирование формы':'Новая форма'}</h3>${field('Название',`<input id="sfName" value="${esc(f.name||'')}">`)}${field('Смена',`<select id="sfKind"><option value="day" ${f.shift_kind==='day'?'selected':''}>Дневная</option><option value="night" ${f.shift_kind==='night'?'selected':''}>Ночная</option></select>`)}<label class="row"><input id="sfActive" type="checkbox" style="width:auto" ${f.active!==false?'checked':''}> Активна</label></div><div id="sfFields">${rows}</div><button class="btn secondary" onclick="addShiftFormField()">+ Добавить поле</button><button class="btn" style="margin-left:6px" onclick="saveShiftFormBuilder()">Сохранить форму</button>`)}
function shiftFormFieldRow(x,i){const opts=x.options_json||{};return `<div class="form-builder-field" data-sf-row="${i}"><div class="form-builder-grid">${field('Название',`<input data-sf-label value="${esc(x.label||'')}">`)}${field('Тип',`<select data-sf-type onchange="changeShiftFormFieldType(${i},this.value)"><option value="text" ${x.field_type==='text'?'selected':''}>Текст</option><option value="textarea" ${x.field_type==='textarea'?'selected':''}>Комментарий</option><option value="number" ${x.field_type==='number'?'selected':''}>Число</option><option value="boolean" ${x.field_type==='boolean'?'selected':''}>Да / Нет</option><option value="select" ${x.field_type==='select'?'selected':''}>Выбор</option><option value="photo" ${x.field_type==='photo'?'selected':''}>Фото</option></select>`)}</div><label class="row"><input data-sf-required type="checkbox" style="width:auto" ${x.required?'checked':''}> Обязательное поле</label>${x.field_type==='boolean'?`<label class="row"><input data-sf-devfalse type="checkbox" style="width:auto" ${opts.deviation_on_false?'checked':''}> Ответ «Нет» считать отклонением</label>`:''}${x.field_type==='number'?`<div class="grid">${field('Минимум',`<input data-sf-min type="number" step="0.01" value="${opts.min??''}">`)}${field('Максимум',`<input data-sf-max type="number" step="0.01" value="${opts.max??''}">`)}</div>`:''}${x.field_type==='select'?`${field('Варианты через запятую',`<input data-sf-options value="${esc((opts.options||[]).join(', '))}">`)}${field('Какие варианты считать отклонением',`<input data-sf-deviations value="${esc((opts.deviation_values||[]).join(', '))}">`)}`:''}<button class="btn danger mini" onclick="removeShiftFormField(${i})">Удалить поле</button></div>`}
function syncShiftFormFromDom(){const f=state.shiftEditingForm;if(!f)return;const name=document.getElementById('sfName');if(name)f.name=name.value;const kind=document.getElementById('sfKind');if(kind)f.shift_kind=kind.value;const active=document.getElementById('sfActive');if(active)f.active=active.checked;const rows=[...document.querySelectorAll('[data-sf-row]')];if(rows.length)f.fields=rows.map(r=>{const type=r.querySelector('[data-sf-type]').value,opts={};if(type==='boolean')opts.deviation_on_false=!!r.querySelector('[data-sf-devfalse]')?.checked;if(type==='number'){const mn=r.querySelector('[data-sf-min]')?.value,mx=r.querySelector('[data-sf-max]')?.value;if(mn!=='')opts.min=+mn;if(mx!=='')opts.max=+mx}if(type==='select'){opts.options=(r.querySelector('[data-sf-options]')?.value||'').split(',').map(x=>x.trim()).filter(Boolean);opts.deviation_values=(r.querySelector('[data-sf-deviations]')?.value||'').split(',').map(x=>x.trim()).filter(Boolean)}return {label:r.querySelector('[data-sf-label]').value,field_type:type,required:r.querySelector('[data-sf-required]').checked,options_json:Object.keys(opts).length?opts:null}})}
function changeShiftFormFieldType(i,value){syncShiftFormFromDom();if(state.shiftEditingForm?.fields?.[i])state.shiftEditingForm.fields[i].field_type=value;renderShiftFormBuilder()}
function addShiftFormField(){syncShiftFormFromDom();state.shiftEditingForm.fields.push({label:'',field_type:'text',required:false,options_json:null});renderShiftFormBuilder()}
function removeShiftFormField(i){syncShiftFormFromDom();state.shiftEditingForm.fields.splice(i,1);renderShiftFormBuilder()}
async function saveShiftFormBuilder(){syncShiftFormFromDom();const f=state.shiftEditingForm;if(!f.name.trim())return flash('Укажите название формы','error');if(!f.fields.length)return flash('Добавьте хотя бы одно поле','error');const body={store_id:+f.store_id,name:f.name.trim(),shift_kind:f.shift_kind,active:f.active!==false,fields:f.fields.map(x=>({label:x.label,field_type:x.field_type,required:!!x.required,options_json:x.options_json||null}))};try{if(f.id)await api(`/api/shifts/forms/${f.id}`,{method:'PUT',body:JSON.stringify(body)});else await api('/api/shifts/forms',{method:'POST',body:JSON.stringify(body)});state.shiftEditingForm=null;flash('Форма сохранена');await renderShiftAdmin()}catch(e){flash(e.message,'error')}}
async function deleteShiftForm(id){if(!confirm('Удалить форму? Если по ней уже есть история, она будет просто отключена.'))return;try{const r=await api(`/api/shifts/forms/${id}`,{method:'DELETE'});flash(r.soft_deleted?'Форма отключена — история сохранена':'Форма удалена');await renderShiftAdmin()}catch(e){flash(e.message,'error')}}

// Inspections v1.7 — conduct, weekly control, history and form constructor.
const inspectionSeverityNames={low:'Низкая',medium:'Средняя',high:'Высокая',critical:'Критическая'};
const inspectionResultNames={good:'Хорошо',attention:'Есть замечания',poor:'Проблемно',neutral:'Без оценки'};
function inspectionTabs(active){return `<div class="inspection-tabs"><button class="${active==='conduct'?'active':''}" onclick="setInspectionTab('conduct')">Провести</button><button class="${active==='control'?'active':''}" onclick="setInspectionTab('control')">Контроль</button><button class="${active==='history'?'active':''}" onclick="setInspectionTab('history')">История</button><button class="${active==='forms'?'active':''}" onclick="setInspectionTab('forms')">Формы</button></div>`}
function inspectionFrame(active,body){document.getElementById('app').innerHTML=`<div class="order-head"><h2>Проверки</h2><button class="icon-btn" onclick="showRelatedKnowledge('inspections')">▤</button></div>${inspectionTabs(active)}<div id="inspectionBody">${body}</div>`}
async function renderInspections(){await renderInspectionTab(state.inspectionTab||'conduct')}
async function setInspectionTab(tab){state.inspectionTab=tab;state.inspectionEditingForm=null;await renderInspectionTab(tab)}
async function renderInspectionTab(tab){state.inspectionTab=tab;try{if(tab==='control')return await renderInspectionControl();if(tab==='history')return await renderInspectionHistory();if(tab==='forms')return await renderInspectionForms();return await renderInspectionConduct()}catch(e){inspectionFrame(tab,`<div class="notice error">${esc(e.message)}</div>`)}}
function inspectionFormOptions(forms,storeId,selected=''){const filtered=forms.filter(f=>!f.store_ids?.length||f.store_ids.includes(+storeId));return `<option value="">Выберите форму</option>${filtered.map(f=>`<option value="${f.id}" ${String(selected)===String(f.id)?'selected':''}>${esc(f.name)}</option>`).join('')}`}
async function renderInspectionConduct(){const [meta,forms,drafts]=await Promise.all([api('/api/inspections/meta'),api('/api/inspections/forms'),api('/api/inspections/drafts')]);state.inspectionMeta=meta;state.inspectionForms=forms;if(!state.inspectionPrefillStore&&meta.stores.length)state.inspectionPrefillStore=meta.stores[0].id;const sid=+state.inspectionPrefillStore||meta.stores[0]?.id||'';const eligible=forms.filter(f=>!f.store_ids?.length||f.store_ids.includes(+sid));inspectionFrame('conduct',`<div class="card"><h3>Новая проверка</h3>${field('Магазин',`<select id="inspectionStore" onchange="state.inspectionPrefillStore=this.value;updateInspectionFormOptions()">${meta.stores.map(x=>`<option value="${x.id}" ${String(sid)===String(x.id)?'selected':''}>${esc(x.name)}</option>`).join('')}</select>`)}${field('Форма',`<select id="inspectionTemplate">${inspectionFormOptions(forms,sid)}</select>`)}${eligible.length?'<button class="btn" style="width:100%" onclick="startInspectionDraft()">Начать проверку</button>':'<div class="notice">Для этой точки нет доступной формы. Создайте её во вкладке «Формы».</div>'}</div>${drafts.length?`<h3>Незавершённые проверки</h3>${drafts.map(d=>`<div class="inspection-card"><div class="row between"><div><b>${esc(d.store_name)}</b><div class="small">${esc(d.template_name||'Форма')} · ${d.started_at?new Date(d.started_at).toLocaleString('ru-RU'):''}</div></div><span class="pill">Черновик</span></div><div class="row" style="margin-top:8px"><button class="btn secondary mini" onclick="openInspectionDraft(${d.id})">Продолжить</button><button class="btn danger mini" onclick="deleteInspectionDraft(${d.id})">Удалить</button></div></div>`).join('')}`:''}`)}
function updateInspectionFormOptions(){const el=document.getElementById('inspectionTemplate');if(el)el.innerHTML=inspectionFormOptions(state.inspectionForms||[],document.getElementById('inspectionStore')?.value||'')}
async function startInspectionDraft(){const store_id=+inspectionStore.value,template_id=+inspectionTemplate.value;if(!store_id||!template_id)return flash('Выберите магазин и форму','error');try{const r=await api('/api/inspections/drafts',{method:'POST',body:JSON.stringify({store_id,template_id})});await openInspectionDraft(r.id)}catch(e){flash(e.message,'error')}}
async function deleteInspectionDraft(id){if(!confirm('Удалить незавершённую проверку?'))return;try{await api(`/api/inspections/${id}/draft`,{method:'DELETE'});flash('Черновик удалён');await renderInspectionConduct()}catch(e){flash(e.message,'error')}}
function inspectionValueInput(v){const f=v.field||{},value=v.value;if(f.field_type==='boolean')return `<select data-insp-value="${v.id}"><option value="">—</option><option value="true" ${value===true?'selected':''}>Да</option><option value="false" ${value===false?'selected':''}>Нет</option></select>`;if(f.field_type==='select')return `<select data-insp-value="${v.id}"><option value="">—</option>${(f.options||[]).map(o=>`<option value="${esc(o)}" ${String(value??'')===String(o)?'selected':''}>${esc(o)}</option>`).join('')}</select>`;if(f.field_type==='number')return `<input data-insp-value="${v.id}" type="number" step="0.01" value="${value??''}">`;if(f.field_type==='textarea')return `<textarea data-insp-value="${v.id}">${esc(value??'')}</textarea>`;if(f.field_type==='photo')return `<div class="small">Ответ подтверждается фотографиями.</div>`;return `<input data-insp-value="${v.id}" value="${esc(value??'')}">`}
function inspectionPhotoButtons(v){const needs=v.field?.field_type==='photo'||v.field?.require_photo;const list=(v.photos||[]).map(p=>`<button class="photo-chip" onclick="openCorePhoto(${p.id})">📷 Фото</button>`).join('');return `${list}${needs?`<button class="btn secondary mini" onclick="requestPhoto('inspection_value',${v.id},'Фото пункта проверки')">+ Фото</button>`:''}`}
async function openInspectionDraft(id){const r=await api('/api/inspections/'+id);const fields=(r.values||[]).map(v=>`<div class="inspection-field-card" data-inspection-row="${v.id}"><div class="row between"><b>${esc(v.field.label)}${v.field.required?' *':''}</b><span class="pill severity-${esc(v.field.default_severity||'medium')}">${esc(inspectionSeverityNames[v.field.default_severity]||'')}</span></div>${v.field.help_text?`<div class="inspection-help">${esc(v.field.help_text)}</div>`:''}${inspectionValueInput(v)}<div class="inspection-photo-actions">${inspectionPhotoButtons(v)}</div>${v.field.allow_comment?field('Комментарий к пункту',`<textarea data-insp-comment="${v.id}" placeholder="Необязательно">${esc(v.comment||'')}</textarea>`):''}<div class="row" style="margin-top:7px"><label class="switchline"><input type="checkbox" data-insp-violation="${v.id}" ${v.manual_violation?'checked':''}> Отметить нарушение</label><select data-insp-severity="${v.id}" style="width:auto;padding:6px 8px">${Object.entries(inspectionSeverityNames).map(([k,n])=>`<option value="${k}" ${(v.severity||v.field.default_severity||'medium')===k?'selected':''}>${n}</option>`).join('')}</select></div>${v.field.creates_violation_on_false||v.field.violation_rule?'<div class="small" style="margin-top:5px">⚙ Core автоматически проверит этот пункт на отклонение.</div>':''}</div>`).join('');inspectionFrame('conduct',`<button class="btn secondary mini" onclick="renderInspectionConduct()">← Назад</button><div class="card"><div class="row between"><div><b>${esc(r.store_name)}</b><div class="small">${esc(r.template_name)} · начал ${esc(r.manager_name||'')}</div></div><span class="pill">Черновик</span></div><div class="inspection-photo-actions"><button class="btn secondary mini" onclick="requestPhoto('inspection',${r.id},'Общее фото проверки')">+ Общее фото</button>${(r.photos||[]).map(p=>`<button class="photo-chip" onclick="openCorePhoto(${p.id})">📷 Фото</button>`).join('')}</div></div>${fields}${field('Ит
