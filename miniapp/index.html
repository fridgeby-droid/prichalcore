оговый комментарий',`<textarea id="inspectionGeneralComment" placeholder="Необязательно">${esc(r.comment||'')}</textarea>`)}<button class="btn" style="width:100%" onclick="finishInspection(${r.id})">Завершить проверку</button>`)}
async function finishInspection(id){const values=[...document.querySelectorAll('[data-inspection-row]')].map(row=>{const vid=+row.dataset.inspectionRow,el=row.querySelector('[data-insp-value]');let value=null;if(el){value=el.value;if(el.tagName==='SELECT'&&(value==='true'||value==='false'))value=value==='true';else if(el.type==='number'&&value!=='')value=+value}return {value_id:vid,value:value===''?null:value,comment:row.querySelector('[data-insp-comment]')?.value.trim()||null,manual_violation:!!row.querySelector('[data-insp-violation]')?.checked,severity:row.querySelector('[data-insp-severity]')?.value||null}});try{await api(`/api/inspections/${id}/finish`,{method:'POST',body:JSON.stringify({comment:document.getElementById('inspectionGeneralComment')?.value.trim()||null,values})});flash('Проверка завершена');state.inspectionTab='history';await openInspectionDetail(id,'history')}catch(e){flash(e.message,'error')}}
async function openCorePhoto(id){try{const r=await fetch(`/api/photos/${id}/content`,{headers:{Authorization:'Bearer '+state.token}});if(!r.ok)throw new Error('Не удалось открыть фото');const b=await r.blob(),u=URL.createObjectURL(b);showSheet(`<h3>Фото проверки</h3><img src="${u}" style="width:100%;height:auto;border-radius:12px"><button class="btn secondary" style="width:100%;margin-top:10px" onclick="closeWorkSheet()">Закрыть</button>`);setTimeout(()=>URL.revokeObjectURL(u),300000)}catch(e){flash(e.message,'error')}}
function inspectionScoreHtml(r){const score=r.score===null||r.score===undefined?'—':Math.round(r.score);return `<div class="inspection-score score-${r.result||'neutral'}">${score}${score==='—'?'':'%'}</div><span class="pill inspection-result-${r.result||'neutral'}">${esc(inspectionResultNames[r.result]||'')}</span>`}
async function renderInspectionControl(){const meta=await api('/api/inspections/meta');state.inspectionMeta=meta;let vq='status=open';if(state.inspectionControlFilters.store_id)vq+=`&store_id=${state.inspectionControlFilters.store_id}`;if(state.inspectionControlFilters.severity)vq+=`&severity=${state.inspectionControlFilters.severity}`;const [control,violations]=await Promise.all([api('/api/inspections/control/weekly'),api('/api/inspections/violations/list?'+vq)]);const done=control.stores.filter(x=>x.complete).length,missing=control.stores.filter(x=>!x.complete).length,openV=control.stores.reduce((a,x)=>a+x.open_violations,0);inspectionFrame('control',`<div class="small">Неделя ${new Date(control.week_from+'T12:00:00').toLocaleDateString('ru-RU')} — ${new Date(control.week_to+'T12:00:00').toLocaleDateString('ru-RU')}</div><div class="inspection-control-grid"><div class="control-metric"><b>${control.stores.length}</b><span class="small">точек</span></div><div class="control-metric"><b>${done}</b><span class="small">норма выполнена</span></div><div class="control-metric"><b>${openV}</b><span class="small">нарушений</span></div></div><h3>Контроль ${control.required} проверок в неделю</h3>${control.stores.map(x=>{const pct=Math.min(100,Math.round(x.count/x.required*100));return `<div class="inspection-store-progress ${x.complete?'done':''}"><div class="row between"><div><b>${esc(x.store_name)}</b><div class="small">${x.complete?'Норма выполнена':`Осталось ${x.remaining}`}${x.open_violations?` · открытых нарушений ${x.open_violations}`:''}${x.critical_violations?` · критических ${x.critical_violations}`:''}</div></div><b>${x.count} из ${x.required}</b></div><div class="progress-line"><span style="width:${pct}%"></span></div><button class="btn secondary mini" style="margin-top:8px" onclick="inspectionStartForStore(${x.store_id})">Провести проверку</button></div>`}).join('')||'<div class="notice">Нет закреплённых магазинов.</div>'}<div class="row between"><h3>Открытые нарушения</h3><span class="pill">${violations.length}</span></div><div class="inspection-filter-grid">${field('Магазин',`<select onchange="state.inspectionControlFilters.store_id=this.value;renderInspectionControl()"><option value="">Все</option>${meta.stores.map(s=>`<option value="${s.id}" ${String(state.inspectionControlFilters.store_id)===String(s.id)?'selected':''}>${esc(s.name)}</option>`).join('')}</select>`)}${field('Критичность',`<select onchange="state.inspectionControlFilters.severity=this.value;renderInspectionControl()"><option value="">Все</option>${Object.entries(inspectionSeverityNames).map(([k,n])=>`<option value="${k}" ${state.inspectionControlFilters.severity===k?'selected':''}>${n}</option>`).join('')}</select>`)}</div>${violations.map(v=>`<div class="violation-card ${v.severity==='critical'?'critical':''}"><div class="row between"><b>${esc(v.title)}</b><span class="pill severity-${v.severity}">${esc(inspectionSeverityNames[v.severity]||v.severity)}</span></div><div class="small">${esc(v.store_name)} · проверка #${v.inspection_id}</div>${v.comment?`<div style="margin-top:5px">${esc(v.comment)}</div>`:''}<div class="row" style="margin-top:8px"><button class="btn secondary mini" onclick="openInspectionDetail(${v.inspection_id},'control')">Открыть</button>${v.task_v2_id?`<span class="pill green">Задача #${v.task_v2_id}</span>`:`<button class="btn mini" onclick="inspectionTaskFromViolation(${v.id})">Создать задачу</button>`}<button class="btn secondary mini" onclick="resolveInspectionViolation(${v.id})">Закрыть нарушение</button></div></div>`).join('')||'<div class="notice success">Открытых нарушений нет.</div>'}`)}
async function inspectionStartForStore(storeId){state.inspectionPrefillStore=storeId;state.inspectionTab='conduct';await renderInspectionConduct()}
async function resolveInspectionViolation(id){if(!confirm('Отметить нарушение устранённым?'))return;try{await api(`/api/inspections/violations/${id}`,{method:'PATCH',body:JSON.stringify({status:'resolved'})});flash('Нарушение закрыто');await renderInspectionControl()}catch(e){flash(e.message,'error')}}
async function inspectionTaskFromViolation(id){try{state.taskPrefill=await api(`/api/inspections/violations/${id}/task-prefill`);taskTab='create';await go('tasks')}catch(e){flash(e.message,'error')}}
async function renderInspectionHistory(){const meta=await api('/api/inspections/meta');state.inspectionMeta=meta;const f=state.inspectionHistoryFilters;if(!f.date_from){const d=new Date();f.date_from=new Date(d.getFullYear(),d.getMonth(),1).toISOString().slice(0,10);f.date_to=d.toISOString().slice(0,10)}let q=[];for(const [k,v] of Object.entries(f)){if(v!==''&&v!==null)q.push(`${encodeURIComponent(k)}=${encodeURIComponent(v)}`)}const rows=await api('/api/inspections?'+q.join('&'));inspectionFrame('history',`<div class="inspection-filter-grid">${field('С даты',`<input type="date" value="${esc(f.date_from)}" onchange="state.inspectionHistoryFilters.date_from=this.value;renderInspectionHistory()">`)}${field('По дату',`<input type="date" value="${esc(f.date_to)}" onchange="state.inspectionHistoryFilters.date_to=this.value;renderInspectionHistory()">`)}${field('Магазин',`<select onchange="state.inspectionHistoryFilters.store_id=this.value;renderInspectionHistory()"><option value="">Все</option>${meta.stores.map(s=>`<option value="${s.id}" ${String(f.store_id)===String(s.id)?'selected':''}>${esc(s.name)}</option>`).join('')}</select>`)}${field('Управляющий',`<select onchange="state.inspectionHistoryFilters.manager_id=this.value;renderInspectionHistory()"><option value="">Все</option>${meta.managers.map(m=>`<option value="${m.id}" ${String(f.manager_id)===String(m.id)?'selected':''}>${esc(m.name)}</option>`).join('')}</select>`)}${field('Результат',`<select onchange="state.inspectionHistoryFilters.result=this.value;renderInspectionHistory()"><option value="">Все</option><option value="good" ${f.result==='good'?'selected':''}>Хорошо</option><option value="attention" ${f.result==='attention'?'selected':''}>Есть замечания</option><option value="poor" ${f.result==='poor'?'selected':''}>Проблемно</option><option value="neutral" ${f.result==='neutral'?'selected':''}>Без оценки</option></select>`)}${field('Нарушения',`<select onchange="state.inspectionHistoryFilters.has_violations=this.value;renderInspectionHistory()"><option value="">Не важно</option><option value="true" ${f.has_violations==='true'?'selected':''}>Есть</option><option value="false" ${f.has_violations==='false'?'selected':''}>Нет</option></select>`)}</div><div class="small" style="margin:5px 0">Найдено: ${rows.length}</div>${rows.map(r=>`<div class="inspection-card clickable" onclick="openInspectionDetail(${r.id},'history')"><div class="row between"><div><b>${esc(r.store_name)}</b><div class="small">${r.completed_at?new Date(r.completed_at).toLocaleString('ru-RU'):''} · ${esc(r.manager_name||'')} · ${esc(r.template_name||'')}</div></div>${inspectionScoreHtml(r)}</div>${r.violation_count?`<div style="margin-top:7px"><span class="pill red">Нарушений: ${r.violation_count}</span></div>`:''}</div>`).join('')||'<div class="notice">Проверок по выбранным фильтрам нет.</div>'}`)}
function displayInspectionValue(v){if(v.field.field_type==='photo')return `📷 ${(v.photos||[]).length} фото`;if(v.field.field_type==='boolean')return v.value===true?'Да':v.value===false?'Нет':'—';if(v.value===null||v.value===undefined||v.value==='')return '—';return esc(v.value)}
async function openInspectionDetail(id,back='history'){const r=await api('/api/inspections/'+id);const violationIds=new Set((r.violations||[]).map(v=>v.inspection_value_id));const values=(r.values||[]).map(v=>`<div class="inspection-field-card ${violationIds.has(v.id)?'violation':''}"><div class="row between"><b>${esc(v.field.label)}</b>${violationIds.has(v.id)?'<span class="pill red">Нарушение</span>':''}</div><div style="font-weight:600;margin-top:5px">${displayInspectionValue(v)}</div>${v.comment?`<div class="remark-box">${esc(v.comment)}</div>`:''}<div class="inspection-photo-actions">${(v.photos||[]).map(p=>`<button class="photo-chip" onclick="openCorePhoto(${p.id})">📷 Фото</button>`).join('')}</div></div>`).join('');inspectionFrame(back,`<button class="btn secondary mini" onclick="${back==='control'?'renderInspectionControl()':'renderInspectionHistory()'}">← Назад</button><div class="card"><div class="row between"><div><b>${esc(r.store_name)}</b><div class="small">${esc(r.template_name||'')} · ${r.completed_at?new Date(r.completed_at).toLocaleString('ru-RU'):''}<br>Проверил: ${esc(r.manager_name||'')}</div></div>${inspectionScoreHtml(r)}</div>${r.comment?`<div class="remark-box">${esc(r.comment)}</div>`:''}<div class="inspection-photo-actions">${(r.photos||[]).map(p=>`<button class="photo-chip" onclick="openCorePhoto(${p.id})">📷 Общее фото</button>`).join('')}</div><button class="btn secondary mini" style="margin-top:8px" onclick="repeatInspection(${r.store_id},${r.template_id})">Повторная проверка</button></div>${values}<h3>Нарушения</h3>${(r.violations||[]).map(v=>`<div class="violation-card ${v.severity==='critical'?'critical':''}"><div class="row between"><b>${esc(v.title)}</b><span class="pill severity-${v.severity}">${esc(inspectionSeverityNames[v.severity]||v.severity)}</span></div>${v.comment?`<div>${esc(v.comment)}</div>`:''}<div class="row" style="margin-top:8px">${v.task_v2_id?`<span class="pill green">Задача #${v.task_v2_id}</span>`:`<button class="btn mini" onclick="inspectionTaskFromViolation(${v.id})">Создать задачу</button>`}${v.status==='open'?`<button class="btn secondary mini" onclick="resolveInspectionViolationFromDetail(${v.id},${r.id},'${back}')">Закрыть</button>`:'<span class="pill green">Устранено</span>'}</div></div>`).join('')||'<div class="notice success">Нарушений не зафиксировано.</div>'}`)}
async function resolveInspectionViolationFromDetail(vid,iid,back){try{await api(`/api/inspections/violations/${vid}`,{method:'PATCH',body:JSON.stringify({status:'resolved'})});flash('Нарушение закрыто');await openInspectionDetail(iid,back)}catch(e){flash(e.message,'error')}}
async function repeatInspection(storeId,templateId){state.inspectionPrefillStore=storeId;state.inspectionTab='conduct';await renderInspectionConduct();const sel=document.getElementById('inspectionTemplate');if(sel&&[...sel.options].some(o=>+o.value===+templateId))sel.value=templateId}
function inspectionStoreChecks(selected=[]){const stores=state.inspectionMeta?.stores||[];return `<div class="check-grid">${stores.map(s=>`<label class="check-item"><input type="checkbox" name="inspectionFormStore" value="${s.id}" ${selected.includes(s.id)?'checked':''}>${esc(s.name)}</label>`).join('')}</div><div class="small" style="margin-top:5px">Если ничего не выбрано, форма доступна для всех магазинов.</div>`}
async function renderInspectionForms(){const [meta,forms]=await Promise.all([api('/api/inspections/meta'),api('/api/inspections/forms')]);state.inspectionMeta=meta;state.inspectionForms=forms;if(state.inspectionEditingForm)return renderInspectionFormBuilder();inspectionFrame('forms',`<div class="row between"><div class="small">Конструктор чек-листов проверок</div><button class="btn mini" onclick="newInspectionForm()">+ Форма</button></div>${forms.map(f=>`<div class="inspection-form-row"><div class="row between"><div><b>${esc(f.name)}</b><div class="small">${f.fields.length} пунктов · ${f.store_ids?.length?f.store_ids.map(id=>meta.stores.find(s=>s.id===id)?.name).filter(Boolean).join(', '):'все магазины'}${f.used_count?` · использована ${f.used_count} раз`:''}</div></div><span class="pill green">Активна</span></div>${f.description?`<div class="small" style="margin-top:5px">${esc(f.description)}</div>`:''}<div class="inspection-form-actions"><button class="btn secondary mini" onclick="editInspectionForm(${f.id})">Редактировать</button><button class="btn danger mini" onclick="deleteInspectionForm(${f.id})">Отключить</button></div></div>`).join('')||'<div class="notice">Формы ещё не созданы.</div>'}`)}
function newInspectionForm(){state.inspectionEditingForm={id:null,name:'',description:'',store_ids:[],fields:[]};renderInspectionFormBuilder()}
function editInspectionForm(id){const f=(state.inspectionForms||[]).find(x=>x.id===id);if(!f)return;state.inspectionEditingForm=JSON.parse(JSON.stringify(f));renderInspectionFormBuilder()}
function inspectionBuilderField(x={},i=0){const type=x.field_type||'boolean',rule=x.violation_rule||{};return `<div class="inspection-form-field" data-if-row><div class="row between"><b>Пункт ${i+1}</b><button class="btn danger mini" onclick="this.closest('[data-if-row]').remove();renumberInspectionFields()">Удалить</button></div>${field('Название',`<input data-if-label value="${esc(x.label||'')}">`)}${field('Подсказка сотруднику',`<input data-if-help value="${esc(x.help_text||'')}">`)}<div class="inspection-form-field mini-grid">${field('Тип',`<select data-if-type onchange="inspectionBuilderTypeChanged(this)"><option value="boolean" ${type==='boolean'?'selected':''}>Да / Нет</option><option value="select" ${type==='select'?'selected':''}>Выбор</option><option value="number" ${type==='number'?'selected':''}>Число</option><option value="text" ${type==='text'?'selected':''}>Текст</option><option value="textarea" ${type==='textarea'?'selected':''}>Комментарий</option><option value="photo" ${type==='photo'?'selected':''}>Фото</option></select>`)}${field('Критичность нарушения',`<select data-if-severity>${Object.entries(inspectionSeverityNames).map(([k,n])=>`<option value="${k}" ${(x.default_severity||'medium')===k?'selected':''}>${n}</option>`).join('')}</select>`)}</div><div class="row"><label class="switchline"><input data-if-required type="checkbox" ${x.required?'checked':''}> Обязательное</label><label class="switchline"><input data-if-comment type="checkbox" ${x.allow_comment!==false?'checked':''}> Разрешить комментарий</label><label class="switchline"><input data-if-photo type="checkbox" ${x.require_photo?'checked':''}> Требовать фото</label></div><div class="if-options ${type==='select'?'':'hidden'}">${field('Варианты ответа через запятую',`<input data-if-options value="${esc((x.options||[]).join(', '))}">`)}${field('Какой ответ считать нарушением',`<input data-if-bad-option placeholder="Например: Нет в наличии" value="${rule.operator==='equals'?esc(rule.value||''):''}">`)}</div><div class="if-boolean ${type==='boolean'?'':'hidden'}"><label class="switchline"><input data-if-false type="checkbox" ${x.creates_violation_on_false||rule.operator==='false'?'checked':''}> Ответ «Нет» = нарушение</label></div><div class="if-number ${type==='number'?'':'hidden'}"><div class="grid">${field('Минимум нормы',`<input data-if-min type="number" step="0.01" value="${rule.operator==='outside'&&rule.min!==undefined?rule.min:''}">`)}${field('Максимум нормы',`<input data-if-max type="number" step="0.01" value="${rule.operator==='outside'&&rule.max!==undefined?rule.max:''}">`)}</div></div></div>`}
function renderInspectionFormBuilder(){const f=state.inspectionEditingForm||{};inspectionFrame('forms',`<button class="btn secondary mini" onclick="state.inspectionEditingForm=null;renderInspectionForms()">← Формы</button><div class="card"><h3>${f.id?'Редактирование формы':'Новая форма'}</h3>${field('Название',`<input id="ifName" value="${esc(f.name||'')}">`)}${field('Описание',`<textarea id="ifDesc">${esc(f.description||'')}</textarea>`)}<div class="field"><label>Магазины</label>${inspectionStoreChecks(f.store_ids||[])}</div></div><div id="inspectionFormFields">${(f.fields||[]).map((x,i)=>inspectionBuilderField(x,i)).join('')}</div><div class="row"><button class="btn secondary" onclick="addInspectionFormField()">+ Добавить пункт</button><button class="btn" onclick="saveInspectionForm()">Сохранить форму</button></div>${f.used_count?'<div class="notice">Эта форма уже использовалась. При сохранении Core создаст новую версию, а старую оставит в истории.</div>':''}`)}
function addInspectionFormField(){document.getElementById('inspectionFormFields').insertAdjacentHTML('beforeend',inspectionBuilderField({},document.querySelectorAll('[data-if-row]').length));renumberInspectionFields()}
function renumberInspectionFields(){document.querySelectorAll('[data-if-row]').forEach((r,i)=>{const b=r.querySelector('b');if(b)b.textContent='Пункт '+(i+1)})}
function inspectionBuilderTypeChanged(sel){const row=sel.closest('[data-if-row]'),type=sel.value;row.querySelector('.if-options')?.classList.toggle('hidden',type!=='select');row.querySelector('.if-boolean')?.classList.toggle('hidden',type!=='boolean');row.querySelector('.if-number')?.classList.toggle('hidden',type!=='number')}
async function saveInspectionForm(){const fields=[...document.querySelectorAll('[data-if-row]')].map((r,i)=>{const type=r.querySelector('[data-if-type]').value;let rule=null;if(type==='select'&&r.querySelector('[data-if-bad-option]').value.trim())rule={operator:'equals',value:r.querySelector('[data-if-bad-option]').value.trim()};if(type==='number'){const min=r.querySelector('[data-if-min]').value,max=r.querySelector('[data-if-max]').value;if(min!==''||max!=='')rule={operator:'outside',min:min===''?null:+min,max:max===''?null:+max}}return {label:r.querySelector('[data-if-label]').value.trim(),field_type:type,required:r.querySelector('[data-if-required]').checked,sort_order:i,options:type==='select'?r.querySelector('[data-if-options]').value.split(',').map(x=>x.trim()).filter(Boolean):[],help_text:r.querySelector('[data-if-help]').value.trim()||null,allow_comment:r.querySelector('[data-if-comment]').checked,require_photo:r.querySelector('[data-if-photo]').checked,default_severity:r.querySelector('[data-if-severity]').value,creates_violation_on_false:type==='boolean'&&r.querySelector('[data-if-false]').checked,violation_rule:rule}}).filter(x=>x.label);const body={name:ifName.value.trim(),description:ifDesc.value.trim()||null,store_ids:[...document.querySelectorAll('input[name=inspectionFormStore]:checked')].map(x=>+x.value),fields};if(!body.name||!fields.length)return flash('Укажите название и добавьте хотя бы один пункт','error');try{const f=state.inspectionEditingForm;if(f?.id)await api('/api/inspections/forms/'+f.id,{method:'PATCH',body:JSON.stringify(body)});else await api('/api/inspections/forms',{method:'POST',body:JSON.stringify(body)});state.inspectionEditingForm=null;flash('Форма сохранена');await renderInspectionForms()}catch(e){flash(e.message,'error')}}
async function deleteInspectionForm(id){if(!confirm('Отключить форму? История проверок сохранится.'))return;try{await api('/api/inspections/forms/'+id,{method:'DELETE'});flash('Форма отключена');await renderInspectionForms()}catch(e){flash(e.message,'error')}}

let taskTab='my';
const taskStatusNames={new:'Новая',in_progress:'В работе',review:'На проверке',done:'Выполнена',rejected:'Не принята',cancelled:'Отменена'};
const taskPriorityNames={low:'Низкий',medium:'Обычный',high:'Высокий',urgent:'Срочный'};
const taskPriorityClass={low:'green',medium:'',high:'yellow',urgent:'red'};
function taskTopNav(){return `<div class="task-tabs"><button class="${taskTab==='my'?'active':''}" onclick="taskSwitch('my')">Мои</button><button class="${taskTab==='create'?'active':''}" onclick="taskSwitch('create')">Поставить</button><button class="${taskTab==='control'?'active':''}" onclick="taskSwitch('control')">Контроль</button><button class="${taskTab==='history'?'active':''}" onclick="taskSwitch('history')">История</button></div>`}
async function taskSwitch(tab){taskTab=tab;await renderTasks()}
async function renderTasks(){document.getElementById('app').innerHTML=`<div class="order-head"><h2>Задачи</h2><button class="icon-btn" onclick="showRelatedKnowledge('tasks')">▤</button></div>${taskTopNav()}<div id="taskBody"><div class="loading">Загрузка…</div></div>`;try{if(taskTab==='create')await renderTaskCreate();else if(taskTab==='control')await renderTaskList('control');else if(taskTab==='history')await renderTaskList('history');else await renderTaskList('my');}catch(e){document.getElementById('taskBody').innerHTML=`<div class="notice error">${esc(e.message)}</div>`}}
function multiChoices(id,items,label='name',selected=[]){const set=new Set((selected||[]).map(Number));return `<div id="${id}" class="card" style="padding:8px;margin:5px 0;max-height:220px;overflow:auto">${items.map(x=>`<label class="row" style="flex-wrap:nowrap;padding:7px 3px;border-bottom:1px solid var(--line)"><input type="checkbox" value="${x.id}" style="width:auto" ${set.has(+x.id)?'checked':''}><span>${esc(x[label])}</span></label>`).join('')||'<span class="muted">Нет данных</span>'}</div>`}
function checkedIds(id){return [...document.querySelectorAll(`#${id} input[type=checkbox]:checked`)].map(x=>+x.value)}
function addTaskChecklistRow(){const box=document.getElementById('taskChecklist');box.insertAdjacentHTML('beforeend',`<div class="row" data-task-check style="margin:7px 0"><input placeholder="Пункт чек-листа" style="flex:1" data-text><label class="small"><input type="checkbox" style="width:auto" data-photo> фото</label><button class="btn danger" onclick="this.parentElement.remove()">×</button></div>`)}
async function renderTaskCreate(){const m=await api('/api/tasks-v2/meta');const pf=state.taskPrefill||{};document.getElementById('taskBody').innerHTML=`${pf.violation_id?`<div class="notice">Задача создаётся из нарушения проверки #${pf.violation_id}. Магазин и описание уже заполнены.</div>`:''}<div class="card"><h3>Новая задача</h3>${field('Название',`<input id="taskTitle" placeholder="Что нужно сделать" value="${esc(pf.title||'')}">`)}${field('Описание',`<textarea id="taskDesc" placeholder="Подробности задачи">${esc(pf.description||'')}</textarea>`)}<div class="grid">${field('Приоритет',`<select id="taskPriority"><option value="low" ${pf.priority==='low'?'selected':''}>Низкий</option><option value="medium" ${!pf.priority||pf.priority==='medium'?'selected':''}>Обычный</option><option value="high" ${pf.priority==='high'?'selected':''}>Высокий</option><option value="urgent" ${pf.priority==='urgent'?'selected':''}>Срочный</option></select>`)}${field('Срок','<input id="taskDeadline" type="datetime-local">')}</div><h3>Кому назначить</h3><div class="small">Можно одновременно выбрать конкретных сотрудников и целые магазины. Для магазина задача назначится всем его активным сотрудникам.</div>${field('Сотрудники',multiChoices('taskEmployees',m.employees))}${field('Магазины',multiChoices('taskStores',m.stores,'name',pf.store_ids||[]))}<h3>Чек-лист</h3><div id="taskChecklist"></div><button class="btn secondary" onclick="addTaskChecklistRow()">+ Добавить пункт</button><h3>Подтверждение выполнения</h3><label class="row"><input id="taskReqPhoto" type="checkbox" style="width:auto"> Требовать фото</label><label class="row"><input id="taskReqFile" type="checkbox" style="width:auto"> Требовать файл</label><label class="row"><input id="taskReqComment" type="checkbox" style="width:auto"> Требовать комментарий</label><h3>Повторяемость</h3><div class="grid">${field('Повторять','<select id="taskRec"><option value="none">Не повторять</option><option value="daily">Ежедневно</option><option value="weekly">Еженедельно</option><option value="monthly">Ежемесячно</option></select>')}${field('Повторять до','<input id="taskRecUntil" type="datetime-local">')}</div><button class="btn" style="width:100%;margin-top:10px" onclick="submitTaskV2()">Поставить задачу</button></div>`}
async function submitTaskV2(){const checklist=[...document.querySelectorAll('[data-task-check]')].map(r=>({text:r.querySelector('[data-text]').value.trim(),require_photo:r.querySelector('[data-photo]').checked})).filter(x=>x.text);const body={title:taskTitle.value.trim(),description:taskDesc.value.trim()||null,priority:taskPriority.value,deadline:taskDeadline.value?new Date(taskDeadline.value).toISOString():null,employee_ids:checkedIds('taskEmployees'),store_ids:checkedIds('taskStores'),checklist,require_photo:taskReqPhoto.checked,require_file:taskReqFile.checked,require_comment:taskReqComment.checked,recurrence:taskRec.value,recurrence_until:taskRecUntil.value?new Date(taskRecUntil.value).toISOString():null};try{const r=await api('/api/tasks-v2',{method:'POST',body:JSON.stringify(body)});if(state.taskPrefill?.violation_id){try{await api(`/api/inspections/violations/${state.taskPrefill.violation_id}/link-task/${r.id}`,{method:'POST',body:'{}'})}catch(e){console.warn('Violation link failed',e)}}state.taskPrefill=null;flash('Задача создана');taskTab='control';await renderTasks()}catch(e){flash(e.message,'error')}}
async function taskApplyFilters(scope){await renderTaskList(scope,true)}
function taskQuery(scope,fromForm=false){const q=new URLSearchParams({scope});if(fromForm){if(tfStatus.value)q.set('status',tfStatus.value);if(tfPriority.value)q.set('priority',tfPriority.value);if(tfStore.value)q.set('store_id',tfStore.value);if(tfEmployee.value)q.set('employee_id',tfEmployee.value);if(typeof tfCreator!=='undefined'&&tfCreator.value)q.set('creator_id',tfCreator.value);if(tfFrom.value)q.set('deadline_from',new Date(tfFrom.value).toISOString());if(tfTo.value)q.set('deadline_to',new Date(tfTo.value).toISOString())}return q.toString()}
function targetSummary(t){const e=t.targets.filter(x=>x.type==='employee').map(x=>x.employee_name),s=t.targets.filter(x=>x.type==='store').map(x=>x.store_name);return [...s.map(x=>'🏪 '+x),...e.map(x=>'👤 '+x)].join(' · ')||'—'}
function overallStatus(t){const c=t.status_counts||{};if(c.review)return 'На проверке';if(c.rejected)return 'Не принята';if(c.in_progress)return 'В работе';if(c.new)return 'Новая';if(c.done&&c.done===t.assignee_count)return 'Выполнена';return '—'}
async function renderTaskList(scope,fromForm=false){const meta=await api('/api/tasks-v2/meta');const q=taskQuery(scope,fromForm);const rows=await api('/api/tasks-v2?'+q);document.getElementById('taskBody').innerHTML=`${scope==='control'?taskFilterHtml(meta,scope):''}${rows.map(t=>`<div class="card" onclick="openTaskV2(${t.id},'${scope}')" style="cursor:pointer"><div class="row between"><b>${esc(t.title)}</b><span class="pill ${taskPriorityClass[t.priority]||''}">${esc(taskPriorityNames[t.priority]||t.priority)}</span></div><div class="small" style="margin-top:5px">${t.deadline?'⏱ '+new Date(t.deadline).toLocaleString():'Без срока'} · ${esc(overallStatus(t))}</div><div class="small" style="margin-top:6px">${esc(targetSummary(t))}</div><div class="row" style="margin-top:8px"><span class="pill">Исполнителей: ${t.assignee_count}</span>${Object.entries(t.status_counts||{}).map(([k,v])=>`<span class="pill">${esc(taskStatusNames[k]||k)}: ${v}</span>`).join('')}</div></div>`).join('')||'<div class="muted">Задач пока нет.</div>'}`}
async function openTaskV2(id,scope=taskTab){const t=await api('/api/tasks-v2/'+id),meta=await api('/api/tasks-v2/meta');const my=t.assignees.find(a=>a.employee_id===meta.current_employee_id);document.getElementById('taskBody').innerHTML=`<button class="btn secondary" onclick="renderTaskList('${scope}')">← Назад</button><div class="card"><div class="row between"><h3 style="margin:0">${esc(t.title)}</h3><span class="pill ${taskPriorityClass[t.priority]||''}">${esc(taskPriorityNames[t.priority])}</span></div><p>${esc(t.description||'')}</p><div class="small">Поставил: ${esc(t.creator_name||'—')}<br>${t.deadline?'Срок: '+new Date(t.deadline).toLocaleString():'Без срока'}<br>Повтор: ${esc({none:'нет',daily:'ежедневно',weekly:'еженедельно',monthly:'ежемесячно'}[t.recurrence]||t.recurrence)}</div>${(t.created_by===state.user.id||['operations_director','leader','admin'].includes(state.user.role))?`<button class="btn secondary" style="margin-top:10px" onclick="editTaskQuick(${t.id})">Редактировать</button>`:''}</div>${my?taskAssigneeCard(t,my,true):''}<h3>${my?'Другие исполнители':'Исполнители'}</h3>${t.assignees.filter(a=>!my||a.id!==my.id).map(a=>taskAssigneeCard(t,a,false)).join('')||'<div class="muted">Нет других исполнителей.</div>'}<div class="card"><h3>Комментарии</h3>${t.comments.map(c=>`<div class="list-item"><b>${esc(c.user_name||'')}</b><div>${esc(c.text)}</div><div class="small">${new Date(c.created_at).toLocaleString()}</div></div>`).join('')||'<div class="muted">Комментариев нет.</div>'}${field('Новый комментарий','<textarea id="taskComment"></textarea>')}<button class="btn secondary" onclick="addTaskComment(${t.id},${my?my.id:'null'})">Отправить</button></div><div class="card"><h3>История</h3>${t.history.map(h=>`<div class="list-item"><b>${esc(h.user_name||'Система')}</b> — ${esc(h.action)}<div class="small">${new Date(h.created_at).toLocaleString()}</div></div>`).join('')}</div>`}
function taskAssigneeCard(t,a,isMy){const canReview=a.status==='review';return `<div class="card"><div class="row between"><b>${esc(a.employee_name)}</b><span class="pill">${esc(taskStatusNames[a.status]||a.status)}</span></div>${a.source_store_name?`<div class="small">🏪 ${esc(a.source_store_name)}</div>`:''}${a.review_comment?`<div class="notice error" style="margin-top:8px">${esc(a.review_comment)}</div>`:''}${a.checklist.length?`<h3>Чек-лист</h3>${a.checklist.map(i=>`<div class="row" style="flex-wrap:nowrap"><label class="row" style="flex:1;flex-wrap:nowrap"><input type="checkbox" ${i.done?'checked':''} ${!isMy?'disabled':''} style="width:auto" onchange="taskCheck(${t.id},${a.id},${i.id},this.checked)"><span>${esc(i.text)}${i.require_photo?' 📷':''}</span></label>${isMy&&i.require_photo?`<button class="btn secondary" onclick="taskAttach(${t.id},${a.id},'photo',${i.id})">Фото</button>`:''}</div>`).join('')}`:''}${a.attachments.length?`<div class="small" style="margin-top:8px">Вложения: ${a.attachments.map(x=>`<a href="/api/tasks-v2/${t.id}/attachments/${x.id}/content" target="_blank">${esc(x.file_name||x.kind)}</a>`).join(' · ')}</div>`:''}<div class="row" style="margin-top:10px">${isMy&&a.status==='new'?`<button class="btn" onclick="taskStatus(${t.id},${a.id},'in_progress')">Начать</button>`:''}${isMy&&['in_progress','rejected'].includes(a.status)?`<button class="btn secondary" onclick="taskAttach(${t.id},${a.id},'photo')">+ Фото</button><button class="btn secondary" onclick="taskAttach(${t.id},${a.id},'file')">+ Файл</button><button class="btn ok" onclick="taskStatus(${t.id},${a.id},'review')">На проверку</button>`:''}${canReview?`<button class="btn ok" onclick="taskReview(${t.id},${a.id},'done')">Принять</button><button class="btn danger" onclick="taskReview(${t.id},${a.id},'rejected')">Не принять</button>`:''}</div></div>`}
async function editTaskQuick(tid){const t=await api('/api/tasks-v2/'+tid);const title=prompt('Название задачи:',t.title);if(title===null)return;const deadline=prompt('Срок в формате ГГГГ-ММ-ДДTЧЧ:ММ (пусто = без срока):',t.deadline?t.deadline.slice(0,16):'');if(deadline===null)return;try{await api('/api/tasks-v2/'+tid,{method:'PATCH',body:JSON.stringify({title:title.trim()||t.title,deadline:deadline?new Date(deadline).toISOString():null})});flash('Задача обновлена');await openTaskV2(tid,taskTab)}catch(e){flash(e.message,'error')}}
async function taskStatus(tid,aid,status){try{await api(`/api/tasks-v2/${tid}/assignees/${aid}/status`,{method:'PATCH',body:JSON.stringify({status})});flash('Статус обновлён');await openTaskV2(tid,taskTab)}catch(e){flash(e.message,'error')}}
async function taskCheck(tid,aid,iid,done){try{await api(`/api/tasks-v2/${tid}/assignees/${aid}/checklist/${iid}`,{method:'PATCH',body:JSON.stringify({done})});await openTaskV2(tid,taskTab)}catch(e){flash(e.message,'error');await openTaskV2(tid,taskTab)}}
async function taskReview(tid,aid,decision){let comment='';if(decision==='rejected'){comment=prompt('Укажите замечание исполнителю:')||'';if(!comment.trim())return}try{await api(`/api/tasks-v2/${tid}/assignees/${aid}/review`,{method:'POST',body:JSON.stringify({decision,comment:comment||null})});flash(decision==='done'?'Задача принята':'Задача возвращена');await openTaskV2(tid,taskTab)}catch(e){flash(e.message,'error')}}

<div class="card"><h3>Магазины</h3><div class="grid">${field('Название','<input id="aStoreName">')}${field('Код','<input id="aStoreCode">')}</div><button class="btn" onclick="addStore()">Добавить</button>${stores.map(x=>`<div class="list-item row between"><span>${esc(x.name)}</span><button class="btn secondary" onclick="toggleEntity('stores',${x.id},${!x.active})">${x.active?'Отключить':'Включить'}</button></div>`).join('')}</div>
<div class="card"><h3>Поставщики</h3><div class="grid">${field('Название','<input id="aSupName">')}${field('Срок заявки','<input id="aSupDeadline" type="time" value="10:00">')}</div><button class="btn" onclick="addSupplier()">Добавить</button>${sups.map(x=>`<div class="list-item row between"><span>${esc(x.name)} <span class="small">до ${esc(x.deadline_time)}</span></span><button class="btn secondary" onclick="toggleEntity('suppliers',${x.id},${!x.active})">${x.active?'Отключить':'Включить'}</button></div>`).join('')}</div>
<div class="card"><h3>Категории и товары</h3><div class="grid">${field('Категория','<input id="aCatName">')}${field('Поставщик',selectHtml('aCatSup',sups))}</div><button class="btn secondary" onclick="addCategory()">+ Категория</button><hr style="border:0;border-top:1px solid var(--line);margin:14px 0"><div class="grid">${field('Товар','<input id="aProdName">')}${field('Поставщик',selectHtml('aProdSup',sups))}${field('Категория',selectHtml('aProdCat',cats))}${field('Ед.','<input id="aProdUnit" value="шт">')}</div><button class="btn" onclick="addProduct()">Добавить товар</button><div class="small" style="margin-top:10px">Всего товаров: ${prods.length}</div></div>
<div class="card"><h3>График поставщиков по точкам</h3><div class="grid3">${field('Точка',selectHtml('aSchStore',stores))}${field('Поставщик',selectHtml('aSchSup',sups))}${field('День недели','<select id="aSchDay"><option value="0">Пн</option><option value="1">Вт</option><option value="2">Ср</option><option value="3">Чт</option><option value="4">Пт</option><option value="5">Сб</option><option value="6">Вс</option></select>')}</div><button class="btn" onclick="addSchedule()">Сохранить</button><div class="small">Записей расписания: ${schedules.length}</div></div>
<div class="card"><h3>Пользователи и роли</h3>${users.map(u=>`<div class="list-item"><b>${esc(u.full_name||u.telegram_id)}</b><div class="grid3"><select id="ur${u.id}">${Object.entries(roleNames).map(([k,v])=>`<option value="${k}" ${u.role===k?'selected':''}>${v}</option>`).join('')}</select><select id="us${u.id}"><option value="active" ${u.status==='active'?'selected':''}>Активен</option><option value="pending" ${u.status==='pending'?'selected':''}>Ожидает</option></select><input id="ust${u.id}" value="${(u.store_ids||[]).join(',')}" placeholder="ID точек"></div><button class="btn secondary" onclick="saveUser(${u.id})">Сохранить</button></div>`).join('')}</div>
<div class="card"><h3>Шаблоны пересменок</h3><div id="shiftBuilder">${templateBuilder('shift',stores)}</div><div class="small">Создано шаблонов: ${shiftTs.length}</div>${shiftTs.map(t=>`<div class="list-item"><b>${esc(t.name)}</b> · точка #${t.store_id} · ${esc(t.shift_kind)} · полей ${t.fields.length}</div>`).join('')}</div>
<div class="notice">Формы проверок теперь настраиваются в разделе «Проверки → Формы».</div>`;}
function templateBuilder(type,stores){const shift=type==='shift';return `${field('Название',`<input id="${type}Name">`)}${shift?field('Точка',selectHtml(type+'Store',stores))+field('Пересменка',`<select id="${type}Kind"><option value="morning">Утренняя</option><option value="evening">Вечерняя</option></select>`):''}<div id="${type}Fields"></div><div class="row"><button class="btn secondary" onclick="addTemplateField('${type}')">+ Поле</button><button class="btn" onclick="saveTemplate('${type}')">Сохранить шаблон</button></div>`;}
function addTemplateField(type){const c=document.getElementById(type+'Fields');const i=c.children.length;c.insertAdjacentHTML('beforeend',`<div class="field-row" data-template-row><input placeholder="Название поля" data-label><select data-type><option value="text">Текст</option><option value="textarea">Комментарий</option><option value="number">Число</option><option value="boolean">Да/Нет</option><option value="select">Выбор</option></select><label><input type="checkbox" data-required style="width:auto"> обяз.</label><button class="btn danger" onclick="this.closest('[data-template-row]').remove()">×</button>${type==='inspection'?'<label class="small"><input type="checkbox" data-violation style="width:auto"> нарушение при «Нет»</label>':''}</div>`);}
async function saveTemplate(type){const fields=[...document.querySelectorAll(`#${type}Fields [data-template-row]`)].map((r,i)=>{const label=r.querySelector('[data-label]').value;return {key:'f_'+Date.now()+'_'+i,label,field_type:r.querySelector('[data-type]').value,required:r.querySelector('[data-required]').checked,sort_order:i,creates_violation_on_false:!!r.querySelector('[data-violation]')?.checked}});const body=type==='shift'?{store_id:+document.getElementById(type+'Store').value,name:document.getElementById(type+'Name').value,shift_kind:document.getElementById(type+'Kind').value,fields}:{name:document.getElementById(type+'Name').value,fields};await api(`/api/admin/${type==='shift'?'shift-templates':'inspection-templates'}`,{method:'POST',body:JSON.stringify(body)});flash('Шаблон создан');go('admin');}
async function addStore(){await api('/api/admin/stores',{method:'POST',body:JSON.stringify({name:aStoreName.value,code:aStoreCode.value||null})});go('admin')}

async function addSchedule(){await api('/api/admin/schedules',{method:'POST',body:JSON.stringify({store_id:+aSchStore.value,supplier_id:+aSchSup.value,weekday:+aSchDay.value,active:true})});flash('Расписание сохранено');go('admin')}
