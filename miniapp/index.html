const employeePositionNames={seller:'Продавец',mentor:'Наставник',manager:'Управляющий',operations_director:'Операционный директор',leader:'Руководитель',admin:'Администратор'};
const employeeStatusNames={working:'Работает',trainee:'Стажёр',vacation:'Отпуск',fired:'Уволен'};
async function renderEmployees(){
  const [rows,meta]=await Promise.all([api('/api/employees'),api('/api/employees/meta')]);
  state.employeeRows=rows;state.employeeMeta=meta;
  const q=(state.employeeQuery||'').toLowerCase().trim();
  const filtered=rows.filter(e=>(!q||e.full_name.toLowerCase().includes(q))&&(!state.employeeStatus||e.employment_status===state.employeeStatus)&&(!state.employeePosition||e.position===state.employeePosition));
  document.getElementById('app').innerHTML=`<div class="order-head"><h2>Сотрудники</h2><button class="btn mini" onclick="openEmployeeEditor()">+ Сотрудник</button></div>
  <div class="card"><div class="employee-toolbar">${field('Поиск','<input id="empSearch" placeholder="ФИО" value="'+esc(state.employeeQuery||'')+'" oninput="filterEmployeeCardsInput(this.value)">')}<span id="employeeCount" class="pill">${filtered.length}</span></div>
  <div class="employee-filters">${field('Должность',`<select onchange="state.employeePosition=this.value;renderEmployees()"><option value="">Все</option>${Object.entries(employeePositionNames).map(([k,v])=>`<option value="${k}" ${state.employeePosition===k?'selected':''}>${v}</option>`).join('')}</select>`)}${field('Статус',`<select onchange="state.employeeStatus=this.value;renderEmployees()"><option value="">Все</option>${Object.entries(employeeStatusNames).map(([k,v])=>`<option value="${k}" ${state.employeeStatus===k?'selected':''}>${v}</option>`).join('')}</select>`)}</div></div>
  ${filtered.map(e=>`<div class="employee-card" data-employee-name="${esc(e.full_name.toLowerCase())}" onclick="openEmployeeEditor(${e.id})"><div class="row between"><div class="name">${esc(e.full_name)}</div><span class="pill employee-status-${e.employment_status}">${esc(employeeStatusNames[e.employment_status]||e.employment_status)}</span></div><div class="small">${esc(employeePositionNames[e.position]||e.position)} · ${e.hire_date?'с '+new Date(e.hire_date+'T12:00:00').toLocaleDateString('ru-RU'):'дата приёма не указана'}</div><div class="employee-badges">${(e.stores||[]).map(st=>`<span class="employee-store">${esc(st.name)}</span>`).join('')||'<span class="small">Нет закреплённых точек</span>'}</div><div style="margin-top:6px">${e.user_id?`<span class="linked-pill">Telegram связан${e.telegram_id?' · '+e.telegram_id:''}</span>`:`<span class="unlinked-pill">Telegram не связан${e.telegram_id?' · ID '+e.telegram_id:''}</span>`}</div></div>`).join('')||'<div class="notice">Сотрудников пока нет.</div>'}`;
}
function filterEmployeeCardsInput(v){state.employeeQuery=v;const q=(v||'').toLowerCase().trim();let n=0;document.querySelectorAll('.employee-card').forEach(c=>{const show=!q||(c.dataset.employeeName||'').includes(q);c.style.display=show?'':'none';if(show)n++});const el=document.getElementById('employeeCount');if(el)el.textContent=n}
function employeeStoreChecks(selected=[]){const meta=state.employeeMeta||{stores:[]};return `<div class="check-grid">${meta.stores.map(s=>`<label class="check-item"><input type="checkbox" name="empStore" value="${s.id}" ${selected.includes(s.id)?'checked':''}>${esc(s.name)}</label>`).join('')}</div>`}
function openEmployeeEditor(id=null){const e=id?(state.employeeRows||[]).find(x=>x.id===id):null;const meta=state.employeeMeta||{users:[]};const userOpts=meta.users.map(u=>`<option value="${u.id}" ${e?.user_id===u.id?'selected':''}>${esc(u.name)} · ${u.telegram_id}${u.linked&&e?.user_id!==u.id?' · уже связан':''}</option>`).join('');showSheet(`<h3>${e?'Карточка сотрудника':'Новый сотрудник'}</h3>${field('ФИО',`<input id="empName" value="${esc(e?.full_name||'')}">`)}<div class="grid">${field('Должность',`<select id="empPosition">${Object.entries(employeePositionNames).map(([k,v])=>`<option value="${k}" ${e?.position===k?'selected':''}>${v}</option>`).join('')}</select>`)}${field('Статус',`<select id="empStatus">${Object.entries(employeeStatusNames).map(([k,v])=>`<option value="${k}" ${(e?.employment_status||'working')===k?'selected':''}>${v}</option>`).join('')}</select>`)}</div>${field('Дата приёма',`<input id="empHire" type="date" value="${esc(e?.hire_date||'')}">`)}${field('Telegram ID',`<input id="empTelegram" inputmode="numeric" placeholder="Необязательно" value="${esc(e?.telegram_id||'')}">`)}${field('Связанный Telegram-аккаунт',`<select id="empUser"><option value="">Не связан</option>${userOpts}</select>`)}<div class="field"><label>Магазины, где может работать</label>${employeeStoreChecks(e?.store_ids||[])}</div>${field('Комментарий',`<textarea id="empComment" placeholder="Необязательно">${esc(e?.comment||'')}</textarea>`)}<div class="row"><button class="btn" onclick="saveEmployee(${id||'null'})">${e?'Сохранить':'Создать'}</button>${e?`<button class="btn danger" onclick="deleteEmployee(${e.id})">Удалить / уволить</button>`:''}</div><div class="small" style="margin-top:8px">Сотрудника можно создать без Telegram. Для «Моего графика» аккаунт нужно связать позже.</div>`)}
async function saveEmployee(id){const store_ids=[...document.querySelectorAll('input[name=empStore]:checked')].map(x=>+x.value);const body={full_name:empName.value.trim(),position:empPosition.value,employment_status:empStatus.value,hire_date:empHire.value||null,telegram_id:empTelegram.value?+empTelegram.value:null,user_id:empUser.value?+empUser.value:null,store_ids,comment:empComment.value||null,active:empStatus.value!=='fired'};try{if(id)await api('/api/employees/'+id,{method:'PATCH',body:JSON.stringify(body)});else await api('/api/employees',{method:'POST',body:JSON.stringify(body)});closeWorkSheet();state.workContext=null;flash(id?'Сотрудник обновлён':'Сотрудник создан');await renderEmployees()}catch(e){flash(e.message,'error')}}
async function deleteEmployee(id){if(!confirm('Удалить карточку? Если сотрудник уже есть в истории, Core сохранит его и переведёт в статус «Уволен».'))return;try{const r=await api('/api/employees/'+id,{method:'DELETE'});closeWorkSheet();state.workContext=null;flash(r.detail||'Карточка удалена');await renderEmployees()}catch(e){flash(e.message,'error')}}

const workStatusNames={day_off:'Выходной',vacation:'Отпуск',sick:'Больничный',training:'Обучение'};
const workStatusIcons={day_off:'○',vacation:'☀',sick:'✚',training:'◆'};
const subStatusNames={new:'Новая',searching:'Ищем замену',assigned:'Назначена',closed:'Закрыта',cancelled:'Отменена'};
const ruMonths=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
function workYM(){return {year:state.workDate.getFullYear(),month:state.workDate.getMonth()+1}}
function workMonthLabel(){return `${ruMonths[state.workDate.getMonth()]} ${state.workDate.getFullYear()}`}
function dateRu(v){const d=new Date(v+'T12:00:00');return d.toLocaleDateString('ru-RU',{weekday:'short',day:'2-digit',month:'short'})}
function isoDay(year,month,day){return `${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`}
function workTabs(active){return `<div class="work-tabs">
<button class="${active==='my'?'active':''}" onclick="setWorkTab('my')">Мой график</button>
<button class="${active==='stores'?'active':''}" onclick="setWorkTab('stores')">По магазинам</button>
<button class="${active==='editor'?'active':''}" onclick="setWorkTab('editor')">Редактор</button>
<button class="${active==='subs'?'active':''}" onclick="setWorkTab('subs')">Подмены</button>
<button class="${active==='errors'?'active':''}" onclick="setWorkTab('errors')">Ошибки</button>
<button class="${active==='history'?'active':''}" onclick="setWorkTab('history')">История</button>
</div>`}
function workFrame(active,body){document.getElementById('app').innerHTML=`<div class="order-head"><h2>График работы</h2><button class="icon-btn" onclick="showRelatedKnowledge('work_schedule')">▤</button></div>${workTabs(active)}<div id="workBody">${body}</div>`}
async function renderWorkSchedule(){await renderWorkTab(state.workTab||'my')}
async function setWorkTab(tab){state.workTab=tab;await renderWorkTab(tab)}
async function renderWorkTab(tab){state.workTab=tab;if(tab==='my')return renderWorkMy();if(tab==='stores')return renderWorkStores();if(tab==='editor')return renderWorkEditor();if(tab==='subs')return renderWorkSubs();if(tab==='errors')return renderWorkErrors();if(tab==='history')return renderWorkHistory();return renderWorkMy()}
function monthNav(){return `<div class="month-nav"><button class="btn secondary mini" onclick="moveWorkMonth(-1)">‹</button><div class="month-title">${workMonthLabel()}</div><button class="btn secondary mini" onclick="moveWorkMonth(1)">›</button></div>`}
async function moveWorkMonth(delta){state.workDate=new Date(state.workDate.getFullYear(),state.workDate.getMonth()+delta,1);state.workContext=null;await renderWorkTab(state.workTab)}
async function loadWorkContext(force=false){if(state.workContext&&!force){const ym=workYM();if(state.workContext.year===ym.year&&state.workContext.month===ym.month)return state.workContext}const ym=workYM();state.workContext=await api(`/api/work-schedule/context?year=${ym.year}&month=${ym.month}`);return state.workContext}
function findAbsence(ctx,userId,dateStr){return (ctx.absences||[]).find(a=>a.user_id===userId&&a.date_from<=dateStr&&a.date_to>=dateStr)}
function dayAssignments(ctx,dateStr,storeId=null){return (ctx.assignments||[]).filter(a=>a.work_date===dateStr&&(!storeId||a.store_id===+storeId))}
function userAssignment(ctx,userId,dateStr){return (ctx.assignments||[]).find(a=>a.user_id===userId&&a.work_date===dateStr)}
async function renderWorkMy(){const ctx=await loadWorkContext();if(!ctx.me_id){workFrame('my',`${monthNav()}<div class="notice">Ваш Telegram-аккаунт пока не связан с карточкой сотрудника. Связать его можно в разделе «Сотрудники».</div>`);return}const ym=workYM();const my=(ctx.users||[]).find(u=>u.id===ctx.me_id);let rows='';for(let d=1;d<=ctx.days_in_month;d++){const ds=isoDay(ym.year,ym.month,d),a=userAssignment(ctx,ctx.me_id,ds),ab=findAbsence(ctx,ctx.me_id,ds);if(!a&&!ab)continue;rows+=`<div class="schedule-day"><div class="schedule-date">${dateRu(ds)}</div><div>${a?`<span class="shift-tag ${a.shift_type==='day'?'shift-day':'shift-night'}">${a.shift_type==='day'?'☀ Дневная':'☾ Ночная'}</span><div class="small">${esc(a.store_name)}</div>`:''}${ab?`<span class="shift-tag status-${ab.status}">${workStatusIcons[ab.status]||'•'} ${esc(workStatusNames[ab.status]||ab.status)}</span>${ab.comment?`<div class="small">${esc(ab.comment)}</div>`:''}`:''}</div></div>`}workFrame('my',`${monthNav()}${rows||'<div class="notice">На этот месяц у вас пока нет смен или специальных статусов.</div>'}`)}
function storeOptions(ctx,selected=''){return (ctx.stores||[]).map(s=>`<option value="${s.id}" ${String(selected)===String(s.id)?'selected':''}>${esc(s.name)}</option>`).join('')}
async function renderWorkStores(){const ctx=await loadWorkContext();if(!state.workStoreId&&ctx.stores?.length)state.workStoreId=ctx.stores[0].id;const storeId=+state.workStoreId;const ym=workYM();let rows='';for(let d=1;d<=ctx.days_in_month;d++){const ds=isoDay(ym.year,ym.month,d);const aa=dayAssignments(ctx,ds,storeId);const day=aa.filter(a=>a.shift_type==='day').sort((a,b)=>a.slot-b.slot);const night=aa.filter(a=>a.shift_type==='night').sort((a,b)=>a.slot-b.slot);rows+=`<tr><td><b>${d}</b><div class="small">${new Date(ds+'T12:00:00').toLocaleDateString('ru-RU',{weekday:'short'})}</div></td><td>${day.length?day.map(a=>esc(a.user_name)).join('<br>'):'<span class="muted">—</span>'}</td><td>${night.length?night.map(a=>esc(a.user_name)).join('<br>'):'<span class="muted">—</span>'}</td></tr>`}workFrame('stores',`${monthNav()}${field('Магазин',`<select id="workStoreView" onchange="state.workStoreId=this.value;renderWorkStores()">${storeOptions(ctx,storeId)}</select>`)}<div class="table-scroll"><table class="store-schedule"><thead><tr><th>Дата</th><th>День · 1 продавец</th><th>Ночь · 2 продавца</th></tr></thead><tbody>${rows}</tbody></table></div>`)}
function assignmentSlot(ctx,storeId,dateStr,shiftType,slot){return (ctx.assignments||[]).find(a=>a.store_id===+storeId&&a.work_date===dateStr&&a.shift_type===shiftType&&a.slot===slot)}
async function renderWorkEditor(){const ctx=await loadWorkContext();if(!state.workStoreId&&ctx.stores?.length)state.workStoreId=ctx.stores[0].id;const storeId=+state.workStoreId;const ym=workYM();let rows='';for(let d=1;d<=ctx.days_in_month;d++){const ds=isoDay(ym.year,ym.month,d),day=assignmentSlot(ctx,storeId,ds,'day',1),n1=assignmentSlot(ctx,storeId,ds,'night',1),n2=assignmentSlot(ctx,storeId,ds,'night',2);const slot=(a,shift,sl)=>a?`<div class="slot filled" onclick="openShiftPicker('${ds}','${shift}',${sl},${a.id})"><span>${esc(a.user_name)}</span><span class="remove">×</span></div>`:`<div class="slot" onclick="openShiftPicker('${ds}','${shift}',${sl},null)"><span class="muted">+ назначить</span></div>`;rows+=`<tr><td><b>${d}</b><div class="small">${new Date(ds+'T12:00:00').toLocaleDateString('ru-RU',{weekday:'short'})}</div></td><td>${slot(day,'day',1)}</td><td>${slot(n1,'night',1)}${slot(n2,'night',2)}</td></tr>`}const absList=(ctx.absences||[]).map(a=>`<div class="list-item row between"><div><b>${esc(a.user_name)}</b><div class="small">${esc(workStatusNames[a.status]||a.status)} · ${dateRu(a.date_from)}${a.date_to!==a.date_from?' — '+dateRu(a.date_to):''}</div>${a.comment?`<div class="small">${esc(a.comment)}</div>`:''}</div><button class="btn danger mini" onclick="deleteWorkAbsence(${a.id})">Удалить</button></div>`).join('');workFrame('editor',`${monthNav()}<div class="editor-toolbar">${field('Магазин',`<select id="workEditorStore" onchange="state.workStoreId=this.value;renderWorkEditor()">${storeOptions(ctx,storeId)}</select>`)}<button class="btn secondary mini" onclick="openAbsenceSheet()">+ Статус</button></div><div class="small" style="margin:4px 0 8px">День — 1 продавец, ночь — 2. Core не позволит назначить сотрудника на две точки в один день или сразу на дневную после ночной.</div><div class="table-scroll"><table class="store-schedule"><thead><tr><th>Дата</th><th>День</th><th>Ночь</th></tr></thead><tbody>${rows}</tbody></table></div><div class="card"><h3>Выходные, отпуска, больничные, обучение</h3>${absList||'<div class="small">На этот месяц специальных статусов нет.</div>'}</div>`)}
async function openShiftPicker(dateStr,shiftType,slot,assignmentId){const ctx=await loadWorkContext();const storeId=+state.workStoreId;if(assignmentId){const a=ctx.assignments.find(x=>x.id===assignmentId);showSheet(`<h3>${dateRu(dateStr)} · ${shiftType==='day'?'Дневная':'Ночная'} смена</h3><div class="card"><b>${esc(a?.user_name||'')}</b><div class="small">${esc(a?.store_name||'')}</div></div><button class="btn danger" onclick="deleteWorkAssignment(${assignmentId})">Удалить из графика</button>`);return}const eligible=(ctx.users||[]).filter(u=>u.store_ids?.includes(storeId));const items=eligible.map(u=>{const a=userAssignment(ctx,u.id,dateStr),ab=findAbsence(ctx,u.id,dateStr);let why='';if(!['working','trainee'].includes(u.employment_status))why=employeeStatusNames[u.employment_status]||'Недоступен';else if(a)why='Уже есть смена';else if(ab)why=workStatusNames[ab.status]||ab.status;return `<div class="candidate ${why?'disabled':''}"><div><b>${esc(u.name)}</b>${why?`<div class="small">${esc(why)}</div>`:''}</div><button class="btn mini ${why?'secondary':''}" ${why?'disabled':''} onclick="assignWorkShift(${storeId},${u.id},'${dateStr}','${shiftType}',${slot})">Выбрать</button></div>`}).join('');showSheet(`<h3>${dateRu(dateStr)} · ${shiftType==='day'?'Дневная':'Ночная'} смена</h3><div class="small">Сотрудники, закреплённые за ${esc(ctx.stores.find(s=>s.id===storeId)?.name||'точкой')}</div><div style="margin-top:8px">${items||'<div class="notice">Нет закреплённых сотрудников.</div>'}</div>`)}
function showSheet(body){document.body.insertAdjacentHTML('beforeend',`<div id="workSheet" class="sheet-backdrop" onclick="if(event.target===this)closeWorkSheet()"><div class="sheet"><div class="sheet-handle"></div>${body}</div></div>`)}
function closeWorkSheet(){document.getElementById('workSheet')?.remove()}
async function assignWorkShift(storeId,userId,dateStr,shiftType,slot){try{await api('/api/work-schedule/assignments',{method:'POST',body:JSON.stringify({store_id:storeId,user_id:userId,work_date:dateStr,shift_type:shiftType,slot})});closeWorkSheet();state.workContext=null;flash('Смена назначена');await renderWorkEditor()}catch(e){flash(e.message,'error')}}
async function deleteWorkAssignment(id){try{await api(`/api/work-schedule/assignments/${id}`,{method:'DELETE'});closeWorkSheet();state.workContext=null;flash('Смена удалена');await renderWorkEditor()}catch(e){flash(e.message,'error')}}
async function openAbsenceSheet(){const ctx=await loadWorkContext();const users=ctx.users||[];const today=isoDay(state.workDate.getFullYear(),state.workDate.getMonth()+1,1);showSheet(`<h3>Добавить статус сотруднику</h3>${field('Сотрудник',`<select id="absUser">${users.map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join('')}</select>`)}<div class="grid">${field('С','<input id="absFrom" type="date" value="'+today+'">')}${field('По','<input id="absTo" type="date" value="'+today+'">')}</div>${field('Статус','<select id="absStatus"><option value="day_off">Выходной</option><option value="vacation">Отпуск</option><option value="sick">Больничный</option><option value="training">Обучение</option></select>')}${field('Комментарий','<textarea id="absComment" placeholder="Необязательно"></textarea>')}<button class="btn" onclick="saveAbsence()">Сохранить</button><div class="small" style="margin-top:8px">Если на этот период уже стоят смены, они не удалятся: Core покажет конфликт в разделе «Ошибки».</div>`)}
async function saveAbsence(){try{await api('/api/work-schedule/absences',{method:'POST',body:JSON.stringify({user_id:+absUser.value,date_from:absFrom.value,date_to:absTo.value,status:absStatus.value,comment:absComment.value||null})});closeWorkSheet();state.workContext=null;flash('Статус сохранён');await renderWorkEditor()}catch(e){flash(e.message,'error')}}
async function deleteWorkAbsence(id){try{await api(`/api/work-schedule/absences/${id}`,{method:'DELETE'});state.workContext=null;flash('Статус удалён');await renderWorkEditor()}catch(e){flash(e.message,'error')}}
async function renderWorkErrors(){const ym=workYM();const ctx=await loadWorkContext();const data=await api(`/api/work-schedule/errors?year=${ym.year}&month=${ym.month}`);const items=(data.items||[]).map(x=>`<div class="error-card ${x.severity==='warning'?'warning-card':''}"><div class="row between"><b>${esc(x.title)}</b><span class="small">${dateRu(x.work_date)}</span></div><div class="small">${x.store_name?esc(x.store_name)+' · ':''}${x.shift_type==='day'?'День':x.shift_type==='night'?'Ночь':''}${x.user_name?' · '+esc(x.user_name):''}</div><div style="margin-top:5px">${esc(x.detail||'')}</div><div class="row" style="margin-top:7px">${x.can_create_substitution?`<button class="btn mini" onclick='createSubFromError(${JSON.stringify(x)})'>Создать подмену</button>`:''}<button class="btn secondary mini" onclick="state.workStoreId='${x.store_id||''}';setWorkTab('editor')">В редактор</button></div></div>`).join('');workFrame('errors',`${monthNav()}<div class="row between"><div class="small">Проверка всего месяца</div><span class="badge-count">${data.count}</span></div>${items||'<div class="notice success">Ошибок в графике нет.</div>'}`)}
async function createSubFromError(x){try{await api('/api/work-schedule/substitutions',{method:'POST',body:JSON.stringify({store_id:+x.store_id,work_date:x.work_date,shift_type:x.shift_type||'day',absent_user_id:x.user_id||null,reason:x.title,comment:x.detail||null})});flash('Подмена создана');await setWorkTab('subs')}catch(e){flash(e.message,'error')}}
async function renderWorkSubs(){const ym=workYM();const ctx=await loadWorkContext();const rows=await api(`/api/work-schedule/substitutions?year=${ym.year}&month=${ym.month}`);const list=rows.map(x=>`<div class="sub-card"><div class="row between"><b>${dateRu(x.work_date)} · ${x.shift_type==='day'?'День':'Ночь'}</b><span class="pill">${esc(subStatusNames[x.status]||x.status)}</span></div><div>${esc(x.store_name)}</div><div class="small">Кого заменить: ${esc(x.absent_user_name||'свободное место')}</div>${x.reason?`<div class="small">Причина: ${esc(x.reason)}</div>`:''}${x.replacement_user_name?`<div style="margin-top:5px">Замена: <b>${esc(x.replacement_user_name)}</b></div>`:''}<div class="row" style="margin-top:8px">${!['closed','cancelled'].includes(x.status)?`<button class="btn mini" onclick="openCandidates(${x.id})">Подобрать замену</button>`:''}<select style="width:auto;padding:6px 8px" onchange="setSubStatus(${x.id},this.value)">${Object.entries(subStatusNames).map(([k,v])=>`<option value="${k}" ${x.status===k?'selected':''}>${v}</option>`).join('')}</select></div></div>`).join('');workFrame('subs',`${monthNav()}<div class="row between"><span class="small">Подмены за месяц</span><button class="btn mini" onclick="openNewSubSheet()">+ Подмена</button></div>${list||'<div class="notice">Подмен пока нет.</div>'}`)}
async function openNewSubSheet(){const ctx=await loadWorkContext();const ym=workYM();const first=isoDay(ym.year,ym.month,1);showSheet(`<h3>Новая подмена</h3>${field('Магазин',`<select id="subStore">${storeOptions(ctx)}</select>`)}${field('Дата',`<input id="subDate" type="date" value="${first}">`)}${field('Смена','<select id="subShift"><option value="day">Дневная</option><option value="night">Ночная</option></select>')}${field('Кого заменить','<select id="subAbsent"><option value="">Свободное место / не выбран</option>'+ctx.users.map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join('')+'</select>')}${field('Причина','<input id="subReason" placeholder="Например: больничный">')}${field('Комментарий','<textarea id="subComment"></textarea>')}<button class="btn" onclick="saveNewSub()">Создать</button>`)}
async function saveNewSub(){try{await api('/api/work-schedule/substitutions',{method:'POST',body:JSON.stringify({store_id:+subStore.value,work_date:subDate.value,shift_type:subShift.value,absent_user_id:subAbsent.value?+subAbsent.value:null,reason:subReason.value||null,comment:subComment.value||null})});closeWorkSheet();flash('Подмена создана');await renderWorkSubs()}catch(e){flash(e.message,'error')}}
async function openCandidates(id){const rows=await api(`/api/work-schedule/substitutions/${id}/candidates`);showSheet(`<h3>Кандидаты на подмену</h3>${rows.map(x=>`<div class="candidate ${x.eligible?'':'disabled'}"><div><b>${esc(x.user_name)}</b>${x.eligible?'<div class="small">Можно назначить</div>':`<div class="small">${esc((x.reasons||[]).join(' · '))}</div>`}</div><button class="btn mini" ${x.eligible?'':'disabled'} onclick="assignSub(${id},${x.user_id})">Назначить</button></div>`).join('')||'<div class="notice">Кандидатов нет.</div>'}`)}
async function assignSub(id,userId){try{await api(`/api/work-schedule/substitutions/${id}/assign`,{method:'POST',body:JSON.stringify({replacement_user_id:userId})});closeWorkSheet();state.workContext=null;flash('Замена назначена');await renderWorkSubs()}catch(e){flash(e.message,'error')}}
async function setSubStatus(id,status){try{await api(`/api/work-schedule/substitutions/${id}/status`,{method:'PATCH',body:JSON.stringify({status})});flash('Статус обновлён')}catch(e){flash(e.message,'error')}}
async function renderWorkHistory(){const ym=workYM();const rows=await api(`/api/work-schedule/history?year=${ym.year}&month=${ym.month}`);const actionNames={created:'Создано',deleted:'Удалено',deleted_for_substitution:'Заменено',assigned:'Назначена подмена',status_changed:'Изменён статус'};workFrame('history',`${monthNav()}${rows.map(x=>`<div class="history-item"><div class="row between"><b>${esc(actionNames[x.action]||x.action)}</b><span class="small">${x.created_at?new Date(x.created_at).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):''}</span></div><div class="small">${x.change_date?dateRu(x.change_date)+' · ':''}${x.store_name?esc(x.store_name)+' · ':''}${x.user_name?esc(x.user_name):''}</div><div class="small">Изменил: ${esc(x.changed_by_name||'Система')}</div></div>`).join('')||'<div class="notice">Изменений за этот месяц пока нет.</div>'}`)}


// --- Knowledge base ---------------------------------------------------------
function kbCanEdit(){return kbEditors.has(state.user?.role)}
function kbTabs(active){return `<div class="kb-tabs"><button class="${active==='base'?'active':''}" onclick="setKbTab('base')">База</button><button class="${active==='required'?'active':''}" onclick="setKbTab('required')">Обязательные</button>${kbCanEdit()?`<button class="${active==='manage'?'active':''}" onclick="setKbTab('manage')">Управление</button>`:''}</div>`}
async function renderKnowledge(){if(state.kbArticleId)return openKbArticle(state.kbArticleId,false);if(state.kbSectionId)return renderKbSection(state.kbSectionId);if(state.kbTab==='required')return renderKbRequired();if(state.kbTab==='manage'&&kbCanEdit())return renderKbManage();return renderKbHome()}
async function setKbTab(tab){state.kbTab=tab;state.kbSectionId=null;state.kbArticleId=null;await renderKnowledge()}
function kbHeader(active='base'){return `<div class="section-title"><h2 style="margin:0">База знаний</h2>${kbCanEdit()?'<span class="pill green">Редактор</span>':''}</div>${kbTabs(active)}`}
function kbStatusLabel(s){return {published:'Опубликовано',draft:'Черновик',archived:'Архив'}[s]||s}
function kbSectionTree(sections){const tops=sections.filter(x=>!x.parent_id);return tops.map(t=>({...t,children:sections.filter(x=>x.parent_id===t.id)}))}
function kbArticleCard(a){return `<div class="kb-article-card" onclick="openKbArticle(${a.id})"><div class="row between"><div class="kb-title">${esc(a.title)}</div>${kbCanEdit()?`<span class="kb-status ${a.status}">${esc(kbStatusLabel(a.status))}</span>`:''}</div>${a.summary?`<div class="small" style="margin-top:5px">${esc(a.summary)}</div>`:''}<div class="kb-meta"><span>◷ ${a.read_minutes} мин</span>${a.author_name?`<span>Автор: ${esc(a.author_name)}</span>`:''}${a.required_ack?'<span>✓ Ознакомление</span>':''}${(a.tags||[]).slice(0,3).map(t=>`<span>#${esc(t)}</span>`).join('')}</div></div>`}
async function renderKbHome(){const [sections,required]=await Promise.all([api('/api/knowledge/sections'),api('/api/knowledge/required')]);state.kbSections=sections;const pending=required.filter(x=>x.pending).length;const tree=kbSectionTree(sections);document.getElementById('app').innerHTML=`${kbHeader('base')}<div class="kb-search"><span>⌕</span><input id="kbSearchInput" type="search" placeholder="Поиск по статьям, разделам, тексту и тегам" onkeydown="if(event.key==='Enter')kbSearchRun(this.value)"><button class="icon-btn" onclick="kbSearchRun(document.getElementById('kbSearchInput').value)">Найти</button></div>${pending?`<div class="notice kb-required-card" onclick="setKbTab('required')" style="cursor:pointer"><b>Нужно ознакомиться: ${pending}</b><div class="small">Открыть обязательные материалы →</div></div>`:''}${tree.map(t=>`<div class="kb-section-card"><div class="kb-section-head" onclick="openKbSection(${t.id})" style="cursor:pointer"><div class="kb-section-icon">${esc(t.icon||'▤')}</div><div class="grow"><b>${esc(t.name)}</b><div class="small">${t.article_count} статей${t.description?' · '+esc(t.description):''}</div></div><span>›</span></div>${t.children.map(c=>`<div class="kb-sub-link" onclick="openKbSection(${c.id})"><span>${esc(c.name)} <span class="small">(${c.article_count})</span></span><span>›</span></div>`).join('')}</div>`).join('')||'<div class="notice">Разделов пока нет.</div>'}<div class="small" style="margin-top:14px">AI-поиск подготовлен технически и будет подключён вместе с AI-агентом.</div>`}
async function kbSearchRun(q){q=(q||'').trim();if(!q)return;state.kbSearchQuery=q;state.kbSectionId=null;state.kbArticleId=null;const rows=await api('/api/knowledge/search?q='+encodeURIComponent(q));document.getElementById('app').innerHTML=`${kbHeader('base')}<button class="btn secondary mini" onclick="renderKbHome()">← К базе знаний</button><div class="kb-search"><span>⌕</span><input id="kbSearchInput" value="${esc(q)}" onkeydown="if(event.key==='Enter')kbSearchRun(this.value)"><button class="icon-btn" onclick="kbSearchRun(document.getElementById('kbSearchInput').value)">Найти</button></div><div class="small">Найдено: ${rows.length}</div>${rows.map(kbArticleCard).join('')||'<div class="notice">Ничего не найдено.</div>'}`}
async function openKbSection(id){state.kbSectionId=+id;state.kbArticleId=null;await renderKbSection(+id)}
async function renderKbSection(id){const sections=state.kbSections.length?state.kbSections:await api('/api/knowledge/sections');state.kbSections=sections;const s=sections.find(x=>x.id===+id);if(!s){state.kbSectionId=null;return renderKbHome()}const articles=await api('/api/knowledge/articles?section_id='+id);const children=sections.filter(x=>x.parent_id===+id);const parent=s.parent_id?sections.find(x=>x.id===s.parent_id):null;document.getElementById('app').innerHTML=`${kbHeader('base')}<div class="kb-breadcrumb"><button onclick="state.kbSectionId=null;renderKbHome()">База знаний</button><span>›</span>${parent?`<button onclick="openKbSection(${parent.id})">${esc(parent.name)}</button><span>›</span>`:''}<span>${esc(s.name)}</span></div><h2 style="margin-bottom:4px">${esc(s.icon||'▤')} ${esc(s.name)}</h2>${s.description?`<div class="small" style="margin-bottom:12px">${esc(s.description)}</div>`:''}${children.map(c=>`<div class="kb-section-card" onclick="openKbSection(${c.id})" style="cursor:pointer"><div class="row between"><div><b>${esc(c.name)}</b><div class="small">${c.article_count} статей</div></div><span>›</span></div></div>`).join('')}${articles.map(kbArticleCard).join('')||(!children.length?'<div class="notice">В этом разделе пока нет статей.</div>':'')}`}
async function openKbArticle(id,remember=true){if(remember){state.kbArticleId=+id;state.kbSectionId=null}const a=await api('/api/knowledge/articles/'+id);const path=a.section_path||[];document.getElementById('app').innerHTML=`${kbHeader(state.kbTab==='required'?'required':'base')}<div class="kb-breadcrumb"><button onclick="closeKbArticle()">← Назад</button>${path.map(x=>`<span>›</span><button onclick="state.kbArticleId=null;openKbSection(${x.id})">${esc(x.name)}</button>`).join('')}</div><div class="row between"><h2 style="margin:0;flex:1">${esc(a.title)}</h2>${kbCanEdit()?`<button class="btn secondary mini" onclick="openKbArticleEditor(${a.id})">Редактировать</button>`:''}</div><div class="kb-meta" style="margin:7px 0 14px"><span>Обновлено: ${new Date(a.updated_at).toLocaleDateString('ru-RU')}</span><span>◷ ${a.read_minutes} мин</span>${a.author_name?`<span>${esc(a.author_name)}</span>`:''}${a.store_name?`<span>🏪 ${esc(a.store_name)}</span>`:''}</div>${a.summary?`<div class="notice">${esc(a.summary)}</div>`:''}<article id="kbArticleBody" class="card kb-article">${a.content_html||'<p>Содержание пока не заполнено.</p>'}</article>${(a.tags||[]).length?`<div class="kb-meta">${a.tags.map(t=>`<span>#${esc(t)}</span>`).join('')}</div>`:''}${a.required_ack?`<div class="kb-ack ${a.acknowledged?'done':''}">${a.acknowledged?'<b class="kb-done">✓ Вы ознакомились с актуальной редакцией</b>':`<b>Материал обязателен к ознакомлению</b><div class="small" style="margin:5px 0 10px">Подтвердите после прочтения.</div><button class="btn" onclick="ackKbArticle(${a.id})">Я ознакомился</button>`}</div>`:''}${kbCanEdit()&&a.required_ack?`<button class="btn secondary" onclick="showKbAckControl(${a.id})">Контроль ознакомления</button>`:''}`;await hydrateKbMedia(a)}
function closeKbArticle(){state.kbArticleId=null;if(state.kbTab==='required')renderKbRequired();else if(state.kbSectionId)renderKbSection(state.kbSectionId);else renderKbHome()}
async function hydrateKbMedia(article){const body=document.getElementById('kbArticleBody');if(!body)return;const byId=Object.fromEntries((article.media||[]).map(m=>[String(m.id),m]));const nodes=[...body.querySelectorAll('[data-media-id]')];for(const n of nodes){const m=byId[String(n.dataset.mediaId)];if(!m){n.remove();continue}const slot=document.createElement('div');slot.className='kb-media-view';slot.innerHTML='<span class="small">Загрузка медиа…</span>';n.replaceWith(slot);try{const r=await fetch(m.content_url,{headers:{Authorization:'Bearer '+state.token}});if(!r.ok)throw new Error('HTTP '+r.status);const blob=await r.blob();const url=URL.createObjectURL(blob);slot.innerHTML=m.kind==='video'?`<video controls playsinline src="${url}"></video>${m.caption?`<div class="kb-caption">${esc(m.caption)}</div>`:''}`:`<img src="${url}" alt="">${m.caption?`<div class="kb-caption">${esc(m.caption)}</div>`:''}`}catch(e){slot.innerHTML='<span class="small">Не удалось загрузить медиа</span>'}}}
async function ackKbArticle(id){try{const r=await api(`/api/knowledge/articles/${id}/acknowledge`,{method:'POST',body:'{}'});flash((r.test_assignments||[]).length?'Ознакомление подтверждено · назначен тест':'Ознакомление подтверждено');await openKbArticle(id,false);if((r.test_assignments||[]).length)showSheet(`<h3>Материал изучен</h3><div class="notice success">После ознакомления вам назначен связанный тест.</div><button class="btn" onclick="closeWorkSheet();state.testTab='my';go('testing')">Перейти к тестированию</button>`)}catch(e){flash(e.message,'error')}}
async function renderKbRequired(){state.kbArticleId=null;const rows=await api('/api/knowledge/required');const pending=rows.filter(x=>x.pending),done=rows.filter(x=>!x.pending);document.getElementById('app').innerHTML=`${kbHeader('required')}<h3>Нужно ознакомиться ${pending.length?`<span class="badge-count">${pending.length}</span>`:''}</h3>${pending.map(a=>`<div class="kb-article-card kb-required-card" onclick="openKbArticle(${a.id})"><div class="row between"><div class="kb-title">${esc(a.title)}</div><span class="kb-pending">Нужно прочитать</span></div><div class="kb-meta">${a.section_path.map(x=>esc(x.name)).join(' / ')} · ${new Date(a.updated_at).toLocaleDateString('ru-RU')}</div></div>`).join('')||'<div class="notice success">Все обязательные материалы прочитаны.</div>'}<h3>Ознакомлены</h3>${done.map(a=>`<div class="kb-article-card" onclick="openKbArticle(${a.id})"><div class="row between"><div class="kb-title">${esc(a.title)}</div><span class="kb-done">✓</span></div></div>`).join('')||'<div class="small">Пока нет.</div>'}`}
async function showKbAckControl(articleId){const rows=await api('/api/knowledge/acknowledgements/control?article_id='+articleId);showSheet(`<h3>Контроль ознакомления</h3><div class="row"><span class="pill green">Ознакомились: ${rows.filter(x=>x.acknowledged).length}</span><span class="pill red">Ожидаются: ${rows.filter(x=>!x.acknowledged).length}</span></div>${rows.map(x=>`<div class="list-item row between"><div><b>${esc(x.full_name)}</b><div class="small">${esc(roleNames[x.position]||x.position)}${!x.has_account?' · нет Telegram-аккаунта':''}</div></div><span class="${x.acknowledged?'kb-done':'kb-pending'}">${x.acknowledged?'✓':'Ожидается'}</span></div>`).join('')}`)}
function kbManageTabs(){return `<div class="kb-manage-tabs"><button class="${state.kbManageTab==='sections'?'active':''}" onclick="setKbManageTab('sections')">Разделы</button><button class="${state.kbManageTab==='articles'?'active':''}" onclick="setKbManageTab('articles')">Статьи</button><button class="${state.kbManageTab==='import'?'active':''}" onclick="setKbManageTab('import')">Импорт</button><button class="${state.kbManageTab==='ack'?'active':''}" onclick="setKbManageTab('ack')">Ознакомление</button></div>`}
async function setKbManageTab(tab){state.kbManageTab=tab;await renderKbManage()}
async function renderKbManage(){if(!kbCanEdit())return setKbTab('base');const sections=await api('/api/knowledge/sections?manage=true');state.kbManageSections=sections;document.getElementById('app').innerHTML=`${kbHeader('manage')}${kbManageTabs()}<div id="kbManageBody"></div>`;if(state.kbManageTab==='articles')return renderKbManageArticles();if(state.kbManageTab==='import')return renderKbImport();if(state.kbManageTab==='ack')return renderKbAckManage();return renderKbManageSections()}
function renderKbManageSections(){const tree=kbSectionTree(state.kbManageSections);document.getElementById('kbManageBody').innerHTML=`<div class="row between"><div class="small">Доступ настраивается на уровне раздела и подраздела.</div><button class="btn mini" onclick="openKbSectionEditor(null,null)">+ Раздел</button></div><div class="card">${tree.map(t=>`<div class="kb-tree-row"><span>${esc(t.icon||'▤')}</span><div class="grow"><b>${esc(t.name)}</b><div class="small">${t.active?'Активен':'Отключён'} · ${t.role_access.length?t.role_access.map(r=>roleNames[r]||r).join(', '):'Все роли'}</div></div><button class="icon-btn" onclick="openKbSectionEditor(${t.id},null)">✎</button><button class="icon-btn" onclick="openKbSectionEditor(null,${t.id})">＋</button></div>${t.children.map(c=>`<div class="kb-tree-row sub"><span>↳</span><div class="grow"><b>${esc(c.name)}</b><div class="small">${c.active?'Активен':'Отключён'} · ${c.role_access.length?c.role_access.map(r=>roleNames[r]||r).join(', '):'Все роли'}</div></div><button class="icon-btn" onclick="openKbSectionEditor(${c.id},${t.id})">✎</button></div>`).join('')}`).join('')}</div>`}
function kbRoleChecks(selected=[]){const set=new Set(selected||[]);return `<div class="kb-role-grid">${Object.entries(roleNames).map(([k,v])=>`<label><input type="checkbox" data-kb-role value="${k}" ${set.has(k)?'checked':''}> ${esc(v)}</label>`).join('')}</div><div class="small" style="margin-top:5px">Если снять все галочки — раздел будет доступен всем ролям.</div>`}
async function openKbSectionEditor(id,parentId){const s=id?state.kbManageSections.find(x=>x.id===id):null;const parents=state.kbManageSections.filter(x=>!x.parent_id);showSheet(`<h3>${s?'Редактировать':'Новый'} ${parentId?'подраздел':'раздел'}</h3>${field('Название',`<input id="kbSecName" value="${esc(s?.name||'')}">`)}${field('Описание',`<textarea id="kbSecDesc">${esc(s?.description||'')}</textarea>`)}${field('Иконка',`<input id="kbSecIcon" value="${esc(s?.icon||'')}" placeholder="Например: 📘">`)}${parentId||s?.parent_id?`<div class="notice">Родительский раздел: <b>${esc(parents.find(x=>x.id===(parentId||s.parent_id))?.name||'')}</b></div>`:''}<h3>Кто может видеть</h3>${kbRoleChecks(s?.role_access||[])}<div class="grid">${field('Порядок',`<input id="kbSecOrder" type="number" value="${s?.sort_order??0}">`)}${field('Статус',`<select id="kbSecActive"><option value="1" ${s?.active!==false?'selected':''}>Активен</option><option value="0" ${s?.active===false?'selected':''}>Отключён</option></select>`)}</div><button class="btn" onclick="saveKbSection(${id||'null'},${parentId||s?.parent_id||'null'})">Сохранить</button>${s?`<button class="btn danger" style="margin-left:6px" onclick="deleteKbSection(${s.id})">Удалить / отключить</button>`:''}`)}
async function saveKbSection(id,parentId){const body={parent_id:parentId||null,name:kbSecName.value.trim(),description:kbSecDesc.value.trim()||null,icon:kbSecIcon.value.trim()||null,role_access:[...document.querySelectorAll('[data-kb-role]:checked')].map(x=>x.value),sort_order:+kbSecOrder.value||0,active:kbSecActive.value==='1'};try{if(id)await api('/api/knowledge/sections/'+id,{method:'PATCH',body:JSON.stringify(body)});else await api('/api/knowledge/sections',{method:'POST',body:JSON.stringify(body)});closeWorkSheet();flash('Раздел сохранён');await renderKbManage()}catch(e){flash(e.message,'error')}}
async function deleteKbSection(id){if(!confirm('Удалить раздел? Если он уже используется, Core просто отключит его.'))return;try{await api('/api/knowledge/sections/'+id,{method:'DELETE'});closeWorkSheet();flash('Готово');await renderKbManage()}catch(e){flash(e.message,'error')}}
async function renderKbManageArticles(){const rows=await api('/api/knowledge/articles');document.getElementById('kbManageBody').innerHTML=`<div class="row between"><span class="small">Все статьи, включая черновики и архив.</span><button class="btn mini" onclick="openKbArticleEditor(null)">+ Статья</button></div>${rows.map(a=>`<div class="kb-article-card" onclick="openKbArticleEditor(${a.id})"><div class="row between"><div class="kb-title">${esc(a.title)}</div><span class="kb-status ${a.status}">${esc(kbStatusLabel(a.status))}</span></div><div class="kb-meta">${a.section_path.map(x=>esc(x.name)).join(' / ')} · ${new Date(a.updated_at).toLocaleDateString('ru-RU')}</div></div>`).join('')||'<div class="notice">Статей пока нет.</div>'}`}
function kbSectionOptions(selected){return state.kbManageSections.filter(x=>x.active).map(x=>{const parent=x.parent_id?state.kbManageSections.find(p=>p.id===x.parent_id):null;return `<option value="${x.id}" ${+selected===x.id?'selected':''}>${parent?esc(parent.name)+' → ':''}${esc(x.name)}</option>`}).join('')}
function kbPositionChecks(selected=[]){const set=new Set(selected||[]);return `<div class="kb-role-grid">${Object.entries(roleNames).map(([k,v])=>`<label><input type="checkbox" data-kb-pos value="${k}" ${set.has(k)?'checked':''}> ${esc(v)}</label>`).join('')}</div>`}
function kbModuleChecks(links=[]){const set=new Set((links||[]).map(x=>x.module_key));const mods={orders:'Заявки',work_schedule:'График',shifts:'Пересменки',tasks:'Задачи',inspections:'Проверки',employees:'Сотрудники'};return `<div class="kb-role-grid">${Object.entries(mods).map(([k,v])=>`<label><input type="checkbox" data-kb-module value="${k}" ${set.has(k)?'checked':''}> ${v}</label>`).join('')}</div>`}
async function openKbArticleEditor(id){if(!kbCanEdit())return;const a=id?await api('/api/knowledge/articles/'+id):null;state.kbEditingArticle=a;const stores=await api('/api/reference/stores');document.getElementById('app').innerHTML=`${kbHeader('manage')}<button class="btn secondary mini" onclick="state.kbEditingArticle=null;state.kbArticleId=null;state.kbManageTab='articles';renderKbManage()">← К статьям</button><h2>${a?'Редактирование статьи':'Новая статья'}</h2>${field('Название',`<input id="kbArtTitle" value="${esc(a?.title||'')}">`)}${field('Раздел / подраздел',`<select id="kbArtSection">${kbSectionOptions(a?.section_id)}</select>`)}<div class="grid">${field('Статус',`<select id="kbArtStatus"><option value="draft" ${a?.status!=='published'&&a?.status!=='archived'?'selected':''}>Черновик</option><option value="published" ${a?.status==='published'?'selected':''}>Опубликовано</option><option value="archived" ${a?.status==='archived'?'selected':''}>Архив</option></select>`)}${field('Магазин (необязательно)',`<select id="kbArtStore"><option value="">Не привязан</option>${stores.map(x=>`<option value="${x.id}" ${+a?.store_id===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select>`)}</div>${field('Краткое описание',`<textarea id="kbArtSummary">${esc(a?.summary||'')}</textarea>`)}<div class="kb-editor-toolbar"><button onclick="kbCmd('bold')"><b>B</b></button><button onclick="kbCmd('italic')"><i>I</i></button><button onclick="kbCmd('underline')"><u>U</u></button><button onclick="kbBlock('h2')">H2</button><button onclick="kbBlock('h3')">H3</button><button onclick="kbCmd('insertUnorderedList')">•≡</button><button onclick="kbCmd('insertOrderedList')">1≡</button><button onclick="kbLink()">🔗</button><button onclick="kbTable()">▦</button><button onclick="requestKbMedia('photo')">📷</button><button onclick="requestKbMedia('video')">▶</button></div><div id="kbEditor" class="kb-rich-editor" contenteditable="true">${a?.content_html||'<p>Начните писать статью…</p>'}</div>${field('Теги через запятую',`<input id="kbArtTags" value="${esc((a?.tags||[]).join(', '))}" placeholder="касса, открытие, регламент">`)}<h3>Связанные должности</h3>${kbPositionChecks(a?.position_tags||[])}<h3>Показывать в других блоках Core</h3>${kbModuleChecks(a?.links||[])}<label class="row" style="margin:12px 0"><input id="kbArtAck" type="checkbox" style="width:auto" ${a?.required_ack?'checked':''}> Обязательное ознакомление сотрудников</label>${a?`<h3>Медиа статьи</h3><div class="row" style="margin-bottom:8px"><button class="btn secondary mini" onclick="requestKbMedia('photo')">+ Фото из Telegram</button><button class="btn secondary mini" onclick="requestKbMedia('video')">+ Видео из Telegram</button></div><div class="kb-media-shelf">${(a.media||[]).map(m=>`<div class="kb-media-card"><div class="thumb">${m.kind==='photo'?`<span data-kb-thumb="${m.id}">📷</span>`:'▶ Видео'}</div><div class="small">${esc(m.caption||m.file_name||'Без подписи')}</div><button class="btn secondary mini" onclick="insertKbMedia(${m.id},'${m.kind}')">Вставить</button><button class="icon-btn" onclick="editKbMediaCaption(${m.id},'${esc((m.caption||'').replace(/'/g,"&#39;"))}')">✎</button><button class="icon-btn" onclick="deleteKbMedia(${m.id})">🗑</button></div>`).join('')||'<div class="small">Фото и видео пока не добавлены.</div>'}</div>`:'<div class="notice">Сначала сохраните черновик — после этого можно будет добавлять фото и видео через Telegram.</div>'}<div class="row" style="margin-top:16px"><button class="btn" onclick="saveKbArticle()">Сохранить</button>${a?`<button class="btn danger" onclick="archiveKbArticle(${a.id})">В архив</button>`:''}</div>`;if(a)hydrateKbEditorThumbs(a)}
function kbCmd(cmd,value=null){document.getElementById('kbEditor')?.focus();document.execCommand(cmd,false,value)}
function kbBlock(tag){kbCmd('formatBlock',tag)}
function kbLink(){const u=prompt('Ссылка');if(u)kbCmd('createLink',u)}
function kbTable(){const rows=Math.min(10,Math.max(1,+prompt('Строк:',2)||2)),cols=Math.min(8,Math.max(1,+prompt('Столбцов:',2)||2));let h='<table><tbody>';for(let r=0;r<rows;r++){h+='<tr>';for(let c=0;c<cols;c++)h+='<td>Текст</td>';h+='</tr>'}h+='</tbody></table><p><br></p>';document.getElementById('kbEditor').focus();document.execCommand('insertHTML',false,h)}
async function saveKbArticle(){const a=state.kbEditingArticle;const payload={section_id:+kbArtSection.value,title:kbArtTitle.value.trim(),summary:kbArtSummary.value.trim()||null,content_html:kbEditor.innerHTML,status:kbArtStatus.value,tags:kbArtTags.value.split(',').map(x=>x.trim()).filter(Boolean),store_id:kbArtStore.value?+kbArtStore.value:null,position_tags:[...document.querySelectorAll('[data-kb-pos]:checked')].map(x=>x.value),required_ack:kbArtAck.checked,links:[...document.querySelectorAll('[data-kb-module]:checked')].map(x=>({module_key:x.value,entity_id:null,label:null}))};try{const saved=a?await api('/api/knowledge/articles/'+a.id,{method:'PATCH',body:JSON.stringify(payload)}):await api('/api/knowledge/articles',{method:'POST',body:JSON.stringify(payload)});state.kbEditingArticle=saved;flash('Статья сохранена');await openKbArticleEditor(saved.id)}catch(e){flash(e.message,'error')}}
async function archiveKbArticle(id){if(!confirm('Переместить статью в архив?'))return;await api('/api/knowledge/articles/'+id,{method:'DELETE'});flash('Статья в архиве');state.kbEditingArticle=null;state.kbManageTab='articles';await renderKbManage()}
async function requestKbMedia(kind){const a=state.kbEditingArticle;if(!a?.id)return flash('Сначала сохраните статью','error');try{await api(`/api/knowledge/articles/${a.id}/media-request`,{method:'POST',body:JSON.stringify({kind})});sessionStorage.setItem('kb_last_article',String(a.id));flash(kind==='photo'?'Отправьте фото в чат с ботом':'Отправьте видео в чат с ботом');setTimeout(()=>tg?.close?.(),500)}catch(e){flash(e.message,'error')}}
function insertKbMedia(id,kind){const ed=document.getElementById('kbEditor');if(!ed)return;ed.focus();const token=`<span data-media-id="${id}" contenteditable="false">${kind==='video'?'▶ Видео':'📷 Фото'} #${id}</span><p><br></p>`;try{document.execCommand('insertHTML',false,token)}catch{ed.insertAdjacentHTML('beforeend',token)}}
async function editKbMediaCaption(id,current){const cap=prompt('Подпись к медиа',current||'');if(cap===null)return;await api('/api/knowledge/media/'+id,{method:'PATCH',body:JSON.stringify({caption:cap})});await openKbArticleEditor(state.kbEditingArticle.id)}
async function deleteKbMedia(id){if(!confirm('Удалить медиа из статьи?'))return;await api('/api/knowledge/media/'+id,{method:'DELETE'});await openKbArticleEditor(state.kbEditingArticle.id)}
async function hydrateKbEditorThumbs(a){for(const m of a.media||[]){if(m.kind!=='photo')continue;const slot=document.querySelector(`[data-kb-thumb="${m.id}"]`);if(!slot)continue;try{const r=await fetch(m.content_url,{headers:{Authorization:'Bearer '+state.token}});const b=await r.blob();slot.parentElement.innerHTML=`<img src="${URL.createObjectURL(b)}" alt="">`}catch{}}}
async function renderKbImport(){document.getElementById('kbManageBody').innerHTML=`<div class="card"><h3>Импорт статьи из файла</h3><div class="kb-import-zone"><div style="font-size:30px">☁</div><b>DOCX, PDF, TXT или XLSX</b><div class="small">До 20 МБ. После импорта получится обычная редактируемая статья-черновик.</div><input id="kbImportFile" type="file" accept=".docx,.pdf,.txt,.xlsx" style="margin-top:12px"></div>${field('Название статьи (можно оставить пустым)', '<input id="kbImportTitle" placeholder="Возьмём имя файла">')}${field('Раздел / подраздел',`<select id="kbImportSection">${kbSectionOptions(null)}</select>`)}<button class="btn" onclick="submitKbImport()">Импортировать</button></div><div class="notice">PDF должен содержать извлекаемый текст. Сканированные PDF без текстового слоя пока не распознаются автоматически.</div>`}
async function submitKbImport(){const file=kbImportFile.files[0];if(!file)return flash('Выберите файл','error');const fd=new FormData();fd.append('section_id',kbImportSection.value);fd.append('title',kbImportTitle.value);fd.append('file',file);try{const a=await uploadApi('/api/knowledge/import',fd);flash('Файл преобразован в статью');await openKbArticleEditor(a.id)}catch(e){flash(e.message,'error')}}
async function renderKbAckManage(){const rows=await api('/api/knowledge/articles');const req=rows.filter(x=>x.required_ack&&x.status==='published');document.getElementById('kbManageBody').innerHTML=`<div class="small">Контроль обязательных материалов по текущей редакции статьи.</div>${req.map(a=>`<div class="kb-article-card"><div class="row between"><div><div class="kb-title">${esc(a.title)}</div><div class="kb-meta">${a.section_path.map(x=>esc(x.name)).join(' / ')}</div></div><button class="btn secondary mini" onclick="showKbAckControl(${a.id})">Кто прочитал</button></div></div>`).join('')||'<div class="notice">Нет опубликованных статей с обязательным ознакомлением.</div>'}`}

async function showRelatedKnowledge(moduleKey){try{const rows=await api('/api/knowledge/related?module_key='+encodeURIComponent(moduleKey));showSheet(`<h3>Связанные инструкции</h3>${rows.map(a=>`<div class="kb-article-card" onclick="closeWorkSheet();go('knowledge').then(()=>openKbArticle(${a.id}))"><div class="kb-title">${esc(a.link_label||a.title)}</div><div class="small">${esc(a.title)}</div></div>`).join('')||'<div class="notice">Для этого раздела пока нет связанных инструкций.</div>'}`)}catch(e){flash(e.message,'error')}}



// --- Testing ---------------------------------------------------------------
function testCanEdit(){return testEditors.has(state.user?.role)}
function testStatusLabel(s){return {assigned:'Назначен',in_progress:'В процессе',passed:'Сдан',failed:'Не сдан',overdue:'Просрочен',draft:'Черновик',published:'Опубликован',archived:'Архив',active:'В процессе',submitted:'Завершён',timeout:'Время истекло'}[s]||s}
function testTabs(active){return `<div class="test-tabs"><button class="${active==='my'?'active':''}" onclick="setTestTab('my')">Мои тесты</button><button class="${active==='catalog'?'active':''}" onclick="setTestTab('catalog')">Каталог</button>${testCanEdit()?`<button class="${active==='control'?'active':''}" onclick="setTestTab('control')">Контроль</button><button class="${active==='editor'?'active':''}" onclick="setTestTab('editor')">Редактор</button>`:''}</div>`}
function testHeader(active){return `<div class="section-title"><h2 style="margin:0">Тестирование</h2>${testCanEdit()?'<span class="pill green">Управление</span>':''}</div>${testTabs(active)}`}
function setTestLockUI(active){const nav=document.getElementById('nav'),wrap=document.querySelector('.wrap');nav?.classList.toggle('testing-locked',!!active);wrap?.classList.toggle('testing-locked',!!active);try{if(active){tg?.enableClosingConfirmation?.();tg?.disableVerticalSwipes?.()}else{tg?.disableClosingConfirmation?.();tg?.enableVerticalSwipes?.()}}catch{}}
async function refreshTestLock(){try{const a=await api('/api/testing/active-attempt');state.testActiveAttempt=a||null;setTestLockUI(!!a);return a}catch{return null}}
async function renderTesting(){const active=state.testActiveAttempt||await refreshTestLock();if(active)return renderActiveTestAttempt(active);if(state.testTab==='catalog')return renderTestCatalog();if(state.testTab==='control'&&testCanEdit())return renderTestControl();if(state.testTab==='editor'&&testCanEdit())return renderTestEditorList();return renderTestMy()}
async function setTestTab(tab){if(state.testActiveAttempt)return;state.testTab=tab;state.testEditing=null;state.testQuestionEditing=null;await renderTesting()}
function testAssignmentCard(a){const due=a.due_at?new Date(a.due_at).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'без срока';return `<div class="test-card" onclick="openTestAssignment(${a.id},${a.test_id})"><div class="row between"><div class="title">${esc(a.test_title)}</div><span class="test-badge ${a.status}">${esc(testStatusLabel(a.status))}</span></div><div class="small" style="margin-top:6px">Срок: ${due} · попыток ${a.attempts_used}/${a.attempts_allowed}</div>${a.last_score!=null?`<div class="small">Последний результат: <b>${Math.round(a.last_score)}%</b></div>`:''}</div>`}
async function renderTestMy(){const rows=await api('/api/testing/my');const order={in_progress:0,assigned:1,failed:2,overdue:3,passed:4};rows.sort((a,b)=>(order[a.status]??9)-(order[b.status]??9));document.getElementById('app').innerHTML=`${testHeader('my')}${rows.length?rows.map(testAssignmentCard).join(''):'<div class="test-empty">Назначенных тестов пока нет.</div>'}`}
async function openTestAssignment(assignmentId,testId){const [my,test]=await Promise.all([api('/api/testing/my'),api('/api/testing/tests/'+testId)]);const a=my.find(x=>x.id===+assignmentId);if(!a)return flash('Назначение не найдено','error');const canStart=['assigned','failed'].includes(a.status)&&a.attempts_used<a.attempts_allowed&&(!a.due_at||new Date(a.due_at)>new Date())&&(a.attempts_used===0||a.retry_unlocked);const attempts=await api(`/api/testing/assignments/${assignmentId}/attempts`);document.getElementById('app').innerHTML=`${testHeader('my')}<button class="btn secondary mini" onclick="renderTestMy()">← К тестам</button><div class="card" style="text-align:center"><div style="font-size:38px">🎓</div><h2>${esc(test.title)}</h2>${test.description?`<div class="muted">${esc(test.description)}</div>`:''}<div class="grid" style="margin-top:14px"><div class="metric"><span class="small">Проходной балл</span><b>${test.pass_percent}%</b></div><div class="metric"><span class="small">Время</span><b>${test.time_limit_minutes} мин</b></div><div class="metric"><span class="small">Попытки</span><b>${a.attempts_used}/${a.attempts_allowed}</b></div><div class="metric"><span class="small">Вопросов</span><b>${test.questions_to_draw||test.question_count}</b></div></div>${test.linked_article_id?`<button class="btn secondary" style="margin-top:12px" onclick="go('knowledge').then(()=>openKbArticle(${test.linked_article_id}))">Открыть связанную статью</button>`:''}<div class="notice" style="margin-top:12px"><b>Важно:</b> после запуска тест нельзя покинуть до завершения или окончания таймера. Ответы сохраняются автоматически.</div>${canStart?`<button class="btn" style="width:100%;margin-top:10px" onclick="startTestAssignment(${a.id})">Начать тест</button>`:`<div class="notice ${a.status==='passed'?'success':''}" style="margin-top:10px">${a.status==='passed'?'Тест уже сдан.':a.status==='overdue'?'Срок прохождения истёк.':a.attempts_used>=a.attempts_allowed?'Лимит попыток исчерпан.':a.attempts_used>0&&!a.retry_unlocked?'Повторная попытка доступна после разрешения руководителя.':'Тест сейчас недоступен.'}</div>`}</div><h3>Все попытки</h3>${attempts.map(x=>`<div class="test-attempt-history"><div class="row between"><b>Попытка ${x.attempt_no}</b><span class="test-badge ${x.passed?'passed':'failed'}">${x.passed?'Сдан':'Не сдан'}</span></div><div class="small">${x.completed_at?new Date(x.completed_at).toLocaleString('ru-RU'):'В процессе'}${x.score_percent!=null?' · '+Math.round(x.score_percent)+'%':''}</div></div>`).join('')||'<div class="small">Попыток пока нет.</div>'}`}
async function startTestAssignment(id){if(!confirm('После запуска тест нельзя будет перейти в другие разделы до завершения или окончания времени. Начать?'))return;try{const a=await api(`/api/testing/assignments/${id}/start`,{method:'POST',body:'{}'});state.testActiveAttempt=a;state.testQuestionIndex=0;setTestLockUI(true);await renderActiveTestAttempt(a)}catch(e){flash(e.message,'error')}}
function formatTestTime(sec){sec=Math.max(0,sec|0);return `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`}
function queueTestTextSave(qid){clearTimeout(state.testTextSaveTimer);state.testTextSaveTimer=setTimeout(()=>saveActiveTestAnswer(qid),500)}
function startTestTimer(){clearInterval(state.testTimer);state.testTimer=setInterval(async()=>{if(!state.testActiveAttempt){clearInterval(state.testTimer);return}const left=Math.max(0,Math.floor((new Date(state.testActiveAttempt.expires_at)-new Date())/1000));const el=document.getElementById('testTimer');if(el)el.textContent=formatTestTime(left);if(left<=0){clearInterval(state.testTimer);await submitActiveTest(true)}},1000)}
async function protectedImage(url,img){try{const r=await fetch(url,{headers:{Authorization:'Bearer '+state.token}});if(!r.ok)throw 0;const b=await r.blob();img.src=URL.createObjectURL(b)}catch{img.replaceWith(document.createTextNode('Фото недоступно'))}}
function hydrateTestImages(){document.querySelectorAll('img[data-test-q-image]').forEach(img=>protectedImage(`/api/testing/questions/${img.dataset.testQImage}/image`,img))}
async function renderActiveTestAttempt(a=state.testActiveAttempt){if(!a)return renderTestMy();state.testActiveAttempt=a;setTestLockUI(true);const qs=a.questions||[];if(!qs.length)return document.getElementById('app').innerHTML='<div class="notice error">В попытке нет вопросов.</div>';state.testQuestionIndex=Math.max(0,Math.min(state.testQuestionIndex||0,qs.length-1));const i=state.testQuestionIndex,q=qs[i],ans=q.answer||{selected_option_ids:[],text_answer:''};const selected=new Set((ans.selected_option_ids||[]).map(Number));const answerHtml=q.question_type==='text'?`<textarea id="testTextAnswer" class="test-answer-text" placeholder="Введите ответ" oninput="queueTestTextSave(${q.id})" onblur="saveActiveTestAnswer(${q.id})">${esc(ans.text_answer||'')}</textarea>`:q.options.map(o=>`<label class="test-option ${selected.has(o.id)?'selected':''}"><input type="${q.question_type==='single'?'radio':'checkbox'}" name="testOpt" value="${o.id}" ${selected.has(o.id)?'checked':''} onchange="saveActiveTestAnswer(${q.id})"><span>${esc(o.text)}</span></label>`).join('');document.getElementById('app').innerHTML=`<div class="test-locked-banner">🔒 Тест начат. Остальные разделы Core будут доступны после завершения попытки.</div><div class="row between"><b>${i+1} / ${qs.length}</b><span id="testTimer" class="test-timer">${formatTestTime(a.remaining_seconds||0)}</span></div><div class="test-progress"><span style="width:${((i+1)/qs.length*100).toFixed(1)}%"></span></div><div class="test-question"><h2>${esc(q.text)}</h2>${q.has_image?`<img class="test-image" data-test-q-image="${q.id}" alt="Изображение к вопросу">`:''}<div class="small" style="margin-bottom:9px">${q.question_type==='single'?'Выберите один правильный ответ':q.question_type==='multiple'?'Выберите все правильные ответы':'Введите ответ'}</div>${answerHtml}</div><div class="row between"><button class="btn secondary" ${i===0?'disabled':''} onclick="testQuestionMove(-1)">Назад</button>${i<qs.length-1?`<button class="btn" onclick="testQuestionMove(1)">Далее</button>`:`<button class="btn ok" onclick="submitActiveTest(false)">Завершить тест</button>`}</div>`;hydrateTestImages();startTestTimer()}
async function saveActiveTestAnswer(qid){if(!state.testActiveAttempt)return;const q=state.testActiveAttempt.questions.find(x=>x.id===qid);if(!q)return;let body={selected_option_ids:[],text_answer:null};if(q.question_type==='text'){body.text_answer=document.getElementById('testTextAnswer')?.value||'';q.answer.text_answer=body.text_answer}else{body.selected_option_ids=[...document.querySelectorAll('input[name="testOpt"]:checked')].map(x=>+x.value);q.answer.selected_option_ids=body.selected_option_ids;document.querySelectorAll('.test-option').forEach(x=>x.classList.toggle('selected',!!x.querySelector('input:checked')))}try{await api(`/api/testing/attempts/${state.testActiveAttempt.id}/answers/${qid}`,{method:'PUT',body:JSON.stringify(body)})}catch(e){if(/истекло/i.test(e.message)){await refreshTestLock();if(!state.testActiveAttempt)return renderTestMy()}else flash('Не удалось сохранить ответ: '+e.message,'error')}}
async function testQuestionMove(delta){const q=state.testActiveAttempt?.questions?.[state.testQuestionIndex];if(q)await saveActiveTestAnswer(q.id);state.testQuestionIndex+=delta;await renderActiveTestAttempt()}
async function submitActiveTest(auto=false){if(!state.testActiveAttempt)return;if(!auto&&!confirm('Завершить тест? После отправки изменить ответы будет нельзя.'))return;const attemptId=state.testActiveAttempt.id;const q=state.testActiveAttempt.questions?.[state.testQuestionIndex];if(q&&state.testActiveAttempt.status==='active'){try{await saveActiveTestAnswer(q.id)}catch{}}try{const r=await api(`/api/testing/attempts/${attemptId}/submit`,{method:'POST',body:'{}'});clearInterval(state.testTimer);state.testActiveAttempt=null;setTestLockUI(false);renderNav();document.getElementById('app').innerHTML=`<div class="card" style="text-align:center;margin-top:30px"><div class="test-result-mark ${r.passed?'':'fail'}">${r.passed?'✓':'×'}</div><h2>${r.passed?'Тест сдан!':auto?'Время закончилось':'Тест не сдан'}</h2><div class="score">${Math.round(r.score_percent||0)}%</div><div class="small">Проходной балл: ${r.pass_percent}% · попытка ${r.attempt_no}</div><div class="notice" style="margin-top:14px">Правильные ответы после прохождения не показываются.</div><button class="btn" onclick="state.testTab='my';go('testing')">Вернуться к тестам</button></div>`}catch(e){flash(e.message,'error')}}
async function renderTestCatalog(){const rows=await api('/api/testing/catalog');document.getElementById('app').innerHTML=`${testHeader('catalog')}${rows.map(t=>`<div class="test-card"><div class="row between"><div class="title">${esc(t.title)}</div><span class="test-badge published">Опубликован</span></div>${t.description?`<div class="small" style="margin:6px 0">${esc(t.description)}</div>`:''}<div class="small">${t.question_count} вопросов · ${t.time_limit_minutes} мин · проходной ${t.pass_percent}%</div>${t.assignment_id?`<button class="btn secondary mini" style="margin-top:8px" onclick="openTestAssignment(${t.assignment_id},${t.id})">Открыть назначение</button>`:'<div class="small" style="margin-top:8px">Этот тест вам не назначен.</div>'}</div>`).join('')||'<div class="test-empty">Опубликованных тестов пока нет.</div>'}`}
async function getTestMeta(){if(!state.testMeta)state.testMeta=await api('/api/testing/meta');return state.testMeta}
async function renderTestControl(){const [meta,tests]=await Promise.all([getTestMeta(),api('/api/testing/tests')]);const f=state.testControlFilters,q=new URLSearchParams();Object.entries(f).forEach(([k,v])=>{if(v)q.set(k,v)});const rows=await api('/api/testing/control?'+q.toString());const counts={assigned:0,in_progress:0,passed:0,failed:0,overdue:0};rows.forEach(x=>counts[x.status]=(counts[x.status]||0)+1);document.getElementById('app').innerHTML=`${testHeader('control')}<div class="test-stat-grid"><div class="test-stat"><b>${rows.length}</b><span>Назначений</span></div><div class="test-stat"><b>${counts.passed||0}</b><span>Сдали</span></div><div class="test-stat"><b>${counts.failed||0}</b><span>Не сдали</span></div><div class="test-stat"><b>${counts.overdue||0}</b><span>Просрочено</span></div></div><button class="filter-btn compact" onclick="openTestControlFilters()">⚙ Фильтр</button><div id="testControlFilters" class="card hidden">${field('Тест',`<select id="tcfTest"><option value="">Все</option>${tests.map(x=>`<option value="${x.id}" ${String(f.test_id)===String(x.id)?'selected':''}>${esc(x.title)}</option>`).join('')}</select>`)}${field('Статус',`<select id="tcfStatus"><option value="">Все</option>${['assigned','in_progress','passed','failed','overdue'].map(x=>`<option value="${x}" ${f.status===x?'selected':''}>${testStatusLabel(x)}</option>`).join('')}</select>`)}${field('Сотрудник',`<select id="tcfEmployee"><option value="">Все</option>${meta.employees.map(x=>`<option value="${x.id}" ${String(f.employee_id)===String(x.id)?'selected':''}>${esc(x.full_name)}</option>`).join('')}</select>`)}${field('Магазин',`<select id="tcfStore"><option value="">Все</option>${meta.stores.map(x=>`<option value="${x.id}" ${String(f.store_id)===String(x.id)?'selected':''}>${esc(x.name)}</option>`).join('')}</select>`)}${field('Роль',`<select id="tcfRole"><option value="">Все</option>${meta.roles.map(x=>`<option value="${x}" ${f.role===x?'selected':''}>${esc(roleNames[x]||x)}</option>`).join('')}</select>`)}<button class="btn" onclick="applyTestControlFilters()">Применить</button></div>${rows.map(a=>`<div class="test-card"><div class="row between"><div><div class="title">${esc(a.test_title)}</div><div class="small">${esc(a.employee_name)} · ${esc(roleNames[a.employee_position]||a.employee_position||'')}</div></div><span class="test-badge ${a.status}">${esc(testStatusLabel(a.status))}</span></div><div class="small" style="margin-top:7px">Попыток ${a.attempts_used}/${a.attempts_allowed}${a.last_score!=null?' · '+Math.round(a.last_score)+'%':''}${a.due_at?' · до '+new Date(a.due_at).toLocaleString('ru-RU'):''}</div><div class="row" style="margin-top:8px"><button class="btn secondary mini" onclick="showTestAttempts(${a.id},'${esc(a.employee_name)}')">Попытки</button>${['failed'].includes(a.status)&&a.attempts_used<a.attempts_allowed&&!a.retry_unlocked?`<button class="btn mini" onclick="allowTestRetry(${a.id})">Разрешить повтор</button>`:''}</div></div>`).join('')||'<div class="test-empty">По фильтру ничего нет.</div>'}`}
function openTestControlFilters(){document.getElementById('testControlFilters')?.classList.toggle('hidden')}
async function applyTestControlFilters(){state.testControlFilters={test_id:tcfTest.value,status:tcfStatus.value,employee_id:tcfEmployee.value,store_id:tcfStore.value,role:tcfRole.value};await renderTestControl()}
async function allowTestRetry(id){try{await api(`/api/testing/assignments/${id}/allow-retry`,{method:'POST',body:'{}'});flash('Повторная попытка разрешена');await renderTestControl()}catch(e){flash(e.message,'error')}}
async function showTestAttempts(id,name){const rows=await api(`/api/testing/assignments/${id}/attempts`);showSheet(`<h3>Попытки · ${esc(name)}</h3>${rows.map(x=>`<div class="test-attempt-history"><div class="row between"><b>Попытка ${x.attempt_no}</b><span class="test-badge ${x.passed?'passed':'failed'}">${x.passed?'Сдан':'Не сдан'}</span></div><div class="small">${x.completed_at?new Date(x.completed_at).toLocaleString('ru-RU'):'В процессе'}${x.score_percent!=null?' · '+Math.round(x.score_percent)+'%':''}</div></div>`).join('')||'<div class="notice">Попыток нет.</div>'}`)}
async function renderTestEditorList(){const rows=await api('/api/testing/tests');document.getElementById('app').innerHTML=`${testHeader('editor')}<div class="row between"><div class="small">Создание тестов и банка вопросов</div><button class="btn mini" onclick="openTestEditor(null)">+ Тест</button></div>${rows.map(t=>`<div class="test-card" onclick="openTestEditor(${t.id})"><div class="row between"><div class="title">${esc(t.title)}</div><span class="test-badge ${t.status}">${testStatusLabel(t.status)}</span></div><div class="small" style="margin-top:6px">${t.question_count} вопросов · выбор ${t.questions_to_draw||'все'} · ${t.time_limit_minutes} мин · ${t.attempts_allowed} попыт.</div>${t.linked_article_title?`<div class="small">Статья: ${esc(t.linked_article_title)}</div>`:''}</div>`).join('')||'<div class="test-empty">Создайте первый тест.</div>'}`}
async function openTestEditor(id){const meta=await getTestMeta();const t=id?await api('/api/testing/tests/'+id):null;state.testEditing=t;document.getElementById('app').innerHTML=`${testHeader('editor')}<button class="btn secondary mini" onclick="state.testEditing=null;renderTestEditorList()">← К тестам</button><h2>${t?'Редактирование теста':'Новый тест'}</h2>${field('Название',`<input id="teTitle" value="${esc(t?.title||'')}">`)}${field('Описание',`<textarea id="teDesc">${esc(t?.description||'')}</textarea>`)}<div class="grid">${field('Статус',`<select id="teStatus"><option value="draft" ${t?.status!=='published'&&t?.status!=='archived'?'selected':''}>Черновик</option><option value="published" ${t?.status==='published'?'selected':''}>Опубликован</option><option value="archived" ${t?.status==='archived'?'selected':''}>Архив</option></select>`)}${field('Проходной балл, %',`<input id="tePass" type="number" min="1" max="100" value="${t?.pass_percent??80}">`)}${field('Таймер, минут',`<input id="teTime" type="number" min="1" max="300" value="${t?.time_limit_minutes??20}">`)}${field('Количество попыток',`<input id="teAttempts" type="number" min="1" max="20" value="${t?.attempts_allowed??1}">`)}${field('Вопросов из банка',`<input id="teDraw" type="number" min="1" placeholder="Все" value="${t?.questions_to_draw??''}">`)}${field('Связанная статья',`<select id="teArticle"><option value="">Самостоятельный тест</option>${meta.articles.map(a=>`<option value="${a.id}" ${+t?.linked_article_id===a.id?'selected':''}>${esc(a.title)}</option>`).join('')}</select>`)}</div><label class="row"><input id="teShuffleQ" type="checkbox" style="width:auto" ${t?.shuffle_questions!==false?'checked':''}> Перемешивать вопросы</label><label class="row"><input id="teShuffleO" type="checkbox" style="width:auto" ${t?.shuffle_options!==false?'checked':''}> Перемешивать варианты ответов</label><label class="row"><input id="teAutoAck" type="checkbox" style="width:auto" ${t?.auto_assign_on_ack?'checked':''}> Назначать автоматически после «Ознакомился» в связанной статье</label>${field('Срок после ознакомления, дней',`<input id="teAutoDays" type="number" min="1" value="${t?.auto_due_days??''}" placeholder="Без срока">`)}<div class="row" style="margin-top:12px"><button class="btn" onclick="saveTestEditor()">Сохранить</button>${t?`<button class="btn secondary" onclick="openTestAssign(${t.id})">Назначить</button><button class="btn secondary" onclick="requestAiTestDraft(${t.id})">AI-черновик</button>`:''}</div>${t?`<h3>Банк вопросов · ${t.questions?.length||0}</h3>${(t.questions||[]).map((q,i)=>`<div class="test-q-list-item"><div class="row between"><div><b>${i+1}. ${esc(q.text)}</b><div class="small">${q.question_type==='single'?'Один ответ':q.question_type==='multiple'?'Несколько ответов':'Текстовый'}${q.has_image?' · 📷':''}${q.active?'':' · выключен'}</div></div><button class="icon-btn" onclick="openTestQuestionEditor(${q.id})">✎</button></div></div>`).join('')}<button class="btn secondary" onclick="openTestQuestionEditor(null)">+ Добавить вопрос</button>`:'<div class="notice">Сохраните тест, после этого можно добавлять вопросы.</div>'}`;if(t?.questions)hydrateTestEditorQuestionImages()}
async function saveTestEditor(){const payload={title:teTitle.value.trim(),description:teDesc.value.trim()||null,status:teStatus.value,linked_article_id:teArticle.value?+teArticle.value:null,auto_assign_on_ack:teAutoAck.checked,auto_due_days:teAutoDays.value?+teAutoDays.value:null,pass_percent:+tePass.value,time_limit_minutes:+teTime.value,attempts_allowed:+teAttempts.value,questions_to_draw:teDraw.value?+teDraw.value:null,shuffle_questions:teShuffleQ.checked,shuffle_options:teShuffleO.checked};try{const saved=state.testEditing?await api('/api/testing/tests/'+state.testEditing.id,{method:'PATCH',body:JSON.stringify(payload)}):await api('/api/testing/tests',{method:'POST',body:JSON.stringify(payload)});state.testEditing=saved;flash('Тест сохранён');await openTestEditor(saved.id)}catch(e){flash(e.message,'error')}}
function hydrateTestEditorQuestionImages(){}
function optionEditorRow(text='',correct=false,type='single'){const id='to'+Math.random().toString(36).slice(2);return `<div class="test-editor-option" data-test-option><input name="testCorrectEditor" type="${type==='single'?'radio':'checkbox'}" style="width:auto" ${correct?'checked':''}><input data-opt-text value="${esc(text)}" placeholder="Вариант ответа"><button class="icon-btn" onclick="this.closest('[data-test-option]').remove()">×</button></div>`}
async function openTestQuestionEditor(qid){const t=state.testEditing;if(!t)return;const q=qid?(t.questions||[]).find(x=>x.id===+qid):null;state.testQuestionEditing=q;document.getElementById('app').innerHTML=`${testHeader('editor')}<button class="btn secondary mini" onclick="openTestEditor(${t.id})">← К тесту</button><h2>${q?'Редактирование вопроса':'Новый вопрос'}</h2>${field('Вопрос',`<textarea id="tqText">${esc(q?.text||'')}</textarea>`)}${field('Тип',`<select id="tqType" onchange="rebuildTestQuestionType()"><option value="single" ${q?.question_type!=='multiple'&&q?.question_type!=='text'?'selected':''}>Один правильный ответ</option><option value="multiple" ${q?.question_type==='multiple'?'selected':''}>Несколько правильных</option><option value="text" ${q?.question_type==='text'?'selected':''}>Текстовый ответ</option></select>`)}<div id="tqAnswerArea"></div><label class="row"><input id="tqActive" type="checkbox" style="width:auto" ${q?.active!==false?'checked':''}> Активный вопрос</label>${q?`<div class="card"><b>Изображение к вопросу</b><div class="small">Фото хранится в Telegram.</div>${q.has_image?`<img class="test-image" data-test-q-image="${q.id}"><div class="row"><button class="btn secondary mini" onclick="requestTestQuestionPhoto(${q.id})">Заменить фото</button><button class="btn danger mini" onclick="deleteTestQuestionPhoto(${q.id})">Удалить</button></div>`:`<button class="btn secondary" style="margin-top:8px" onclick="requestTestQuestionPhoto(${q.id})">+ Добавить фото</button>`}</div>`:'<div class="notice">Фото можно добавить после сохранения вопроса.</div>'}<div class="row"><button class="btn" onclick="saveTestQuestion()">Сохранить</button>${q?`<button class="btn danger" onclick="deleteTestQuestion(${q.id})">Удалить</button>`:''}</div>`;rebuildTestQuestionType(q);hydrateTestImages()}
function rebuildTestQuestionType(q=null){const type=document.getElementById('tqType').value,area=document.getElementById('tqAnswerArea');q=q||state.testQuestionEditing;if(type==='text'){area.innerHTML=field('Допустимые правильные ответы (каждый с новой строки)',`<textarea id="tqTextAccepted" placeholder="Ответ 1\nОтвет 2">${esc((q?.accepted_text||[]).join('\n'))}</textarea>`);return}const opts=q?.question_type===type?(q.options||[]):[];area.innerHTML=`<h3>Варианты ответов</h3><div id="tqOptions" class="test-editor-options">${(opts.length?opts:[{text:'',is_correct:true},{text:'',is_correct:false}]).map(o=>optionEditorRow(o.text,o.is_correct,type)).join('')}</div><button class="btn secondary mini" onclick="document.getElementById('tqOptions').insertAdjacentHTML('beforeend',optionEditorRow('',false,document.getElementById('tqType').value))">+ Вариант</button>`}
async function saveTestQuestion(){const type=tqType.value;const options=type==='text'?[]:[...document.querySelectorAll('[data-test-option]')].map(r=>({text:r.querySelector('[data-opt-text]').value.trim(),is_correct:r.querySelector('input[type=radio],input[type=checkbox]').checked})).filter(x=>x.text);const accepted=type==='text'?(tqTextAccepted.value||'').split(/\n/).map(x=>x.trim()).filter(Boolean):[];const payload={text:tqText.value.trim(),question_type:type,options,accepted_text:accepted,explanation_internal:null,active:tqActive.checked,sort_order:state.testQuestionEditing?.sort_order??(state.testEditing.questions?.length||0)};try{if(state.testQuestionEditing)await api('/api/testing/questions/'+state.testQuestionEditing.id,{method:'PATCH',body:JSON.stringify(payload)});else await api(`/api/testing/tests/${state.testEditing.id}/questions`,{method:'POST',body:JSON.stringify(payload)});flash('Вопрос сохранён');await openTestEditor(state.testEditing.id)}catch(e){flash(e.message,'error')}}
async function deleteTestQuestion(id){if(!confirm('Удалить вопрос? Если он уже использовался в попытках, он будет просто отключён.'))return;await api('/api/testing/questions/'+id,{method:'DELETE'});flash('Готово');await openTestEditor(state.testEditing.id)}
async function requestTestQuestionPhoto(id){try{await api(`/api/testing/questions/${id}/photo-request`,{method:'POST',body:'{}'});sessionStorage.setItem('test_last_editor',String(state.testEditing?.id||''));flash('Отправьте фото в чат с ботом');setTimeout(()=>tg?.close?.(),500)}catch(e){flash(e.message,'error')}}
async function deleteTestQuestionPhoto(id){await api(`/api/testing/questions/${id}/photo`,{method:'DELETE'});flash('Фото удалено');await openTestEditor(state.testEditing.id)}
async function openTestAssign(testId){const meta=await getTestMeta();showSheet(`<h3>Назначить тест</h3><div class="small">Можно выбрать одновременно сотрудников, роли и магазины. Повторы автоматически исключаются.</div>${field('Конкретные сотрудники',`<select id="taEmployees" multiple size="6">${meta.employees.map(e=>`<option value="${e.id}">${esc(e.full_name)} · ${esc(roleNames[e.position]||e.position)}</option>`).join('')}</select>`)}${field('Роли',`<select id="taRoles" multiple size="5">${meta.roles.map(r=>`<option value="${r}">${esc(roleNames[r]||r)}</option>`).join('')}</select>`)}${field('Магазины',`<select id="taStores" multiple size="5">${meta.stores.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select>`)}${field('Срок прохождения',`<input id="taDue" type="datetime-local">`)}<button class="btn" onclick="submitTestAssign(${testId})">Назначить</button>`)}
async function submitTestAssign(testId){const vals=id=>[...document.getElementById(id).selectedOptions].map(x=>x.value);try{const r=await api(`/api/testing/tests/${testId}/assign`,{method:'POST',body:JSON.stringify({employee_ids:vals('taEmployees').map(Number),roles:vals('taRoles'),store_ids:vals('taStores').map(Number),due_at:taDue.value?new Date(taDue.value).toISOString():null})});closeWorkSheet();flash(`Назначено: ${r.total}`)}catch(e){flash(e.message,'error')}}
async function requestAiTestDraft(){try{await api('/api/testing/ai-draft',{method:'POST',body:'{}'})}catch(e){flash(e.message,'error')}}

auth().catch(e=>{document.getElementById('app').innerHTML=`<div class="notice error">${esc(e.message)}</div>`});
</script>
</body></html>
